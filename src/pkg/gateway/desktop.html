<!DOCTYPE html>
<!--
  PasClaw Desktop -- the retro desktop client, in the browser.

  One file, vanilla ES2020, no build step: the same house rule webui.html
  follows, so editing this file and re-running `make` is the whole workflow.

  It is the twin of the FireMonkey client in desktop/: both drive the same
  /v1/* surface (PasClaw.Gateway.Desktop) and both take their colors from the
  SAME generated palette table, so a style looks identical in either. The
  palette block below is machine-generated from the styles repo -- see
  scripts/export-retro-palettes.py. Do not hand-edit colors.
-->

/* ==========================================================================
   Chrome
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body {
  height: 100%; margin: 0; overflow: hidden;
  font: 12px/1.4 var(--font); color: var(--text);
  background: var(--desktop);
  -webkit-font-smoothing: none;
}
button, input, select, textarea { font: inherit; color: inherit; }

/* The bevel system. Retro chrome is 1-2px light/dark edges, which is exactly
   what an inset box-shadow expresses -- no images, crisp at any zoom. */
.out {
  background: var(--face);
  box-shadow:
    inset 1px 1px 0 0 var(--light), inset -1px -1px 0 0 var(--darkshadow),
    inset 2px 2px 0 0 var(--highlight), inset -2px -2px 0 0 var(--shadow);
}
.in {
  background: var(--window);
  box-shadow:
    inset 1px 1px 0 0 var(--shadow), inset -1px -1px 0 0 var(--highlight),
    inset 2px 2px 0 0 var(--darkshadow), inset -2px -2px 0 0 var(--light);
}
.thin { box-shadow: inset 1px 1px 0 0 var(--shadow), inset -1px -1px 0 0 var(--highlight); }

#desktop {
  position: absolute; inset: 0 0 34px 0;
  background: var(--desktop); overflow: hidden;
}

/* The project tree is a DOCK, not a floating window: it is the shell's
   permanent left edge (the plan's "left side of the Desktop is a treeview"),
   so windows and icons live in #stage beside it rather than on top of it. */
#dock {
  position: absolute; left: 0; top: 0; bottom: 0; width: 232px;
  display: flex; flex-direction: column; padding: 3px;
}
#dock.hidden { display: none; }
#dockhead {
  flex: 0 0 auto; height: 20px; display: flex; align-items: center; gap: 4px;
  padding: 0 2px 0 4px; font-weight: bold; font-size: 11px;
  background: var(--titlea);
  background-image: linear-gradient(90deg, var(--titlea), var(--titlea2));
  color: var(--titleatext); user-select: none;
}
#dockhead .t { flex: 1 1 auto; }
#treebody { flex: 1 1 auto; margin-top: 2px; overflow: auto; }
#dockfoot { flex: 0 0 auto; display: flex; gap: 3px; padding-top: 3px; }
#dockfoot .btn { flex: 1 1 auto; font-size: 11px; }
/* Drag handle for the dock's width. */
#dockgrip {
  position: absolute; top: 0; bottom: 0; right: -2px; width: 5px;
  cursor: ew-resize; z-index: 5;
}

#stage { position: absolute; left: 232px; right: 0; top: 0; bottom: 0; overflow: hidden; }
#stage.wide { left: 0; }

/* ---- narrow screens ----

   A 232px dock beside a stage is a sidebar on a laptop and 60% of the
   screen on a phone (measured: 232 of 390). Below 720px the dock stops
   taking room from the stage and becomes an overlay you summon --
   still the same tree, still the same buttons, just not permanently in
   the way. The stage gets the whole width, which is what the windows
   need to be reachable at all.

   The taskbar keeps its Start button, so the dock is one tap away. */
@media (max-width: 720px) {
  #stage { left: 0 !important; }
  #dock {
    width: min(78vw, 300px);
    z-index: 9000;
    box-shadow: 3px 0 12px rgba(0, 0, 0, 0.45);
    background: var(--face, var(--desktop));
  }
  /* Off-canvas until asked for. `.hidden` still hides it outright, so
     the existing hide/show path keeps working. */
  #dock:not(.on) { transform: translateX(-102%); }
  #dock.on { transform: none; }
  /* Icons are for a pointer and a big screen; the dock is the way
     around on a small one. */
  #icons { display: none; }
  .taskbtn { min-width: 84px; max-width: 120px; }
}

/* ---- desktop icons ---- */
#icons { position: absolute; inset: 0; padding: 6px; }
.dicon {
  position: absolute; width: 84px; padding: 4px 2px; text-align: center;
  cursor: default; user-select: none;
}
.dicon .glyph {
  width: 34px; height: 30px; margin: 0 auto 3px; display: block;
}
.dicon .cap {
  display: inline-block; padding: 1px 3px; color: var(--titleatext);
  text-shadow: 1px 1px 0 rgba(0,0,0,.55); font-size: 11px; word-break: break-word;
}
.dicon.sel .cap {
  background: var(--selection); color: var(--selectiontext);
  outline: 1px dotted var(--selectiontext); text-shadow: none;
}

/* ---- windows ---- */
.win {
  position: absolute; display: flex; flex-direction: column;
  min-width: 200px; min-height: 110px; padding: 3px;
}
.win.min { display: none; }
.win.max { left: 0 !important; top: 0 !important; }
.titlebar {
  display: flex; align-items: center; gap: 3px; height: 20px;
  padding: 0 2px 0 3px; flex: 0 0 auto; cursor: default; user-select: none;
  background: var(--titlei);
  background-image: linear-gradient(90deg, var(--titlei), var(--titlei2));
  color: var(--titleitext);
}
.win.active .titlebar {
  background: var(--titlea);
  background-image: linear-gradient(90deg, var(--titlea), var(--titlea2));
  color: var(--titleatext);
}
.titlebar .t {
  flex: 1 1 auto; font-weight: bold; font-size: 11px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tbtn {
  width: 16px; height: 14px; padding: 0; border: 0; line-height: 1;
  background: var(--face); color: var(--text); cursor: default;
  display: grid; place-items: center; font-size: 10px;
  box-shadow: inset 1px 1px 0 0 var(--light), inset -1px -1px 0 0 var(--darkshadow),
              inset 2px 2px 0 0 var(--highlight), inset -2px -2px 0 0 var(--shadow);
}
.tbtn:active {
  box-shadow: inset 1px 1px 0 0 var(--shadow), inset -1px -1px 0 0 var(--highlight),
              inset 2px 2px 0 0 var(--darkshadow), inset -2px -2px 0 0 var(--light);
}
.wbody { flex: 1 1 auto; margin-top: 2px; overflow: auto; position: relative; }
.wbody.pad { padding: 6px; }
.grip {
  position: absolute; width: 8px; height: 8px; right: 0; bottom: 0;
  cursor: nwse-resize;
}
.edge { position: absolute; }
.edge.n { left: 4px; right: 4px; top: -1px; height: 5px; cursor: ns-resize; }
.edge.s { left: 4px; right: 4px; bottom: -1px; height: 5px; cursor: ns-resize; }
.edge.w { top: 4px; bottom: 4px; left: -1px; width: 5px; cursor: ew-resize; }
.edge.e { top: 4px; bottom: 4px; right: -1px; width: 5px; cursor: ew-resize; }
.edge.nw { left: -1px; top: -1px; width: 8px; height: 8px; cursor: nwse-resize; }
.edge.ne { right: -1px; top: -1px; width: 8px; height: 8px; cursor: nesw-resize; }
.edge.sw { left: -1px; bottom: -1px; width: 8px; height: 8px; cursor: nesw-resize; }
.edge.se { right: -1px; bottom: -1px; width: 8px; height: 8px; cursor: nwse-resize; }
/* While a drag is live the iframes must stop swallowing mousemove. */
body.dragging iframe { pointer-events: none; }

/* ---- taskbar ---- */
#taskbar {
  position: absolute; left: 0; right: 0; bottom: 0; height: 34px;
  display: flex; align-items: center; gap: 4px; padding: 3px 4px;
}
#startbtn { min-width: 62px; height: 24px; font-weight: bold; gap: 4px; }
.tb-sep { width: 2px; align-self: stretch; margin: 2px 1px;
          box-shadow: inset 1px 0 0 0 var(--shadow), inset -1px 0 0 0 var(--highlight); }
#tasks { flex: 1 1 auto; display: flex; gap: 3px; overflow: hidden; }
.taskbtn {
  min-width: 120px; max-width: 168px; height: 24px; text-align: left;
  padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.taskbtn.on {
  box-shadow: inset 1px 1px 0 0 var(--shadow), inset -1px -1px 0 0 var(--highlight),
              inset 2px 2px 0 0 var(--darkshadow), inset -2px -2px 0 0 var(--light);
  font-weight: bold;
}
.taskbtn.flash { animation: flash 1s steps(1) infinite; }
@keyframes flash { 50% { background: var(--selection); color: var(--selectiontext); } }
#pager { display: flex; gap: 2px; }
.pgbtn { width: 22px; height: 24px; padding: 0; }
.pgbtn.on {
  box-shadow: inset 1px 1px 0 0 var(--shadow), inset -1px -1px 0 0 var(--highlight),
              inset 2px 2px 0 0 var(--darkshadow), inset -2px -2px 0 0 var(--light);
  font-weight: bold;
}
#clock { min-width: 62px; height: 24px; display: grid; place-items: center; font-size: 11px; }

/* ---- generic controls ---- */
.btn {
  min-height: 22px; padding: 2px 10px; border: 0; cursor: default;
  background: var(--face); color: var(--text);
  display: inline-flex; align-items: center; justify-content: center;
  box-shadow: inset 1px 1px 0 0 var(--light), inset -1px -1px 0 0 var(--darkshadow),
              inset 2px 2px 0 0 var(--highlight), inset -2px -2px 0 0 var(--shadow);
}
.btn:active:not(:disabled) {
  box-shadow: inset 1px 1px 0 0 var(--shadow), inset -1px -1px 0 0 var(--highlight),
              inset 2px 2px 0 0 var(--darkshadow), inset -2px -2px 0 0 var(--light);
}
.btn:disabled { color: var(--disabledtext); text-shadow: 1px 1px 0 var(--highlight); }
.btn:focus-visible { outline: 1px dotted var(--text); outline-offset: -4px; }
.fld {
  border: 0; padding: 3px 4px; background: var(--window); color: var(--text);
  box-shadow: inset 1px 1px 0 0 var(--shadow), inset -1px -1px 0 0 var(--highlight),
              inset 2px 2px 0 0 var(--darkshadow), inset -2px -2px 0 0 var(--light);
}
.fld:focus { outline: none; }
.list { background: var(--window); overflow: auto; padding: 1px; }
.list .row {
  padding: 1px 4px; cursor: default; user-select: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.list .row.sel { background: var(--selection); color: var(--selectiontext); }
.statusbar {
  flex: 0 0 auto; margin-top: 2px; padding: 2px 5px; font-size: 11px;
  min-height: 18px; display: flex; gap: 6px; align-items: center;
}
.muted { color: var(--disabledtext); }
h1,h2,h3 { margin: 0 0 6px; font-size: 12px; }

/* ---- menu ---- */
#menu {
  position: absolute; bottom: 34px; left: 4px; width: 208px; padding: 3px;
  display: none; z-index: 99999;
}
#menu.on { display: block; }
#menu .mi {
  padding: 5px 8px; cursor: default; user-select: none;
  display: flex; align-items: center; gap: 8px;
}
#menu .mi:hover { background: var(--selection); color: var(--selectiontext); }
#menu .msep { height: 2px; margin: 3px 2px;
  box-shadow: inset 0 1px 0 0 var(--shadow), inset 0 -1px 0 0 var(--highlight); }

/* ---- tree (Projects -> Tasks -> Jobs) ---- */
.tree { padding: 2px 0; user-select: none; }
.node { padding: 1px 4px 1px 0; white-space: nowrap; cursor: default;
        display: flex; align-items: center; gap: 3px; }
.node:hover { text-decoration: underline; }
.node.sel { background: var(--selection); color: var(--selectiontext); }
.twist { width: 12px; text-align: center; font-size: 9px; flex: 0 0 12px; }
.badge {
  font-size: 9px; padding: 0 3px; margin-left: 4px;
  background: var(--face); color: var(--text);
  box-shadow: inset 1px 1px 0 0 var(--highlight), inset -1px -1px 0 0 var(--shadow);
}
.st-todo    { color: var(--disabledtext); }
.st-active  { color: var(--accent); font-weight: bold; }
.st-done    { color: var(--text); }
.st-blocked { color: #a00; font-weight: bold; }

/* ---- chat ---- */
.chat { display: flex; flex-direction: column; height: 100%; }
.log { flex: 1 1 auto; overflow: auto; padding: 5px; background: var(--window); }
.msg { margin: 0 0 8px; }
.msg .who { font-weight: bold; font-size: 10px; letter-spacing: .04em; }
.msg .body { white-space: pre-wrap; word-break: break-word; }
.msg.u .who { color: var(--accent); }
.tool {
  font-size: 11px; color: var(--disabledtext); margin: 2px 0 2px 8px;
  white-space: pre-wrap; word-break: break-word;
}

/* ---- rendered markdown in chat bodies ----
   .body is pre-wrap for plain text; a rendered body switches to normal
   flow and lets the block elements do the spacing. Everything is
   colored from the theme variables, because these bubbles appear in
   every skin from Win95 grey to synthwave neon and a hard-coded palette
   would be wrong in most of them. */
.msg .body.md { white-space: normal; }
.msg .body.md p { margin: 0 0 6px; }
.msg .body.md p:last-child, .msg .body.md ul:last-child,
.msg .body.md ol:last-child { margin-bottom: 0; }
.msg .body.md h1, .msg .body.md h2, .msg .body.md h3,
.msg .body.md h4, .msg .body.md h5, .msg .body.md h6 {
  margin: 8px 0 4px; font-size: 13px;
}
.msg .body.md h1 { font-size: 15px; }
.msg .body.md h2 { font-size: 14px; }
.msg .body.md ul, .msg .body.md ol { margin: 0 0 6px; padding-left: 20px; }
.msg .body.md li { margin: 1px 0; }
.msg .body.md code.ic {
  font-family: "Courier New", monospace; font-size: 11px;
  border: 1px solid var(--shadow); padding: 0 3px;
}
.msg .body.md blockquote {
  margin: 4px 0 6px; padding: 2px 8px;
  border-left: 3px solid var(--shadow); color: var(--disabledtext);
}
.msg .body.md hr { border: none; border-top: 1px solid var(--shadow); margin: 6px 0; }
.msg .body.md img.md-img { max-width: 100%; }
.msg .body.md a { color: var(--accent); }
.code-wrap {
  margin: 4px 0 6px;
  box-shadow: inset 1px 1px 0 0 var(--shadow), inset -1px -1px 0 0 var(--highlight);
}
.code-wrap .code-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 2px 6px; background: var(--face); color: var(--text);
  font-size: 10px;
}
.code-wrap .copy-btn { font-size: 10px; padding: 0 6px; }
.code-wrap pre {
  margin: 0; padding: 4px 6px; overflow-x: auto;
  font-family: "Courier New", monospace; font-size: 11px;
  background: var(--window); color: var(--text);
}

/* ---- tool cards: the turn's work, one click from its receipt ----
   The streamed summary line is the clickable header; the body opens to
   the full arguments and the full result (or the error). A sunken
   panel rather than the web UI's neon border, because these live on a
   retro desktop and should look like part of the furniture. */
details.tcard {
  margin: 4px 0 4px 8px; background: var(--face);
  box-shadow: inset 1px 1px 0 0 var(--shadow), inset -1px -1px 0 0 var(--highlight);
}
details.tcard > summary {
  cursor: pointer; list-style: none;
  display: flex; align-items: center; gap: 5px; padding: 2px 6px;
  font-size: 11px; color: var(--text);
  white-space: nowrap; overflow: hidden;
}
details.tcard > summary::-webkit-details-marker { display: none; }
details.tcard > summary::before { content: "▸"; flex: 0 0 auto; }
details.tcard[open] > summary::before { content: "▾"; }
details.tcard > summary .tc-call {
  overflow: hidden; text-overflow: ellipsis;
  font-family: "Courier New", monospace;
}
details.tcard.err > summary { color: #a00; font-weight: bold; }
details.tcard .tc-body {
  border-top: 1px solid var(--shadow); background: var(--window);
  padding: 3px 6px; max-height: 240px; overflow: auto;
}
details.tcard .tc-body pre {
  margin: 1px 0 6px; white-space: pre-wrap; word-break: break-word;
  font-family: "Courier New", monospace; font-size: 11px; color: var(--text);
}
details.tcard .tc-h {
  font-size: 9px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--disabledtext);
}
.composer { flex: 0 0 auto; display: flex; gap: 4px; padding: 4px 0 0; }
.composer textarea { flex: 1 1 auto; resize: none; height: 46px; }

/* The artifact card: an app or page the turn produced, sitting in the
   transcript with a Run button. The desktop's central gesture. */
.artifact {
  margin: 6px 0; padding: 6px; display: flex; gap: 8px; align-items: center;
  background: var(--face);
  box-shadow: inset 1px 1px 0 0 var(--light), inset -1px -1px 0 0 var(--darkshadow),
              inset 2px 2px 0 0 var(--highlight), inset -2px -2px 0 0 var(--shadow);
}
.artifact .ico { width: 32px; height: 32px; flex: 0 0 32px; }
.artifact .meta { flex: 1 1 auto; min-width: 0; }
.artifact .nm { font-weight: bold; white-space: nowrap; overflow: hidden;
                text-overflow: ellipsis; }
.artifact .kd { font-size: 10px; color: var(--disabledtext); }

iframe.app { width: 100%; height: 100%; border: 0; background: var(--window); display: block; }

/* App window with the editing chat docked left: [chat][grip][app]. The
   pane starts hidden; the statusbar's Chat button toggles it, the grip
   resizes it. */
.appsplit { display: flex; height: 100%; min-height: 0; }
.appside  {
  flex: 0 0 auto; width: 260px; min-width: 180px; max-width: 70%;
  display: flex; min-height: 0; padding: 3px;
}
.appside .chat { flex: 1 1 auto; min-width: 0; }
.appgrip  {
  flex: 0 0 5px; cursor: col-resize;
  background: var(--face); border-left: 1px solid var(--light);
  border-right: 1px solid var(--shadow);
}
.appsplit iframe.app { flex: 1 1 auto; width: auto; min-width: 0; }

/* ---- period-native agent output ----
   The agent speaks in the era's own furniture: a plan arrives as a wizard,
   a question as a message box, work in progress as a progress dialog. All of
   it is built from the same role variables as everything else, so it reskins
   with the style like real chrome would. */
.wizard { display: flex; flex-direction: column; height: 100%; }
.wizard .page { flex: 1 1 auto; overflow: auto; padding: 8px; }
.wizard .steps { margin: 0; padding-left: 20px; }
.wizard .steps li { margin: 3px 0; }
.wizard .steps li.cur { font-weight: bold; }
.wizard .foot {
  flex: 0 0 auto; display: flex; gap: 4px; justify-content: flex-end;
  padding: 5px 4px 2px; margin-top: 3px;
  box-shadow: inset 0 2px 0 -1px var(--shadow), inset 0 3px 0 -2px var(--highlight);
}
.wizard .side {
  float: left; width: 78px; height: 92px; margin: 0 10px 6px 0;
  background: var(--titlea);
  background-image: linear-gradient(160deg, var(--titlea), var(--titlea2));
}
.msgbox { display: flex; gap: 10px; padding: 10px 8px 4px; }
.msgbox .ico { width: 32px; height: 32px; flex: 0 0 32px; }
.msgbox .text { flex: 1 1 auto; white-space: pre-wrap; }
.msgfoot {
  display: flex; gap: 5px; justify-content: center; padding: 6px 4px 4px;
}
.prog { padding: 10px; }
.prog .bar {
  height: 18px; margin-top: 8px; padding: 2px; background: var(--window);
  box-shadow: inset 1px 1px 0 0 var(--shadow), inset -1px -1px 0 0 var(--highlight),
              inset 2px 2px 0 0 var(--darkshadow), inset -2px -2px 0 0 var(--light);
}
/* The blocks are the era's detail: a progress bar was chunks, not a sweep. */
.prog .fill {
  height: 100%; background-image:
    repeating-linear-gradient(90deg, var(--progress) 0 9px, transparent 9px 11px);
  transition: width .25s steps(4);
}
.prog .what { font-size: 11px; margin-top: 5px; color: var(--disabledtext); }

/* Sources strip echo in the Browser window's status bar. */
.grounded  { color: var(--text); }
.ungrounded{ color: #a00; font-weight: bold; }

/* The shell window's composer: the ask field's home now that the
   background has been retired as an input surface. */
.shellcomposer { display: flex; flex-direction: column; gap: 4px; padding: 3px; }
.shellcomposer textarea {
  width: 100%; min-height: 3.4em; resize: vertical; font: inherit; padding: 3px 4px;
}
.shellrow { display: flex; gap: 4px; align-items: center; }
.shellrow .muted { flex: 1 1 auto; font-size: 11px; }
.shellchips {
  display: flex; flex-wrap: wrap; gap: 4px;
  padding: 0 3px 3px; justify-content: flex-start;
}
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; cursor: pointer;
  background: var(--face); color: var(--text);
  border: 1px solid var(--shadow); border-radius: 999px;
  font-size: 11px; user-select: none;
}
.chip:hover { background: var(--light); }
.chip svg { width: 12px; height: 12px; }
</style>
</head>
<body>

<div id="desktop">
  <div id="dock" class="out">
    <div id="dockhead">
      <span class="t">Projects</span>
      <button class="tbtn" id="dockhide" title="Hide the dock">&#9666;</button>
    </div>
    <div id="treebody" class="in"></div>
    <div id="dockfoot">
      <button class="btn" id="newproj">New Project</button>
      <button class="btn" id="refresh" title="Reload the board">&#8635;</button>
    </div>
    <div id="dockgrip"></div>
  </div>
  <div id="stage">
    <div id="icons"></div>
    <!-- The ask surface is built into the shell window (openShell) rather
         than sitting here on the background. It lived here until measuring
         found the obvious: the background is UNDER every window, so the
         desktop's primary input vanished the moment an app was open --
         which is always, since building one opens its window over the
         field. The taskbar button is a home that cannot be covered. -->
  </div>
</div>

<div id="menu" class="out"></div>

<div id="taskbar" class="out">
  <button id="startbtn" class="btn">
    <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
      <path fill="currentColor" d="M2 3h5v5H2zM9 3h5v5H9zM2 9h5v5H2zM9 9h5v5H9z"/>
    </svg>
    PasClaw
  </button>
  <div class="tb-sep"></div>
  <!-- The two surfaces that must never be buried. Anchored here rather
       than floated on the background, because anything on the background
       is under every window the moment work is happening. -->
  <button id="tb-shell" class="btn" title="Talk to the desktop (Ctrl+K)">Ask</button>
  <button id="tb-log" class="btn" title="What the gateway is doing">Log</button>
  <div class="tb-sep"></div>
  <div id="tasks"></div>
  <div class="tb-sep"></div>

  <div id="clock" class="thin"></div>
</div>

<script>
"use strict";

/* ==========================================================================
   API
   ========================================================================== */

/* The gateway may be bearer-gated. webui.html keeps its token in
   localStorage under this key; reuse it so opening the desktop after the
   classic UI needs no second login. */
const TOKEN_KEY = "pasclaw.gw.token";
function token() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; } }

/* ==========================================================================
   The activity log

   The Log window streamed /v1/logs and showed six lines: the gateway
   logs its own lifecycle, not the traffic through it, so a window
   opened to answer "what is it doing right now" answered "what it did
   at startup" and then sat there. Measured: 469 characters after forty
   API calls and a deliberate 404.

   Three sources now feed one buffer -- the gateway's own log, the
   desktop event feed, and the calls this page makes, which it can see
   for nothing. That is what the FMX client's log window shows, and the
   reason it looks useful. The buffer exists whether or not the window
   is open, so opening it shows what already happened rather than
   starting from blank.

   Bounded: a busy desktop out-produces any reader, and an unbounded log
   is a memory leak with a scrollbar. */
const ACTIVITY = [];
const ACTIVITY_CAP = 800;
let activitySink = null;

function activity(tag, text) {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  const ss = String(now.getSeconds()).padStart(2, "0");
  const line = `${hh}:${mm}:${ss} [${tag}] ${text}`;
  ACTIVITY.push(line);
  while (ACTIVITY.length > ACTIVITY_CAP) ACTIVITY.shift();
  if (activitySink) { try { activitySink(line); } catch {} }
  return line;
}

async function api(path, opts = {}) {
  const o = Object.assign({}, opts);
  o.headers = Object.assign({ "content-type": "application/json" }, o.headers || {});
  const t = token();
  if (t) o.headers["authorization"] = "Bearer " + t;
  if (o.body && typeof o.body !== "string") o.body = JSON.stringify(o.body);
  const started = Date.now();
  const r = await fetch(path, o);
  const text = await r.text();
  /* Every call this page makes, with what came back -- the traffic the
     gateway's own log does not carry. */
  activity(r.ok ? "http" : "http!",
           `${o.method || "GET"} ${path} -> ${r.status} (${Date.now() - started}ms)`);
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch { /* not json */ }
  if (!r.ok) {
    const msg = (json && json.error) || text || ("http " + r.status);
    const e = new Error(msg);
    e.status = r.status;
    /* Carry the whole body: a 409 consent refusal returns the command the
       caller must show before asking again. */
    e.detail = json;
    throw e;
  }
  return json;
}

/* ==========================================================================
   State
   ========================================================================== */

const S = {
  workspaces: [], active: "workspace",
  projects: [], tree: {},          /* project -> { open, tasks: [...] } */
  selected: null,
  /* Archived projects are excluded from `projects` unless this is on;
     archivedCount is how many were left out, so the dock can offer to
     show them without asking the server again. */
  showArchived: false, archivedCount: 0, projectNames: [],
  /* When set, the dock shows that project (chat + actions) instead of the
     board; the board is one "◂ Projects" away. See paintProjectPane. */
  dockProject: null,
  styles: [], style: "Win95",
  /* Where generated apps are served from. Empty means the same origin as
     this page -- workable, but then an app shares localStorage with the
     desktop. A gateway started with --apps-port reports a separate origin
     here and app frames go there instead. */
  appsOrigin: "", appsIsolated: false,
  /* The machine app PROCESSES run on. Not necessarily this machine: open a
     remote gateway and a "local" app is local to the server, not to you.
     The UI says so rather than letting the desktop metaphor imply it. */
  host: "",
};

/* Absolute URL for an app's content, honouring the apps origin. */
function appURL(project, suffix) {
  return (S.appsOrigin || "") + "/apps/" + encodeURIComponent(project) +
         "/" + (suffix || "");
}

const $  = (s, r = document) => r.querySelector(s);
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};

/* ==========================================================================
   Icons -- inline SVG, drawn in palette colors so they reskin with the style.
   ========================================================================== */
const ICONS = {
  folder: `<svg viewBox="0 0 32 32"><path fill="var(--face)" stroke="var(--darkshadow)"
    d="M2.5 6.5h10l3 3h14v18h-27z"/><path fill="var(--highlight)" d="M3.5 7.5h9l3 3h12v2h-24z"/></svg>`,
  app: `<svg viewBox="0 0 32 32"><rect x="3.5" y="3.5" width="25" height="25"
    fill="var(--window)" stroke="var(--darkshadow)"/><rect x="4.5" y="4.5" width="23" height="5"
    fill="var(--titlea)"/><rect x="7" y="13" width="18" height="2" fill="var(--shadow)"/>
    <rect x="7" y="18" width="12" height="2" fill="var(--shadow)"/></svg>`,
  page: `<svg viewBox="0 0 32 32"><path fill="var(--window)" stroke="var(--darkshadow)"
    d="M7.5 2.5h13l5 5v22h-18z"/><path fill="var(--face)" stroke="var(--darkshadow)"
    d="M20.5 2.5v5h5"/><g fill="var(--shadow)"><rect x="10" y="12" width="12" height="1.6"/>
    <rect x="10" y="16" width="12" height="1.6"/><rect x="10" y="20" width="8" height="1.6"/></g></svg>`,
  chat: `<svg viewBox="0 0 32 32"><path fill="var(--window)" stroke="var(--darkshadow)"
    d="M3.5 5.5h25v16h-14l-7 6v-6h-4z"/><g fill="var(--shadow)"><rect x="7" y="10" width="16" height="1.6"/>
    <rect x="7" y="14" width="11" height="1.6"/></g></svg>`,
  disk: `<svg viewBox="0 0 32 32"><rect x="4.5" y="4.5" width="23" height="23"
    fill="var(--face)" stroke="var(--darkshadow)"/><rect x="9" y="5" width="14" height="9"
    fill="var(--window)" stroke="var(--shadow)"/><rect x="12" y="6" width="4" height="7"
    fill="var(--darkshadow)"/><rect x="8" y="18" width="16" height="8" fill="var(--light)"
    stroke="var(--shadow)"/></svg>`,
  globe: `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12.5" fill="var(--window)"
    stroke="var(--darkshadow)"/><ellipse cx="16" cy="16" rx="5.5" ry="12.5" fill="none"
    stroke="var(--shadow)"/><path d="M4 12h24M4 20h24" stroke="var(--shadow)" fill="none"/></svg>`,
  brain: `<svg viewBox="0 0 32 32"><rect x="3.5" y="6.5" width="25" height="19"
    fill="var(--window)" stroke="var(--darkshadow)"/><rect x="3.5" y="6.5" width="25" height="4"
    fill="var(--titlea)"/><g fill="var(--shadow)"><rect x="7" y="14" width="18" height="1.6"/>
    <rect x="7" y="18" width="14" height="1.6"/><rect x="7" y="22" width="9" height="1.6"/></g></svg>`,
  gear: `<svg viewBox="0 0 32 32"><rect x="4.5" y="4.5" width="23" height="23"
    fill="var(--face)" stroke="var(--darkshadow)"/><circle cx="16" cy="16" r="6"
    fill="var(--window)" stroke="var(--darkshadow)"/><circle cx="16" cy="16" r="2"
    fill="var(--accent)"/></svg>`,
};
function icon(name) { return ICONS[name] || ICONS.app; }

/* ==========================================================================
   Window manager
   ========================================================================== */

let zTop = 10, winSeq = 0, cascade = 0;
const WINS = new Map();

function desktopRect() { return $("#stage").getBoundingClientRect(); }

/* Is this a screen a desktop metaphor fits on?

   Not a device test -- a narrow BROWSER gets the same treatment, which
   is right: the problem is width, not what is holding it. 720px is
   where a 232px dock stops being a sidebar and starts being most of
   the screen. */
function isNarrow() { return window.innerWidth <= 720; }

/* Fit a window inside the stage.

   createWindow already clamps what it opens, but geometry also arrives
   from OUTSIDE that path -- a saved layout restored on a different
   screen, the browser being resized, an agent placing a window. A
   layout saved on a desktop and reopened on a phone put windows at
   788px on a 390px viewport with no horizontal scroll, so most of
   every window was simply unreachable. */
function clampWindow(w) {
  if (!w || !w.node || w.maximized) return;
  const r = desktopRect();
  if (r.width < 40 || r.height < 40) return;    /* mid-layout, not a real size */
  const n = w.node;
  let width  = Math.min(n.offsetWidth,  Math.max(160, r.width  - 8));
  let height = Math.min(n.offsetHeight, Math.max(100, r.height - 8));
  const left = Math.max(0, Math.min(n.offsetLeft, r.width  - width));
  const top  = Math.max(0, Math.min(n.offsetTop,  r.height - height));
  Object.assign(n.style, { left: left + "px", top: top + "px",
                           width: width + "px", height: height + "px" });
}

function clampAllWindows() { for (const w of WINS.values()) clampWindow(w); }

/* A window that no longer fits is a window you cannot use. Re-fit on
   resize and on rotation, debounced so a drag of the browser edge does
   not relayout on every pixel. */
let clampTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(clampTimer);
  clampTimer = setTimeout(() => { clampAllWindows(); saveDesktop(); }, 200);
});

function createWindow(opts) {
  const o = Object.assign({
    title: "Window", width: 480, height: 340, x: null, y: null,
    resizable: true, min: true, max: true, key: null, icon: "app",
    onClose: null,
  }, opts);

  /* A window with a key is a singleton -- reopening focuses the live one
     instead of stacking duplicates (Display Properties, the tree, Library). */
  if (o.key && WINS.has(o.key)) {
    const w = WINS.get(o.key);
    restoreWindow(w); focusWindow(w);
    return w;
  }

  const r = desktopRect();
  const width = Math.min(o.width, Math.max(220, r.width - 20));
  const height = Math.min(o.height, Math.max(140, r.height - 20));
  const x = o.x != null ? o.x : Math.min(24 + cascade * 22, Math.max(0, r.width - width - 10));
  const y = o.y != null ? o.y : Math.min(18 + cascade * 20, Math.max(0, r.height - height - 10));
  cascade = (cascade + 1) % 8;

  const n = el("div", "win out");
  n.style.left = x + "px"; n.style.top = y + "px";
  n.style.width = width + "px"; n.style.height = height + "px";
  n.style.zIndex = ++zTop;
  /* Marked here, applied once the window is in WINS -- see the end of
     createWindow. A phone has no room for a window that floats. */
  const openFull = isNarrow();

  const bar = el("div", "titlebar");
  const ttl = el("div", "t", o.title);
  bar.appendChild(ttl);
  const mkBtn = (label, title, fn) => {
    const b = el("button", "tbtn"); b.innerHTML = label; b.title = title;
    b.addEventListener("mousedown", e => e.stopPropagation());
    b.addEventListener("click", e => { e.stopPropagation(); fn(); });
    bar.appendChild(b); return b;
  };
  if (o.min) mkBtn("&#9866;", "Minimize", () => minimizeWindow(w));
  if (o.max) mkBtn("&#9633;", "Maximize", () => toggleMax(w));
  mkBtn("&#10005;", "Close", () => closeWindow(w));
  n.appendChild(bar);

  const body = el("div", "wbody" + (o.pad === false ? "" : " pad"));
  n.appendChild(body);

  const w = {
    id: ++winSeq, key: o.key, node: n, bar, body, title: o.title,
    icon: o.icon, minimized: false, maximized: false, prev: null,
    onClose: o.onClose, onActive: null,
    /* How to bring this window back after a reload. Only windows that CAN
       be reconstructed carry one -- a progress dialog or a wizard is tied
       to work that is over, and restoring it would be a lie about state. */
    restore: o.restore || null,
  };
  WINS.set(o.key || ("w" + w.id), w);
  n.__win = w;
  if (w.restore) saveDesktop();

  if (o.resizable) {
    ["n","s","w","e","nw","ne","sw","se"].forEach(d => {
      const g = el("div", "edge " + d);
      g.addEventListener("mousedown", e => startResize(e, w, d));
      n.appendChild(g);
    });
  }

  /* Click ANYWHERE on an inactive window activates it, and the same press
     also begins the drag -- no second click needed. That behavior is the
     one every one of these systems shared. */
  n.addEventListener("mousedown", () => focusWindow(w), true);
  bar.addEventListener("mousedown", e => startDrag(e, w));
  bar.addEventListener("dblclick", () => { if (o.max) toggleMax(w); });

  $("#stage").appendChild(n);
  focusWindow(w);
  /* Narrow screens get full windows. Done after the node is in the
     stage so toggleMax measures a real rect. */
  if (openFull && o.max && !restoring) toggleMax(w);
  paintTaskbar();
  return w;
}

function setTitle(w, t) { w.title = t; w.bar.querySelector(".t").textContent = t; paintTaskbar(); }

function focusWindow(w) {
  if (w.minimized) restoreWindow(w);
  for (const x of WINS.values()) {
    if (x === w) continue;
    if (x.node.classList.contains("active")) {
      x.node.classList.remove("active");
      if (x.onActive) x.onActive(false);
    }
  }
  if (!w.node.classList.contains("active")) {
    w.node.classList.add("active");
    if (w.onActive) w.onActive(true);
  }
  w.node.style.zIndex = ++zTop;
  paintTaskbar();
}

function minimizeWindow(w) {
  w.minimized = true; w.node.classList.add("min"); w.node.classList.remove("active");
  paintTaskbar();
}
function restoreWindow(w) {
  w.minimized = false; w.node.classList.remove("min");
  paintTaskbar();
}
function toggleMax(w) {
  const r = desktopRect();
  if (w.maximized) {
    Object.assign(w.node.style, w.prev);
    w.maximized = false; w.node.classList.remove("max");
  } else {
    w.prev = { left: w.node.style.left, top: w.node.style.top,
               width: w.node.style.width, height: w.node.style.height };
    Object.assign(w.node.style, { left: "0px", top: "0px",
      width: r.width + "px", height: r.height + "px" });
    w.maximized = true; w.node.classList.add("max");
  }
}
function maximizeWindow(w) { if (!w.maximized) toggleMax(w); }

/* Window arranging, which the shell exposes to the model.

   Both skip minimized windows -- a window the user put away should not
   come back because something else was tidied -- and both un-maximize
   first, since a maximized window has stored geometry to restore and
   moving it while maximized would strand that. */
function arrangeable() {
  return [...WINS.values()].filter(w => !w.node.classList.contains("min"));
}

function tileWindows() {
  const ws = arrangeable();
  if (!ws.length) return 0;
  const r = desktopRect();
  const cols = Math.ceil(Math.sqrt(ws.length));
  const rows = Math.ceil(ws.length / cols);
  const cw = Math.floor(r.width / cols), ch = Math.floor(r.height / rows);
  ws.forEach((w, i) => {
    if (w.maximized) toggleMax(w);
    Object.assign(w.node.style, {
      left: ((i % cols) * cw) + "px", top: (Math.floor(i / cols) * ch) + "px",
      width: (cw - 4) + "px", height: (ch - 4) + "px",
    });
  });
  saveDesktop();
  return ws.length;
}

function cascadeWindows() {
  const ws = arrangeable();
  if (!ws.length) return 0;
  const r = desktopRect();
  const w0 = Math.min(720, Math.round(r.width * 0.62));
  const h0 = Math.min(520, Math.round(r.height * 0.68));
  ws.forEach((w, i) => {
    if (w.maximized) toggleMax(w);
    Object.assign(w.node.style, {
      left: Math.min(24 + i * 26, Math.max(0, r.width - w0 - 8)) + "px",
      top:  Math.min(18 + i * 24, Math.max(0, r.height - h0 - 8)) + "px",
      width: w0 + "px", height: h0 + "px",
    });
    focusWindow(w);
  });
  saveDesktop();
  return ws.length;
}

function closeWindow(w) {
  if (w.onClose) { try { w.onClose(); } catch {} }
  w.node.remove();
  for (const [k, v] of WINS) if (v === w) WINS.delete(k);
  paintTaskbar();
  saveDesktop();
}

function startDrag(e, w) {
  if (e.button !== 0) return;
  const r = desktopRect();
  let sx = e.clientX, sy = e.clientY;
  let ox = w.node.offsetLeft, oy = w.node.offsetTop;
  /* Dragging a maximized window restores it, keeping the grab point --
     the pointer stays where it was on the title bar. */
  let restored = false;
  document.body.classList.add("dragging");
  const move = ev => {
    if (w.maximized && !restored && Math.abs(ev.clientY - sy) > 4) {
      const frac = (sx - r.left) / r.width;
      toggleMax(w);
      const nw = w.node.offsetWidth;
      ox = Math.max(0, sx - r.left - nw * frac); oy = 0;
      sx = ev.clientX; sy = ev.clientY; restored = true;
    }
    if (w.maximized) return;
    let nx = ox + ev.clientX - sx, ny = oy + ev.clientY - sy;
    /* Windows stay reachable: the title bar may not leave the desktop. */
    nx = Math.max(-w.node.offsetWidth + 60, Math.min(nx, r.width - 40));
    ny = Math.max(0, Math.min(ny, r.height - 22));
    w.node.style.left = nx + "px"; w.node.style.top = ny + "px";
  };
  const up = ev => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    document.body.classList.remove("dragging");
    /* Edge maximize: shoved against the top of the stage. */
    if (!w.maximized && ev.clientY - r.top <= 2) toggleMax(w);
    saveDesktop();
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
  e.preventDefault();
}

function startResize(e, w, dir) {
  if (e.button !== 0 || w.maximized) return;
  e.stopPropagation();
  const sx = e.clientX, sy = e.clientY;
  const x0 = w.node.offsetLeft, y0 = w.node.offsetTop;
  const w0 = w.node.offsetWidth, h0 = w.node.offsetHeight;
  document.body.classList.add("dragging");
  const move = ev => {
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    let nx = x0, ny = y0, nw = w0, nh = h0;
    if (dir.includes("e")) nw = Math.max(200, w0 + dx);
    if (dir.includes("s")) nh = Math.max(110, h0 + dy);
    if (dir.includes("w")) { nw = Math.max(200, w0 - dx); nx = x0 + (w0 - nw); }
    if (dir.includes("n")) { nh = Math.max(110, h0 - dy); ny = y0 + (h0 - nh); }
    Object.assign(w.node.style, { left: nx + "px", top: ny + "px",
      width: nw + "px", height: nh + "px" });
  };
  const up = () => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    document.body.classList.remove("dragging");
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
  e.preventDefault();
}

/* Keep windows on-screen when the desktop resizes. */
window.addEventListener("resize", () => {
  const r = desktopRect();
  for (const w of WINS.values()) {
    if (w.maximized) {
      w.node.style.width = r.width + "px"; w.node.style.height = r.height + "px";
      continue;
    }
    w.node.style.left = Math.min(w.node.offsetLeft, Math.max(0, r.width - 60)) + "px";
    w.node.style.top  = Math.min(w.node.offsetTop,  Math.max(0, r.height - 22)) + "px";
  }
});

/* ==========================================================================
   Taskbar
   ========================================================================== */

function paintTaskbar() {
  const host = $("#tasks");
  host.textContent = "";
  for (const w of WINS.values()) {
    const b = el("button", "taskbtn btn" +
      (w.node.classList.contains("active") && !w.minimized ? " on" : "") +
      (w.flash ? " flash" : ""), w.title);
    b.addEventListener("click", () => {
      if (w.flash) { w.flash = false; }
      if (w.minimized) { restoreWindow(w); focusWindow(w); }
      else if (w.node.classList.contains("active")) minimizeWindow(w);
      else focusWindow(w);
    });
    host.appendChild(b);
  }

  /* The pager pages DESKTOPS -- views inside this workspace. Cheap,
     instant, invisible to the agent. Workspaces moved to the menu, because
     switching one changes what PasClaw remembers and the consequential
     action should not have the one-click gesture. */
  const pg = $("#pager");
  pg.textContent = "";
  for (let n = 1; n <= (S.deskCount || 1); n++) {
    const b = el("button", "pgbtn btn" + (n === (S.desk || 1) ? " on" : ""), String(n));
    b.title = `Desktop ${n}`;
    b.addEventListener("click", () => switchDesktop(n));
    pg.appendChild(b);
  }
  if ((S.deskCount || 1) < 9) {
    const add = el("button", "pgbtn btn", "+");
    add.title = "New desktop";
    add.addEventListener("click", () => switchDesktop((S.deskCount || 1) + 1));
    pg.appendChild(add);
  }
}

async function loadDesktops() {
  try {
    const j = await api("/v1/desktop/desktops");
    S.desk = j.current; S.deskCount = j.count;
  } catch { S.desk = 1; S.deskCount = 1; }
}

async function switchDesktop(n) {
  if (n === S.desk) return;
  /* Save the arrangement being left, swap the current pointer, restore the
     one being entered. Nothing the agent can see changes -- that is the
     entire difference from a workspace switch. */
  try { await api("/v1/desktop/state", { method: "PUT", body: captureDesktop() }); } catch {}
  const j = await api("/v1/desktop/desktops", { method: "POST", body: { current: n } });
  S.desk = j.current; S.deskCount = j.count;
  for (const w of Array.from(WINS.values())) closeWindow(w);
  paintTaskbar();
  await restoreDesktop();
}

function tick() {
  const d = new Date();
  $("#clock").textContent =
    d.getHours().toString().padStart(2, "0") + ":" +
    d.getMinutes().toString().padStart(2, "0");
}
setInterval(tick, 15000); tick();

/* ==========================================================================
   Live updates

   The board changes because the AGENT changed it -- a job finished, a page
   landed, an app started -- so the desktop subscribes rather than asking
   every few seconds. EventSource cannot set an Authorization header, which
   is why the gateway also accepts ?token=.

   Polling stays as the fallback, not as the plan: a proxy that buffers SSE,
   or a browser that has run out of connections, should degrade to a slower
   desktop rather than a frozen one.
   ========================================================================== */

const EV = { src: null, handlers: {}, live: false };

function onDesktopEvent(type, fn) {
  (EV.handlers[type] = EV.handlers[type] || []).push(fn);
}

function subscribeEvents() {
  if (!window.EventSource) return;
  const t = token();
  const url = "/v1/desktop/events" + (t ? "?token=" + encodeURIComponent(t) : "");
  let src;
  try { src = new EventSource(url); } catch { return; }
  EV.src = src;

  src.addEventListener("open", () => { EV.live = true; EV.lastMsg = Date.now(); });
  src.addEventListener("error", () => {
    /* EventSource reconnects on its own; all we do is stop claiming to be
       live so the poll keeps covering us in the meantime. */
    EV.live = false;
  });
  src.addEventListener("message", e => {
    EV.lastMsg = Date.now();
    let ev;
    try { ev = JSON.parse(e.data); } catch { return; }
    /* The server's idle ping. It exists to feed the watchdog below;
       relaying it to handlers or the activity log would be noise. */
    if (ev.type === "ping") return;
    /* The event feed is half of "what is happening"; the Log window
       shows it beside the gateway's own lines and this page's calls. */
    activity("event", ev.type + (ev.project ? " " + ev.project : "") +
                      (ev.status ? " " + ev.status : ""));
    /* A gap means our queue overflowed and events were dropped. The only
       honest response is to re-read rather than to carry on from a state
       that may be wrong. */
    if (ev.type === "gap") { loadProjects().catch(() => {}); return; }
    (EV.handlers[ev.type] || []).forEach(fn => { try { fn(ev); } catch {} });
  });
}

/* The dead-feed watchdog. The server pings every ~15s of quiet, so a
   healthy connection never goes 45s without a message. One that does is
   half-dead in a way EventSource cannot see (it only notices closed
   sockets, and a wedged intermediary closes nothing) -- observed once as
   a desktop that stayed "live" while receiving no events at all until a
   reload. Reconnect and re-read the board instead of trusting it. */
setInterval(() => {
  if (!EV.src || !EV.lastMsg) return;
  if (Date.now() - EV.lastMsg < 45000) return;
  try { EV.src.close(); } catch {}
  EV.live = false;
  EV.lastMsg = 0;
  /* The catch-up read rides on the new feed's hello frame, not on this
     call: constructing an EventSource only starts a handshake, and a
     re-read that runs before the server has subscribed us re-opens the
     very window this watchdog exists to close. */
  subscribeEvents();
}, 15000);

/* The board's own events: anything that changes the project set repaints
   the icons and the tree.

   Coalesced, because these arrive in BURSTS. One agent turn that writes a
   ten-item checklist emits ten task events, and a reload per event meant
   ten full project-list round trips to render one board -- measured at 11
   GET /v1/projects for a single ten-item reconcile, which was half of all
   the traffic that operation caused. The intermediate states were never
   seen either: each reload painted a board that the next event
   immediately invalidated.

   A trailing window, not a leading one: the point is to land on the
   FINAL state, so the last event in a burst is the one that must be
   reflected. Direct callers keep using loadProjects and keep its exact
   semantics -- createAppFrom awaits it precisely because it needs
   S.projects fresh before it opens the chat, and a coalesced refresh
   would hand it a stale list. */
const BOARD_REFRESH_MS = 120;
let boardTimer = null;
function refreshBoardSoon() {
  if (boardTimer) return;
  boardTimer = setTimeout(async () => {
    boardTimer = null;
    try {
      await loadProjects();
      /* Expanded projects paint their task rows from a per-project cache,
         and a task/job event is precisely when that cache went stale: a
         run started by the agent used to sit "open" in the tree until the
         user collapsed and re-expanded it. Reload the lists the user can
         actually see, then repaint once. */
      await Promise.all(Object.keys(S.tree)
        .filter(p => S.tree[p].open && S.tree[p].tasks)
        .map(p => loadTasks(p).catch(() => {})));
      paintTree();
    } catch {}
  }, BOARD_REFRESH_MS);
}

/* Commands FROM an agent. Every other event reports that something
   happened; this one asks the desktop to do something, and it can come
   from any session -- the shell chat, the Agent Console, a scheduled job
   -- because they all reach the screen through the same feed rather than
   through whichever window owns a conversation. */
/* Who the server knows this page as. Learned from the hello frame the
   event feed opens with, so a command that names one executor can be
   recognised. */
let MY_CLIENT = "";
onDesktopEvent("hello", ev => {
  if (ev && ev.client) MY_CLIENT = ev.client;
  /* Catch up on whatever happened while we were not listening.

     The hello frame is the ONLY proof that this reader is registered:
     the handler emits the response headers first (which is what fires
     EventSource's `open`), calls DesktopSubscribe second, and writes
     hello third -- so a re-read triggered on `open`, or worse right
     after constructing the EventSource, can still run before the
     server has anyone to publish to.

     Hooked here rather than at the call sites so it covers every way a
     feed begins: the first subscribe at boot, the watchdog's
     reconnect, and EventSource's own automatic retry after a transient
     drop -- which had no recovery read at all. */
  refreshBoardSoon();
});

/* A turn parked behind another screen's turn on the same conversation.

   The gateway serializes same-session turns, and a queued POST is
   indistinguishable from a running one from here -- the composer shows
   Stop and nothing streams. So the server announces "yours is waiting"
   on the event feed, addressed by client id, and the composer that owns
   the pending POST paints it. Keyed by session id; each submit
   overwrites its own entry, so a stale closure can never outlive the
   turn that could have used it. */
const TURN_WAITS = new Map();
onDesktopEvent("turn-queued", ev => {
  if (!ev || !ev.client || ev.client !== MY_CLIENT) return;
  const show = TURN_WAITS.get(ev.session);
  if (show) show();
});

onDesktopEvent("desktop-command", ev => {
  /* A command reaches EVERY connected desktop, and for most actions
     that is the point -- "tile the windows" should tidy every screen
     you have open.

     It is exactly wrong for the actions with consequences beyond the
     glass. Two tabs open meant a single "build me an app" ran twice:
     two turns against the same project, racing on one app directory
     and one session file, with one turn's history lost. Those actions
     run only on the screen the server named.

     No target at all (an older gateway) means run them, because one
     desktop doing the work is the behaviour that was there before. */
  const mine = !ev.target || ev.target === MY_CLIENT;
  runShellActions(ev, t => shellSay(t), { effects: mine }).catch(() => {});
});

onDesktopEvent("projects", refreshBoardSoon);
onDesktopEvent("project",  refreshBoardSoon);
onDesktopEvent("task",     refreshBoardSoon);
onDesktopEvent("job",      refreshBoardSoon);


/* ==========================================================================
   Desktop state -- the arrangement belongs to the workspace

   Saved on the SERVER, per workspace, not in localStorage: switching to the
   "home" workspace should bring back the home desktop from any browser
   pointed at this gateway. Only windows that carry a `restore` descriptor
   come back; a progress dialog or a wizard is tied to work that is over, and
   reopening one would be a lie about state.
   ========================================================================== */

const RESTORERS = {
  /* Kept for layouts saved before the floating chat window went away:
     openChat routes to wherever that project's conversation now lives. */
  chat:    a  => openChat(a),
  app:     a  => openApp(a),
  browser: a  => openBrowser(a || undefined),
  library: () => openLibrary(),
  agents:  () => openAgents(),
  files:   a  => openFiles(a || undefined),
  console: () => openConsole(),
  shell:   () => openShell(),
  log:     () => openLog(),
};

let saveTimer = null;
let restoring = false;

function captureDesktop() {
  const wins = [];
  for (const w of WINS.values()) {
    if (!w.restore || !RESTORERS[w.restore.fn]) continue;
    const g = w.maximized && w.prev ? w.prev : w.node.style;
    wins.push({
      fn: w.restore.fn, arg: w.restore.arg || "",
      x: parseInt(g.left, 10) || 0, y: parseInt(g.top, 10) || 0,
      w: parseInt(g.width, 10) || 0, h: parseInt(g.height, 10) || 0,
      max: !!w.maximized, min: !!w.minimized,
    });
  }
  return {
    v: 1,
    style: S.style || "",
    /* The dock is not a window, but whether you have it open is part of how
       your desktop is arranged. */
    dock: !$("#dock").classList.contains("hidden"),
    windows: wins,
  };
}

/* Debounced: a drag fires this on every mouseup, and a restore fires it once
   per window it opens. Neither deserves a request each. */
function saveDesktop() {
  if (restoring) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    api("/v1/desktop/state", { method: "PUT", body: captureDesktop() })
      .catch(() => { /* a desktop that cannot save its layout still works */ });
  }, 700);
}

async function restoreDesktop() {
  let st = null;
  try { st = await api("/v1/desktop/state"); } catch { return; }
  if (!st) return;
  restoring = true;
  try {
    /* The saved "dock was showing" is a fact about the screen that
       saved it. On a narrow one the dock is a drawer over the content,
       so restoring it open means opening onto a covered screen -- the
       tree is one tap away instead. */
    if (st.dock === false) hideDock();
    else if (st.dock === true && !isNarrow()) openTree();
    else if (isNarrow()) $("#dock").classList.remove("on");
  } catch {}
  if (!Array.isArray(st.windows) || !st.windows.length) { restoring = false; return; }
  try {
    for (const d of st.windows) {
      const fn = RESTORERS[d.fn];
      if (!fn) continue;
      let w;
      try { w = await fn(d.arg); } catch { continue; }
      if (!w || !w.node) continue;
      if (d.w > 0) {
        Object.assign(w.node.style, {
          left: d.x + "px", top: d.y + "px",
          width: d.w + "px", height: d.h + "px",
        });
        /* The saved size came from whatever screen saved it. */
        clampWindow(w);
      }
      /* On a narrow screen a floating window is a worse answer than a
         full one -- there is no room to float in, and the saved
         arrangement was designed for a screen this is not. */
      if (d.max || isNarrow()) toggleMax(w);
      else if (d.min) minimizeWindow(w);
    }
  } finally {
    restoring = false;
  }
  paintTaskbar();
}

/* The console: the operator's own surface -- the full agent chat and every

/* Ctrl+K raises the shell from anywhere, which is what makes it feel like
   the desktop's command line rather than one more window to hunt for. */
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")) {

  }

/* ==========================================================================
   Workspaces
   ========================================================================== */

async function loadWorkspaces() {
  const j = await api("/v1/workspaces");
  S.workspaces = j.workspaces || [];
  S.active = j.active;
  paintTaskbar();
}

async function switchWorkspace(name) {
  if (name === S.active) return;
  /* A workspace is a WALL, not a view: memory, sessions, skills and files
     all change. Deliberate gesture, named consequence. */
  if (!confirm(`Switch to ${name}?\n\nThis changes what PasClaw remembers: ` +
               `memory, sessions, skills and files are all per-workspace.`)) return;

  /* Save the room being left while it is still the current one -- the
     same order switchDesktop uses. A layout change from the last 700ms
     is still sitting in the debounce, and every route resolves against
     whichever workspace is active when it lands. */
  clearTimeout(saveTimer);
  try { await api("/v1/desktop/state", { method: "PUT", body: captureDesktop() }); }
  catch {}                          /* a layout that cannot save still works */

  /* Move first, tear down second.

     Everything below this line destroys something -- the open windows,
     and with dropProjectChats the cached conversations and the unsent
     drafts sitting in their composers. If the activation fails (the
     gateway is down, the name was renamed out from under the menu) the
     user is still in THIS workspace, and a failed switch that took
     their half-typed message with it is a worse outcome than the switch
     not happening. So the fallible call goes first and nothing is torn
     down unless it succeeded. */
  try {
    await api("/v1/workspaces/activate", { method: "POST", body: { name } });
  } catch (e) {
    alert(`Could not switch to ${name}:\n\n${e.message}`);
    return;
  }

  for (const w of Array.from(WINS.values())) closeWindow(w);
  /* The conversations go with the windows.

     Closing the windows was not enough: the chats live in PROJECT_CHATS
     keyed by slug, which survives, and the suite puts the same slugs in
     every workspace. Leaving them cached meant opening "notes" in the
     new workspace showed the OLD workspace's transcript -- a hole in a
     wall this dialog has just promised the user is solid. */
  dropProjectChats();
  /* Those closes each scheduled a layout save, and it would land 700ms
     from now -- after the activation, with an empty window list, writing
     "nothing was open" over the arrangement we are about to restore.
     The room being left is already filed (above); drop the write. */
  clearTimeout(saveTimer);
  S.tree = {}; S.selected = null; S.dockProject = null;
  await loadWorkspaces();
  await loadProjects();
  await loadDesktops();
  /* Each workspace has its own desktops: switching is walking into a
     different room, arranged as you left it. */
  await restoreDesktop();
}

async function pickWorkspace() {
  const names = S.workspaces.map(w => `${w.slot}: ${w.label}${w.active ? " (current)" : ""}`);
  const pick = prompt("Switch workspace -- this changes what PasClaw remembers.\n\n" +
                      names.join("\n") + "\n\nNumber:", "");
  if (pick === null) return;
  const ws = S.workspaces.find(w => String(w.slot) === pick.trim());
  if (ws && !ws.active) switchWorkspace(ws.name);
}

async function newWorkspace() {
  const label = prompt("Name for the new workspace:", "");
  if (label === null) return;
  await api("/v1/workspaces", { method: "POST", body: { label } });
  await loadWorkspaces();
}

document.addEventListener("keydown", e => {
  if (!(e.ctrlKey && e.altKey)) return;
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const n = (S.desk || 1) + (e.key === "ArrowLeft" ? -1 : 1);
  if (n >= 1 && n <= (S.deskCount || 1)) { e.preventDefault(); switchDesktop(n); }
});

/* ==========================================================================
   Projects, icons, tree
   ========================================================================== */

/* Archived projects are filed away, not deleted: off the dock, off the
   desktop, one toggle from coming back. S.showArchived is per-session
   on purpose -- it is a "let me look at the old ones" gesture, not a
   preference, and a desktop that reopened three months of finished work
   because you once ticked a box would be back where it started. */
async function loadProjects() {
  const j = await api("/v1/projects" + (S.showArchived ? "?archived=1" : ""));
  S.projects = j.projects || [];
  S.archivedCount = j.archived || 0;
  /* Every name, archived included -- so "does this project exist?" is
     never answered by a list that has been filtered for display. */
  S.projectNames = j.names || S.projects.map(p => p.name);
  paintIcons();
  paintChips();
  paintTree();
}

function paintIcons() {
  const host = $("#icons");
  host.textContent = "";
  const perCol = Math.max(1, Math.floor((desktopRect().height - 20) / 86));
  /* Archived work never gets a desktop icon, even while the dock is
     showing the archive. "Show archived" is a question you asked the
     LIST; answering it by repopulating the whole desktop would undo
     the tidying that archiving was for. */
  S.projects.filter(p => !p.archived).forEach((p, i) => {
    const n = el("div", "dicon");
    n.style.left = (8 + Math.floor(i / perCol) * 90) + "px";
    n.style.top  = (8 + (i % perCol) * 86) + "px";
    const g = el("div", "glyph");
    g.innerHTML = icon(p.has_app ? "app" : "folder");
    n.appendChild(g);
    n.appendChild(el("span", "cap", p.title || p.name));
    n.addEventListener("click", () => {
      host.querySelectorAll(".dicon.sel").forEach(x => x.classList.remove("sel"));
      n.classList.add("sel");
    });
    /* Double-click opens the app if there is one, else the project's chat --
       "open" means "show me the thing", and for a project without an app
       yet the thing is the conversation that will build it. */
    n.addEventListener("dblclick", () => {
      if (p.has_app && p.app_ready) openApp(p.name);
      else openChat(p.name);
    });
    host.appendChild(n);
  });
}

/* ==========================================================================
   The desktop ask field + chips

   The background is the first place to type: a question goes to the
   Browser (which opens already answering it), and the chips underneath
   are the suite -- Notes, Calendar, Brain and the rest -- plus the
   Library. The suite always existed, but only `pasclaw project seed`
   installed it, so a desktop-only user had no way to even learn it was
   there; when it isn't installed, the one chip offers to install it.
   ========================================================================== */

/* Takes the text rather than reading a field: the shell owns the input
   now, and the chips and the Browser both call this with a string. */
function askFromDesktop(query, kind) {
  if (!query || !query.trim()) return;
  const existing = WINS.get("browser");
  if (existing && existing.__ask) {
    restoreWindow(existing); focusWindow(existing);
    existing.__ask(query.trim(), kind);
  }
  else openBrowser(undefined, query.trim(), kind);
}

/* Create App: the same memo, but the deliverable is software. Starts a
   project named after the request, opens its chat, and sends the memo as
   the first turn -- from there it is the ordinary lovable loop: chat on
   the left, the app running on the right. The project title is only a
   label derived from the first words; the full text goes to the chat. */
/* Turn a memo into a project name.

   This is not cosmetic: the title becomes the project's slug, its
   directory on disk, and the label under its icon forever after. The
   first cut of this took six words and sliced at 48 characters, which
   produced "a countdown timer app with a" -- a name ending on a dangling
   preposition and article, from a request that was perfectly clear.

   Three passes, in order:

     1. Drop the framing. "make me a", "build an", "I want a" -- these
        address the assistant, not the thing being built, and every
        project starting with "Make Me A" is six wasted characters in a
        column that is already narrow.
     2. Take the first clause. A memo often opens with the app and then
        keeps going; the sentence break is a better boundary than a word
        count.
     3. Trim what got left dangling. Trailing function words go, and a
        preposition or conjunction whose object was cut off takes the
        rest of its phrase with it -- "countdown timer app with a big"
        becomes "countdown timer app". Guarded to leave at least two
        words, so an aggressive rule cannot reduce a request to "App". */
const TITLE_TAIL = new Set([
  "a", "an", "the", "my", "our", "your", "its", "their", "this", "that",
  "these", "those", "and", "or", "but", "with", "for", "to", "of", "in",
  "on", "at", "from", "by", "into", "using", "is", "are", "be", "as",
  "some", "any",
]);
const TITLE_CUT = new Set([
  "with", "for", "to", "of", "in", "on", "at", "from", "by", "into",
  "using", "and", "or", "but", "so", "plus",
]);
/* Comfortably inside the server's 64-character slug cap, with room left
   for the " 2".." 20" collision suffix createAppFrom appends --
   a title that fills the cap makes every retry sanitize to the same
   slug, and the create fails rather than picking a free name. */
const TITLE_MAX = 48;

function deriveProjectTitle(text) {
  let s = String(text || "").trim();
  s = s.replace(
    /^(?:please\s+)?(?:can\s+you\s+)?(?:make|build|create|write|design|generate|give)\s+(?:me\s+)?/i, "");
  s = s.replace(/^i\s+(?:want|need|would\s+like)\s+/i, "");
  /* The leading article goes too -- "A Stopwatch" is a worse folder name
     than "Stopwatch", and every request starts with one. \b matters:
     without it the alternation matches the "a" inside "an" and leaves a
     stray "n expense tracker". */
  s = s.replace(/^(?:a|an|the)\b\s*/i, "");
  /* First clause only -- a sentence end, or a line break in a longer memo.

     A sentence end is punctuation followed by SPACE or end of string,
     not every "." in the text. Splitting on the bare character turned
     "build a Node.js dashboard" into "Node" and "create an ASP.NET app"
     into "ASP", throwing away the one word that said what the thing
     was: dotted names, file extensions and version numbers all live
     inside a token, and none of them end a sentence. */
  s = s.split(/[.!?](?=\s|$)|\n/)[0].trim();

  let words = s.split(/\s+/).filter(Boolean);
  let cut = words.length > 6;
  words = words.slice(0, 6);
  /* Character budget, on a word boundary rather than mid-word. */
  while (words.length > 2 && words.join(" ").length > TITLE_MAX) {
    words.pop();
    cut = true;
  }
  while (words.length > 2 &&
         TITLE_TAIL.has(words[words.length - 1].toLowerCase().replace(/\W/g, ""))) {
    words.pop();
    cut = true;
  }
  if (cut) {
    for (let i = words.length - 1; i >= 2; i--) {
      if (TITLE_CUT.has(words[i].toLowerCase().replace(/\W/g, ""))) {
        words = words.slice(0, i);
        break;
      }
    }
  }
  let title = words.join(" ").replace(/[,;:]+$/, "").trim();
  if (!title) title = String(text || "").trim();
  /* Hard bound, whatever the word count.

     The loop above only trims while more than two words remain, so a
     memo opening with one enormous token sailed past it -- and that is
     not merely ugly. The server caps slugs at 64 characters, and
     createAppFrom resolves a name collision by appending " 2",
     " 3" and so on: past the cap the suffix falls off the end of the
     slug, every retry sanitizes to the SAME existing project, and after
     twenty attempts Create App gives up with an error on a request that
     was perfectly valid. TITLE_MAX leaves room for the suffix inside
     the cap. Cut at a word boundary when there is one worth keeping. */
  if (title.length > TITLE_MAX) {
    const clipped = title.slice(0, TITLE_MAX);
    const sp = clipped.lastIndexOf(" ");
    title = (sp >= 12 ? clipped.slice(0, sp) : clipped).trim();
  }
  title = title.replace(/[,;:]+$/, "").trim();
  if (!title) return "";
  return title.charAt(0).toUpperCase() + title.slice(1);
}

/* SanitizeName, mirrored from PasClaw.Projects.Store: what a title will
   become on disk. Mirrored rather than asked for because the answer is
   needed BEFORE the create, to know whether that name is already
   somebody else's project. */
function slugFor(title) {
  return String(title || "").toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+/, "")
    .slice(0, 64).replace(/-+$/, "");
}

/* A project name nobody else is using.

   CreateProject is idempotent BY DESIGN -- a title that sanitizes to an
   existing slug hands back the project that is already there, so the
   agent re-running its own create step does not fail the job. Every
   caller that means "a NEW project" therefore has to pick a free name
   first, or it silently starts writing into someone else's.

   Two callers learned that the hard way and a third would have: the
   shell's build_app ("build a calendar" would have taken over the
   calendar suite app), and page promotion, where shortening titles made
   it worse -- "Build me a timer" and "Create a timer" used to make two
   projects and would now both derive "Timer", the second overwriting
   the first one's index.html.

   Returns { title, name, siblings } to pass to the create; name is the
   slug it reserved, and siblings names the projects it had to step over
   to find a free one. Falls back to a timestamped suffix rather than
   failing, because refusing to build is worse than an ugly name.

   siblings exists because stepping over them quietly is how a workspace
   fills up with seventeen variations of one idea: each build asked for
   "Tiny page that says hello", got -2, -3, -4 ... and nothing ever said
   the other sixteen were there. The disambiguation is right; doing it
   silently is not. */
async function freeProjectName(title) {
  title = String(title || "").trim() || "App";
  let taken = new Set();
  try {
    taken = new Set(((await api("/v1/projects")).projects || []).map(p => p.name));
  } catch {}
  const siblings = [];
  const base = slugFor(title);
  for (let n = 1; n <= 20; n++) {
    const t = n === 1 ? title : `${title} ${n}`;
    const slug = slugFor(t);
    if (slug && !taken.has(slug)) return { title: t, name: slug, siblings };
    if (slug) siblings.push(slug);
  }
  const t = `${title} ${Date.now().toString().slice(-5)}`;
  return { title: t, name: slugFor(t), siblings, base };
}

/* Start a project from a memo. Returns the slug it made, so the shell can
   say which project the request became -- the text is passed in rather
   than read from a field, since the shell window owns the input now. */
async function createAppFrom(text, plan) {
  if (!text || !text.trim()) return "";
  text = text.trim();
  const title = deriveProjectTitle(text);
  try {
    /* A free name first -- the create is idempotent, so asking for one
       that is taken quietly hands back somebody else's project. */
    const want = await freeProjectName(title);

    /* Near-duplicates get named out loud, once, before another one
       exists. Asked here rather than reported afterwards because after
       the create the damage is done and nobody deletes the extra. The
       default is the useful one: carry on in the project you already
       have. */
    if (want.siblings && want.siblings.length) {
      const list = want.siblings.slice(0, 8).join(", ") +
                   (want.siblings.length > 8 ? ", ..." : "");
      const another = confirm(
        `You already have ${want.siblings.length} project` +
        `${want.siblings.length === 1 ? "" : "s"} like this:\n\n  ${list}\n\n` +
        `OK      -- make another one, "${want.title}"\n` +
        `Cancel  -- open ${want.siblings[want.siblings.length - 1]} and ` +
        `continue there`);
      if (!another) {
        const keep = want.siblings[want.siblings.length - 1];
        openChat(keep);
        /* The request goes in the composer, unsent: continuing in an
           existing project is a different act from starting one, and it
           is the user's to confirm. */
        const c = projectChat(keep);
        const ta = c.root.querySelector("textarea");
        if (ta) { ta.value = text; ta.focus(); }
        return keep;
      }
    }

    const j = await api("/v1/projects", { method: "POST",
      body: { title: want.title, name: want.name } });
    await loadProjects();
    openChat(j.name);
    projectChat(j.name).submitText(
      plan ? text + "\n\nPlan this first. Do not build anything yet: set " +
             "out what the app is, what it is made of, and what you will " +
             "do in what order, so I can approve it or change it."
           : text,
      plan ? "plan" : "build");
    return j.name;
  } catch (e) { alert(e.message); return ""; }
}

/* The chips moved into the shell window with the ask field, so this
   takes its host rather than looking one up: the same row is painted
   wherever the shell currently is, and a repaint after loadProjects
   finds it through SHELL_CHIPS. */
let SHELL_CHIPS = null;
function paintChips() { if (SHELL_CHIPS) paintChipsInto(SHELL_CHIPS); }

function paintChipsInto(host) {
  if (!host) return;
  SHELL_CHIPS = host;
  host.textContent = "";

  function chip(label, iconName, fn, title) {
    const c = el("span", "chip");
    const g = el("span"); g.innerHTML = icon(iconName);
    c.appendChild(g);
    c.appendChild(el("span", null, label));
    if (title) c.title = title;
    c.addEventListener("click", fn);
    host.appendChild(c);
    return c;
  }

  const suite = S.projects.filter(p => p.suite && p.has_app);
  suite.forEach(p =>
    chip(p.title || p.name, "app", () => openApp(p.name)));
  if (!suite.length)
    chip("Install Notes, Calendar & the suite...", "disk", async ev => {
      try {
        const j = await api("/v1/suite", { method: "POST" });
        await loadProjects();
        /* Say what was SKIPPED, not only what was added. The seeder
           never overwrites, so a project you named "notes" shadows the
           suite's Notes app -- silently, before this. */
        let text = `${j.created} app(s) added. They are ordinary projects -- ` +
                   `open one and ask PasClaw to change it.`;
        if (j.skipped && j.skipped.length)
          text += `\n\nSkipped (a project already owns the name): ` +
                  j.skipped.join(", ") + ". Rename or remove those projects " +
                  "and install again if you want the suite's versions.";
        showMessage({ title: "Suite installed", kind: "info", text });
      } catch (e) { alert(e.message); }
    }, "Notes, Calendar, Mail and the rest -- one click, once");
  chip("Library", "brain", openLibrary,
       "Pages and sessions this workspace has accumulated");
}

/* What the four intents do, and where the answer lands. Two of them open
   the Browser and two of them create a project, which is worth saying out
   loud under the field -- the difference between "where did my text go"
   and not. */
const ASK_KINDS = {
  /* The default, and the only one most people should ever need.

     The first cut made the dropdown the router, which put the burden
     back where the shell exists to take it from: "tile the open
     windows" typed into a box still set to Ask went off and searched
     the web for it. Deciding which of five boxes a sentence belongs in,
     before typing the sentence, is the thing a chat is supposed to
     spare you.

     So PasClaw reads it. The turn goes out with the desktop's state and
     every tool, and the model answers, arranges, or builds depending on
     what was said. The named intents below stay as an override for when
     you want to force one -- "research this" when it would otherwise
     just answer. */
  auto:     { label: "Auto",
              where: "PasClaw reads what you meant." },
  ask:      { label: "Ask",
              where: "Answers as a page in the Browser." },
  research: { label: "Research",
              where: "Digs until saturated, then a sourced report in the Browser." },
  plan:     { label: "Plan an app",
              where: "New project. Plans first -- nothing is built until you approve." },
  build:    { label: "Build an app",
              where: "New project. Starts building straight away." },
  /* Shell only: the desktop itself is the thing being addressed. */
  control:  { label: "Control the desktop",
              where: "Arranges windows, opens apps, queues builds." },
};

/* ==========================================================================
   The shell: one window you talk to the desktop through

   The ask field used to live on the background, where it was under every
   window -- unusable exactly when the desktop was in use. This is its
   home now: a full-stage window off a taskbar button, holding the same
   four intents AND a conversation that can operate the desktop itself.

   The two belong together. "Answer this", "build me an app" and "tidy
   these windows up" are all things you say to the machine; splitting
   them across two surfaces would only make the user decide which box a
   sentence goes in before typing it.
   ========================================================================== */

const SHELL_SESSION = "desktop-shell";

/* What the shell can do to the desktop, as told to the model and as
   executed here. Kept as ONE table so the prompt cannot drift from the
   implementation -- a model told about an action that does not exist
   produces a turn that silently does nothing. */
const SHELL_ACTIONS = {
  tile: {
    help: "tile -- lay every open window out side by side",
    run: () => { tileWindows(); return "tiled"; },
  },
  cascade: {
    help: "cascade -- stack the windows stepped from the top left",
    run: () => { cascadeWindows(); return "cascaded"; },
  },
  minimize_all: {
    help: "minimize_all -- clear the stage, leaving the taskbar",
    run: () => {
      let n = 0;
      [...WINS.values()].forEach(w => { minimizeWindow(w); n++; });
      return `minimized ${n}`;
    },
  },
  close_all: {
    help: "close_all -- close every open window",
    run: () => {
      const all = [...WINS.values()];
      all.forEach(w => closeWindow(w));
      return `closed ${all.length}`;
    },
  },
  open_app: {
    help: 'open_app {"project":"<slug>"} -- open a project\'s app',
    run: a => { openApp(a.project, { chat: false }); return "opening " + a.project; },
  },
  open_chat: {
    help: 'open_chat {"project":"<slug>"} -- open a project\'s conversation',
    run: a => { openChat(a.project); return "opened chat for " + a.project; },
  },
  open_agent: {
    help: 'open_agent {"agent":"<slug>"} -- open a standing agent\'s chat ' +
          "window (the supervisor uses this to put the team on screen)",
    run: async a => {
      const j = await api("/v1/agents/" + encodeURIComponent(a.agent || ""));
      await openAgentChat(j);
      return "opened " + j.name;
    },
  },
  team_up: {
    help: 'team_up {"template":"<name>","brief":"<goal>"} or ' +
          '{"template":"<name>","project":"<slug>"} -- fire up a ready-made ' +
          'agent team on a goal or an existing task board. template defaults ' +
          'to software-team.',
    /* Effectful like build_app: with two tabs open, one team, not two --
       the server names the executor and only the target runs this. */
    run: async a => {
      const body = { template: a.template || "software-team" };
      if (a.project) body.project = a.project; else body.goal = a.brief || a.title || "";
      const j = await api("/v1/teams/up", { method: "POST", body });
      openAgents();
      let msg = "team " + j.team + " is up on " + j.project;
      if (j.warning) msg += " -- WARNING: " + j.warning;
      return msg;
    },
  },
  build_app: {
    help: 'build_app {"title":"<name>","brief":"<what to build>"} -- ' +
          "start a NEW project and set it building. Emit one per app when " +
          "asked for several.",
    /* Straight through createAppFrom rather than a second create of its
       own: that is where the free-name reservation lives, and a copy
       here would be the copy that drifts. Without it, "build me a
       calendar" resolved to the calendar slug that already exists and
       sent the brief into the suite app's conversation -- rewriting an
       app the user relies on instead of making the new one promised. */
    run: async a => {
      const slug = await createAppFrom(a.brief || a.title, false);
      if (!slug) throw new Error("nothing to build");
      return "building " + slug;
    },
  },
  focus: {
    help: 'focus {"key":"<window key>"} -- raise a window to the front',
    run: a => {
