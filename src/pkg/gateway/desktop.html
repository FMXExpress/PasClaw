  /* Live: an agent that starts or finishes a turn repaints this window
     without anyone asking. */
  if (!w.__agentsWired) {
    w.__agentsWired = true;
    onDesktopEvent("agent", () => { if (WINS.get("agents")) paint(); });
    /* The narration ticker: a working agent's current tool call shows
       in the status line, so "working" visibly DOES something. */
    onDesktopEvent("agent-activity", ev => {
      if (!ev || !WINS.get("agents")) return;
      status.textContent = ev.name + ": " + ev.tool +
        (ev.detail ? " " + ev.detail.slice(0, 48) : "");
    });
  }
  await paint();
  return w;
}

/* An agent's conversation, in a window. It is an ordinary session, so
   this is the session reader with the composer wired to the MAILBOX
   rather than to a chat endpoint: talking to an agent is sending it a
   message, and it answers on its own turn. */
async function openAgentChat(a) {
  const w = createWindow({ key: "agentchat:" + a.name,
                           title: (a.title || a.name), width: 560, height: 420,
                           icon: "brain", pad: false });
  if (w.__wired) { restoreWindow(w); focusWindow(w); return w; }
  w.__wired = true;

  const log = el("div", "log in");
  log.style.cssText = "height:calc(100% - 62px);overflow:auto;margin:3px";
  w.body.appendChild(log);

  const composer = el("div", "composer");
  composer.style.cssText = "display:flex;gap:4px;padding:3px";
  const ta = el("textarea");
  ta.rows = 2;
  ta.style.cssText = "flex:1 1 auto;resize:none";
  ta.placeholder = "Send this agent a message";
  const send = el("button", "btn", "Send");
  composer.appendChild(ta); composer.appendChild(send);
  w.body.appendChild(composer);

  async function paint() {
    log.textContent = "";
    /* Two sources, and they are different things: the SESSION is what
       the agent thought and did, the RECORD is what it was told. Shown
       together because "why did it do that" is usually answered by a
       message somebody sent it. */
    let msgs = [], record = [];
    try { msgs = (await api(`/v1/sessions/agent-${a.name}`)).messages || []; } catch {}
    try { record = (await api(`/v1/agents/${a.name}/messages`)).messages || []; } catch {}
    /* The agent's work renders the way the other chats render it:
       markdown for what it said, collapsible cards for what it did --
       calls from the assistant turns, results from the tool turns,
       paired by tool_call_id. This window used to print every role as
       raw text, which for a busy agent meant pages of tool output
       burying the three sentences that mattered. */
    const results = new Map();
    msgs.forEach(m => {
      if (m.role === "tool" && m.tool_call_id)
        results.set(m.tool_call_id, { content: m.content || "", name: m.name || "" });
    });
    msgs.slice(-40).forEach(m => {
      if (m.role === "tool") return;   /* shown inside its call's card */
      if (m.role === "assistant" && m.tool_calls && m.tool_calls.length) {
        const cards = recordToolCards(m, results);
        if (cards) log.appendChild(cards);
        if (!(m.content || "").trim()) return;
      }
      if (!(m.content || "").trim()) return;
      const row = el("div", "msg" + (m.role === "user" ? " u" : ""));
      row.appendChild(el("div", "who", m.role));
      const b = el("div", "body");
      if (m.role === "assistant") paintAssistant(b, m.content, null);
      else b.textContent = (m.content || "").slice(0, 4000);
      row.appendChild(b);
      log.appendChild(row);
    });
    if (record.length) {
      log.appendChild(el("div", "msep"));
      log.appendChild(el("div", "muted", "Messages it was sent:"));
      record.slice(-10).forEach(m => {
        log.appendChild(el("div", "muted",
          `${m.at}  ${m.from}: ${m.text.slice(0, 200)}  (${m.delivered})`));
      });
    }
    log.scrollTop = log.scrollHeight;
  }

  async function submit() {
    const text = ta.value.trim();
    if (!text) return;
    ta.value = "";
    try {
      await api(`/v1/agents/${a.name}/send`,
                { method: "POST", body: { from: "operator", text } });
      await paint();
    } catch (e) { alert(e.message); }
  }
  send.addEventListener("click", submit);
  ta.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
  });
  onDesktopEvent("agent", ev => {
    if (ev && ev.name === a.name && WINS.get("agentchat:" + a.name)) paint();
  });
  /* Live narration while the agent works. The session file is only
     written when the turn ENDS, so without these frames this window
     re-reads an unchanged file and appears frozen until the run is
     over -- the exact complaint that led here. The lines are ephemeral
     by design: the run-finished `agent` event repaints from the real
     transcript and they are replaced by it. */
  onDesktopEvent("agent-activity", ev => {
    if (!ev || ev.name !== a.name) return;
    if (!WINS.get("agentchat:" + a.name)) return;
    const row = el("div", "muted",
      "\u23FA " + ev.tool + (ev.detail ? "(" + ev.detail + ")" : "()"));
    row.style.cssText = "padding:1px 6px;font-size:11px";
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
  });
  await paint();
  return w;
}

/* ---- New team...: the picker that replaces nothing and asks twice ---- */

async function newTeam() {
  let teams = [];
  try { teams = (await api("/v1/teams")).teams || []; } catch (e) {
    alert(e.message); return;
  }
  if (!teams.length) { alert("No team templates available."); return; }

  const w = createWindow({ key: "newteam", title: "New Team", icon: "brain",
                           width: 420, height: 300 });
  if (w.__wired) { restoreWindow(w); focusWindow(w); return; }
  w.__wired = true;

  const wrap = el("div");
  wrap.style.cssText = "display:flex;flex-direction:column;gap:6px;padding:8px";

  const sel = el("select", "fld");
  teams.forEach(t => {
    const o = el("option", null,
      t.title + " -- " + (t.agents || []).length + " agent(s)");
    o.value = t.name;
    sel.appendChild(o);
  });
  wrap.appendChild(el("div", "muted", "Template"));
  wrap.appendChild(sel);

  const goal = el("textarea", "fld");
  goal.rows = 3;
  goal.placeholder = "What should the team work on?";
  wrap.appendChild(el("div", "muted",
    "Goal (the team plans it) -- or pick an existing project below"));
  wrap.appendChild(goal);

  const proj = el("select", "fld");
  proj.appendChild(el("option", null, "(new project from the goal)"));
  try {
    ((await api("/v1/projects")).projects || []).forEach(pr => {
      const o = el("option", null, pr.name);
      o.value = pr.name;
      proj.appendChild(o);
    });
  } catch {}
  wrap.appendChild(proj);

  const row = el("div");
  row.style.cssText = "display:flex;gap:6px;justify-content:flex-end";
  const go = el("button", "btn", "Fire it up");
  const status = el("span", "muted");
  row.appendChild(status); row.appendChild(go);
  wrap.appendChild(row);
  w.body.appendChild(wrap);

  go.addEventListener("click", async () => {
    const body = { template: sel.value };
    if (proj.selectedIndex > 0) body.project = proj.value;
    else {
      if (!goal.value.trim()) { status.textContent = "give it a goal"; return; }
      body.goal = goal.value.trim();
    }
    go.disabled = true;
    status.textContent = "seeding...";
    try {
      const j = await api("/v1/teams/up", { method: "POST", body });
      closeWindow(w);
      openAgents();
      if (j.warning) alert("The team is up, but: " + j.warning);
    } catch (e) {
      status.textContent = e.message;
      go.disabled = false;
    }
  });
}

/* ==========================================================================
   Display Properties -- the style picker
   ========================================================================== */

const STYLE_KEY = "pasclaw.desktop.style";

function loadStyleList() {
  /* The generated palette block carries its own manifest comment; read the
     style ids straight out of the stylesheet so the picker can never drift
     from the palettes that are actually present. */
  const ids = new Set();
  for (const sheet of document.styleSheets) {
    let rules;
    try { rules = sheet.cssRules; } catch { continue; }
    for (const r of rules || []) {
      const m = r.selectorText && r.selectorText.match(/\[data-style="([^"]+)"\]/);
      if (m) ids.add(m[1]);
    }
  }
  /* Display names come from the same generated block's STYLES manifest.
     CSS comments don't survive into cssRules, so read the <style>
     element's text. A style present in the sheet but missing from the
     manifest still gets a name -- never an empty row. */
  S.styleTitles = {};
  try {
    for (const st of document.querySelectorAll("style")) {
      const m = st.textContent.match(/\/\* STYLES = (\[.*?\]) \*\//);
      if (!m) continue;
      JSON.parse(m[1]).forEach(s => { S.styleTitles[s.id] = s.title; });
      break;
    }
  } catch {}
  S.styles = Array.from(ids).sort(
    (a, b) => styleTitle(a).localeCompare(styleTitle(b)));
}

/* Every theme is a vibe of the machine it remembers, and the names say
   so. The manifest titles already end in "Vibes"; the suffix is enforced
   here too so a stale or hand-edited manifest can't leak one without. */
function styleTitle(id) {
  const t = (S.styleTitles && S.styleTitles[id]) || id;
  return /\bVibes$/.test(t) ? t : t + " Vibes";
}

function applyStyle(id) {
  if (!id) return;
  document.documentElement.setAttribute("data-style", id);
  S.style = id;
  try { localStorage.setItem(STYLE_KEY, id); } catch {}
}

function openDisplay() {
  /* Same reopen guard as the Browser: a second open used to stack a
     second style list under the first. */
  const already = WINS.get("display");
  if (already) { restoreWindow(already); focusWindow(already); return already; }
  const w = createWindow({ key: "display", title: "Display Properties",
                           width: 260, height: 380, icon: "gear", max: false, pad: false });
  const list = el("div", "list in");
  list.style.cssText = "height:calc(100% - 26px);margin:3px";
  S.styles.forEach(id => {
    const r = el("div", "row" + (id === S.style ? " sel" : ""), styleTitle(id));
    r.addEventListener("click", () => {
      list.querySelectorAll(".row.sel").forEach(x => x.classList.remove("sel"));
      r.classList.add("sel");
      applyStyle(id);
    });
    list.appendChild(r);
  });
  w.body.appendChild(list);
  const bar = el("div", "statusbar thin");
  bar.appendChild(el("span", "muted", S.styles.length + " styles"));
  w.node.appendChild(bar);
  return w;
}

/* ==========================================================================
   Boot
   ========================================================================== */

async function boot() {
  loadStyleList();
  try { applyStyle(localStorage.getItem(STYLE_KEY) || "Synthwave"); } catch { applyStyle("Synthwave"); }
  buildMenu();
  initDock();
  try {
    /* Ask the gateway how it is arranged before rendering anything that
       depends on it. A gateway too old to answer just leaves the defaults. */
    try {
      const cfg = await api("/v1/desktop/config");
      S.appsOrigin = cfg.apps_origin || "";
      S.appsIsolated = !!cfg.apps_isolated;
      S.host = cfg.host || "";
    } catch {}
    await loadWorkspaces();
    await loadProjects();
    await loadDesktops();
    /* Only after the first load succeeds -- subscribing before we know the
       token works would just produce a reconnect loop behind an auth wall. */
    /* ...which leaves a window: everything the gateway published between
       those reads and this subscription reached no one, and nothing would
       have re-read afterwards. Open the desktop while an agent is mid-turn
       and the board sat stale until the user happened to touch it
       (reproduced: a task created ~1s after load never appeared). The
       recovery re-read is triggered by the feed's own hello frame -- see
       the handler -- because that is the first moment the server can
       actually have us on its subscriber list. */
    subscribeEvents();
    await restoreDesktop();
  } catch (e) {
    /* A bearer-gated gateway is the usual cause; say so plainly rather than
       leaving an empty desktop with no explanation. */
    const w = createWindow({ title: "PasClaw Desktop", width: 380, height: 190, max: false });
    w.body.appendChild(el("p", null, "Could not reach the gateway:"));
    w.body.appendChild(el("p", null, e.message));
    if (e.status === 401) {
      const p = el("p", null, "This gateway requires a token. Set one, then reload:");
      w.body.appendChild(p);
      const row = el("div"); row.style.cssText = "display:flex;gap:4px";
      const inp = el("input", "fld"); inp.type = "password"; inp.style.flex = "1 1 auto";
      const save = el("button", "btn", "Save");
      save.addEventListener("click", () => {
        try { localStorage.setItem(TOKEN_KEY, inp.value.trim()); } catch {}
        location.reload();
      });
      row.appendChild(inp); row.appendChild(save);
      w.body.appendChild(row);
    }
    return;
  }
  paintTree();
}
boot();
</script>
