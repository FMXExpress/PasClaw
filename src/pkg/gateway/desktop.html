/* ---- recognising structured output in a chat reply ----

   The contract is deliberately tiny and optional: a fenced block

     ```pasclaw-ui
     {"ui":"wizard","title":"Plan","steps":[{"title":"..","body":".."}]}
     ```

   renders as furniture. Everything outside the block stays visible as text,
   so a model that ignores the convention loses nothing, and a malformed
   block degrades to the raw text rather than vanishing. */
function extractUIBlocks(text) {
  const out = { text: text, blocks: [] };
  const re = /```pasclaw-ui\s*([\s\S]*?)```/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    try {
      const obj = JSON.parse(m[1]);
      if (obj && obj.ui) out.blocks.push(obj);
    } catch { continue; }   /* malformed: leave it as visible text */
  }
  if (out.blocks.length)
    out.text = text.replace(re, (whole, body) => {
      try { JSON.parse(body); return ""; } catch { return whole; }
    }).trim();
  return out;
}

/* Render one recognised block. Project is passed so a wizard's approved
   steps can become real tasks on that project's board. */
/* Reply is the submitText of the conversation that EMITTED this block --
   passed in rather than looked up, because a project can have several
   chat homes open at once and only one of them asked. */
function renderUIBlock(block, project, reply) {
  if (block.ui === "wizard") {
    return showWizard({
      title: block.title || "Plan",
      steps: block.steps || [],
      onFinish: async steps => {
        if (!project) return;
        /* Approving a plan is what creates the tasks. That is the whole
           gesture: Next, Next, Finish -> a board. */
        for (const st of steps) {
          try {
            await api(`/v1/projects/${project}/tasks`, {
              method: "POST",
              body: { title: st.title || "Step", notes: st.body || "" },
            });
          } catch {}
        }
        await loadProjects();
        if (S.tree[project]) { await loadTasks(project); paintTree(); }
        showMessage({
          title: "Plan accepted", kind: "info",
          text: `${steps.length} task(s) added to ${project}.`,
        });
      },
    });
  }
  if (block.ui === "message" || block.ui === "ask") {
    return showMessage({
      title: block.title || "PasClaw",
      kind: block.kind || (block.ui === "ask" ? "ask" : "info"),
      text: block.text || "",
      buttons: block.buttons || [{ label: "OK", value: true }],
      onPick: v => {
        /* An answered question goes back as the next chat turn, so the
           conversation continues exactly where the dialog left off. No
           reply callback means nothing asked (a block rendered outside a
           turn), and staying silent beats guessing at a conversation. */
        if (block.reply === false || !reply) return;
        reply(String(v));
      },
    });
  }
  return null;
}

/* ==========================================================================
   App windows

   The state broker. App iframes are sandboxed WITHOUT allow-same-origin, so
   they cannot call the gateway themselves -- if they could, they would also
   be same-origin with this page and able to read the operator's token. So
   they post a message here and we make the call on their behalf, scoped to
   the project whose window the message actually came from. An app cannot
   name another project: we ignore what it claims and use the mapping from
   its own contentWindow.
   ========================================================================== */

const FRAME_PROJECT = new Map();   /* contentWindow -> project slug */

window.addEventListener("message", async ev => {
  const m = ev.data;
  if (!m || m.__pasclaw !== "state") return;
  const project = FRAME_PROJECT.get(ev.source);
  const reply = (payload) => {
    try { ev.source.postMessage(Object.assign({ __pasclaw: "reply", id: m.id }, payload), "*"); }
    catch {}
  };
  if (!project) { reply({ error: "unknown app frame" }); return; }
  const key = String(m.key || "");
  const url = `/v1/apps/${encodeURIComponent(project)}/state/${encodeURIComponent(key)}`;
  try {
    if (m.op === "get") {
      const j = await api(url);
      reply({ value: j.exists ? j.value : null });
    } else if (m.op === "set") {
      await api(url, { method: "PUT", body: String(m.value == null ? "" : m.value),
                       headers: { "content-type": "text/plain" } });
      reply({ value: true });
    } else if (m.op === "del") {
      await api(url, { method: "DELETE" });
      reply({ value: true });
    } else if (m.op === "action") {
      /* The arg rides as the body. We forward it verbatim -- the allowlist
         and the argument validation both live on the server, so the broker
         has no opinion to add and no chance to get one wrong. */
      const j = await api(`/v1/apps/${encodeURIComponent(project)}/action/` +
                          encodeURIComponent(String(m.key || "")),
                          { method: "POST", body: m.value || "" });
      reply({ value: j });
    } else if (m.op === "read") {
      /* The allowlist lives on the server; we just forward the name so an
         app cannot reach past it by talking to us instead. */
      const j = await api(`/v1/apps/${encodeURIComponent(project)}/read/` +
                          encodeURIComponent(String(m.key || "")) +
                          (m.value ? "?q=" + encodeURIComponent(String(m.value)) : ""));
      reply({ value: j.items || [] });
    } else {
      reply({ error: "unknown op" });
    }
  } catch (e) {
    reply({ error: e.message });
  }
});

async function openApp(project, opts) {
  let app;
  try { app = await api("/v1/apps/" + project); }
  catch (e) { alert(e.message); return; }
  if (!app.exists) { alert("This project has no app yet."); return; }
  if (!app.servable) {
    /* A process kind. It does not render in a window -- it RUNS, on the
       machine the gateway is on. That distinction matters enough to have its
       own window rather than an alert. */
    openProcessApp(project, app);
    return;
  }
  /* Already open: createWindow hands back the live window rather than a
     fresh one, and everything below BUILDS the window's contents -- running
     it again would stack a second app frame and a second chat pane inside
     the same body. Checked before the permission prompt too, so raising an
     open app never re-asks a question already answered. */
  const live = WINS.get("app:" + project);
  if (live) {
    restoreWindow(live); focusWindow(live);
    if (opts && opts.chat && live.__showChat) live.__showChat();
    return live;
  }

  /* Declared permissions are shown before the app is opened, not buried in
     a manifest the user will never read. */
  if (app.network) {
    if (!confirm(`"${app.name}" declares network access to:\n  ${app.network}\n\nOpen it?`)) return;
  }

  const w = createWindow({
    key: "app:" + project, title: app.name || project,
    width: app.width || 640, height: (app.height || 480) + 26,
    icon: "app", pad: false,
    restore: { fn: "app", arg: project },
  });
  const frame = el("iframe", "app");
  /* The app is model-authored code. Sandboxed here AND served under a CSP by
     the gateway -- neither alone is enough: the sandbox stops it reaching
     this page's DOM and the operator's token, the CSP stops it reaching the
     network. Persistence goes through the broker above instead. */
  frame.setAttribute("sandbox", "allow-scripts allow-forms");
  frame.addEventListener("load", () => {
    if (frame.contentWindow) FRAME_PROJECT.set(frame.contentWindow, project);
  });
  frame.src = appURL(project) + "?t=" + Date.now();

  /* [chat][grip][app]: the editing conversation lives INSIDE the app
     window, on the left, hidden until asked for. The app is the thing
     being made; the chat is how it changes; putting a wall of window
     management between them was friction with no compensating clarity. */
  const split = el("div", "appsplit");
  const side = el("div", "appside");
  side.style.display = "none";
  const grip = el("div", "appgrip");
  grip.style.display = "none";
  split.appendChild(side); split.appendChild(grip); split.appendChild(frame);
  w.body.appendChild(split);

  /* Drag the grip to resize the pane. The iframe eats mouse events, so it
     goes pointer-inert for the duration of the drag. */
  grip.addEventListener("mousedown", e => {
    e.preventDefault();
    const x0 = e.clientX, w0 = side.offsetWidth;
    frame.style.pointerEvents = "none";
    const move = ev => { side.style.width = Math.max(180, w0 + ev.clientX - x0) + "px"; };
    const up = () => {
      frame.style.pointerEvents = "";
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });
  /* Register the frame NOW, not on load: the SDK inside the app posts its
     first state read while the document is still parsing, which is before
     the load event fires. Registering late loses that first request. */
  if (frame.contentWindow) FRAME_PROJECT.set(frame.contentWindow, project);
  w.onClose = () => {
    if (frame.contentWindow) FRAME_PROJECT.delete(frame.contentWindow);
  };

  const bar = el("div", "statusbar thin");
  const reload = el("button", "btn", "Reload");
  const doReload = () => {
    frame.src = appURL(project) + "?t=" + Date.now();
    if (frame.contentWindow) FRAME_PROJECT.set(frame.contentWindow, project);
  };
  reload.addEventListener("click", doReload);
  /* Let a finished chat turn refresh this window in place -- the live
     preview half of the chat-left, app-right loop. */
  w.__reloadApp = doReload;
  bar.appendChild(reload);
  const chat = el("button", "btn", "Chat");
  chat.title = "Edit this app by asking -- the conversation docks on the left";
  /* Reveal moves the project's ONE chat in here; hide leaves it parked in
     the pane, still live, still streaming if a turn is running. */
  /* Revealing the dock GROWS the window; it does not shrink the app.

     The dock is a fixed-width column inside the same window, so docking
     it used to come straight out of the app's own viewport: a 380x260
     app opened with the chat showing got 109px of width -- 71% of what
     it asked for -- and rendered clipped. The app's declared width is
     the one thing in that layout the desktop has no right to overrule,
     so the window widens by what the dock and grip take and the frame
     keeps its size. Hiding the dock gives the width back.

     Clamped to the viewport, since a wide app plus a dock can exceed the
     screen -- and a window wider than the desktop is a worse outcome
     than a narrower app. */
  const dockWidth = () =>
    Math.round(side.getBoundingClientRect().width +
               grip.getBoundingClientRect().width);
  /* How much room the window actually has: the STAGE, not the viewport.
     While the projects dock is showing, #stage starts to the right of it
     and clips what overflows -- so measuring against window.innerWidth
     would grow the window under the dock's own edge and clip exactly the
     side this is meant to protect. Measured from the window's left edge,
     since that is where its width is spent from. */
  const roomForWindow = () => {
    const stage = desktopRect();
    return Math.max(200, Math.round(
      stage.right - w.node.getBoundingClientRect().left - 8));
  };
  /* Remember what the dock actually cost, which is NOT always dockWidth:
     a window already at the stage's edge grows by less, or not at all,
     and giving back the full dock width would shrink the app a little
     more on every show/hide cycle until it was unusable. */
  let dockGrowth = 0;
  const showChat = () => {
    const was = side.style.display !== "none";
    side.style.display = "flex";
    grip.style.display = "";
    showChatIn(project, side).focus();
    if (!was) {
      const before = w.node.offsetWidth;
      w.node.style.width =
        Math.min(before + dockWidth(), roomForWindow()) + "px";
      dockGrowth = Math.max(0, w.node.offsetWidth - before);
    }
  };
  chat.addEventListener("click", () => {
    if (side.style.display !== "none") {
      const give = dockGrowth;
      dockGrowth = 0;
      side.style.display = "none"; grip.style.display = "none";
      w.node.style.width = Math.max(200, w.node.offsetWidth - give) + "px";
      /* Handing it back to the dock rather than parking it here keeps the
         "one place at a time" rule true while the pane is hidden. */
      if (S.dockProject === project) paintTree();
      return;
    }
    showChat();
  });
  /* The dock asks this before deciding whether to host the chat itself;
     openApp calls showChat when raising an already-open window. */
  w.__chatShown = () => side.style.display !== "none";
  w.__showChat = showChat;
  bar.appendChild(chat);
  bar.appendChild(el("span", "muted", app.kind + (app.network ? " -- net: " + app.network : "")));
  w.node.appendChild(bar);

  /* Closing this window must not close the conversation. The chat is
     re-parented out of the doomed pane and back to the dock, which is
     where it lives when no app window is open -- so reopening the app
     finds the same transcript rather than a blank one.

     The repaint is DEFERRED because closeWindow fires onClose before it
     removes the window from WINS. Repainting inline, the dock would
     still find this window there, still ask __chatShown (true, the pane
     was never hidden), and render the "conversation is in the app
     window" placeholder -- pointing a Show it button at a window that no
     longer exists, with the chat stranded in the detached pane until
     something else happened to repaint. One turn of the event loop is
     all it takes for the close to have finished. */
  const priorClose = w.onClose;
  w.onClose = () => {
    if (priorClose) { try { priorClose(); } catch {} }
    setTimeout(() => { if (S.dockProject === project) paintTree(); }, 0);
  };

  if (opts && opts.chat) showChat();
  return w;
}

/* A process app: python / fpc / delphi. These are not documents, so there is
   nothing to render -- the window is a control panel. It states plainly WHERE
   the process runs, because the desktop metaphor otherwise implies "here",
   and with a remote gateway that is wrong. */
async function openProcessApp(project, app) {
  const w = createWindow({
    key: "proc:" + project, title: (app.name || project) + " -- Run",
    width: 520, height: 340, icon: "app", pad: false,
  });

  const head = el("div");
  head.style.cssText = "padding:6px 6px 0";
  head.appendChild(el("div", null, `${app.name || project}  [${app.kind}]`));
  /* Three places an app can run, and the user should never have to guess
     which. A remote daemon is the one that surprises people: the app's
     files and ports are on a machine that is neither this browser nor the
     gateway. */
  const remoteDocker = (app.run_backend === "docker-remote");
  const inDocker = (app.run_backend === "docker") || remoteDocker;
  const where = el("div", "muted",
    (remoteDocker ? "Runs in a container on a remote Docker host"
     : inDocker   ? "Runs in a container on the PasClaw host"
                  : "Runs as a process on the PasClaw host") +
    (!remoteDocker && S.host ? `: ${S.host}` : ""));
  head.appendChild(where);
  if (remoteDocker)
    head.appendChild(el("div", "muted",
      "Its files are copied in, not mounted, and it cannot publish a port " +
      "back to this machine \u2014 console apps only."));
  if (!inDocker)
    head.appendChild(el("div", "muted",
      "Set shell_backend to \"docker\" to run apps in a container instead."));
  const cmd = el("div", "muted", "");
  cmd.style.cssText = "font-family:monospace;word-break:break-all;margin-top:3px";
  head.appendChild(cmd);
  if (app.network) head.appendChild(el("div", "muted", "declares network: " + app.network));
  if (app.env) head.appendChild(el("div", "muted",
    "expects env: " + app.env + "  (put these in the project's app/.env)"));
  w.body.appendChild(head);

  const bar = el("div");
  bar.style.cssText = "display:flex;gap:4px;padding:6px";
  const runBtn = el("button", "btn", "Run");
  const stopBtn = el("button", "btn", "Stop");
  const openBtn = el("button", "btn", "Open");
  openBtn.disabled = true;
  const state = el("span", "muted", "");
  state.style.cssText = "align-self:center;margin-left:6px";
  bar.appendChild(runBtn); bar.appendChild(stopBtn);
  bar.appendChild(openBtn); bar.appendChild(state);
  w.body.appendChild(bar);

  const log = el("div", "log in");
  log.style.cssText = "margin:0 6px 6px;height:calc(100% - 132px);" +
                      "white-space:pre-wrap;font-family:monospace;font-size:11px";
  w.body.appendChild(log);

  let url = null;
  function render(info) {
    state.textContent = info.state + (info.port ? `  port ${info.port}` : "");
    cmd.textContent = info.command || app.run_command || "";
    runBtn.disabled = info.state === "running";
    stopBtn.disabled = info.state !== "running";
    url = info.url || (info.port ? `http://127.0.0.1:${info.port}/` : null);
    openBtn.disabled = !url;
  }

  async function refresh() {
    try {
      const m = await api("/v1/apps/" + project);
      render({ state: m.run_state || "stopped", port: m.run_port || 0,
               command: m.run_command, url: m.run_url });
      const l = await api(`/v1/apps/${project}/runlog`);
      const atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
      log.textContent = l.log || "";
      if (atEnd) log.scrollTop = log.scrollHeight;
    } catch {}
  }

  runBtn.addEventListener("click", async () => {
    runBtn.disabled = true;
    try {
      /* First ask WITHOUT confirm: the gateway answers 409 with the exact
         command, which is what we show the user. Consent to a hidden command
         is not consent. */
      let planned = app.run_command || "";
      try {
        await api(`/v1/apps/${project}/run`, { method: "POST", body: {} });
      } catch (e) {
        if (e.status === 409 && e.detail && e.detail.command) planned = e.detail.command;
      }
      const lines = [
        `Run this app?`, ``,
        `  ${planned || "(command unknown)"}`, ``,
        S.host ? `It runs on the PasClaw host (${S.host}), not necessarily on this machine.`
               : `It runs on the PasClaw host, not necessarily on this machine.`,
      ];
      if (app.network) lines.push(``, `It declares network access to: ${app.network}`);
      lines.push(``, remoteDocker
        ? `It runs inside a container on a REMOTE Docker host; its files are copied there.`
        : inDocker
        ? `It runs inside a container; only its app/ directory is mounted.`
        : `It runs directly on that machine, with the same reach you have.`);
      if (!confirm(lines.join("\n"))) { runBtn.disabled = false; return; }
      const info = await api(`/v1/apps/${project}/run`,
                            { method: "POST", body: { confirm: true } });
      render(info);
      /* An app that serves HTTP is worth opening straight away. */
      if (info.url) openBtn.click();
    } catch (e) {
      log.textContent += "\n" + e.message;
    }
    refresh();
  });

  stopBtn.addEventListener("click", async () => {
    try { await api(`/v1/apps/${project}/stop`, { method: "POST" }); } catch (e) {}
    refresh();
  });

  openBtn.addEventListener("click", () => {
    if (!url) return;
    /* A process app that serves HTTP gets a browser window like any page.
       It is NOT sandboxed as an app frame -- it is a server the user chose
       to run, on a port only they can reach. */
    const v = createWindow({
      key: "procview:" + project, title: (app.name || project),
      width: app.width || 640, height: (app.height || 480) + 8,
      icon: "globe", pad: false,
    });
    const f = el("iframe", "app");
    f.src = url;
    v.body.appendChild(f);
  });

  await refresh();
  const timer = setInterval(refresh, 3000);
  w.onClose = () => clearInterval(timer);
  return w;
}

async function openJobLog(project, task, job) {
  const w = createWindow({
    key: `job:${project}:${task}:${job}`,
    title: `${project} ${task}/${job}`, width: 520, height: 300, icon: "page", pad: false,
  });
  const pre = el("div", "log in");
  pre.style.whiteSpace = "pre-wrap";
  pre.style.fontFamily = "monospace";
  w.body.appendChild(pre);
  w.body.style.padding = "3px";
  let stop = false;
  w.onClose = () => { stop = true; };
  async function poll() {
    if (stop) return;
    try {
      const j = await api(`/v1/projects/${project}/tasks/${task}/jobs/${job}/log`);
      const at = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 4;
      pre.textContent = j.log || "(no output yet)";
      if (at) pre.scrollTop = pre.scrollHeight;
    } catch {}
    if (!stop) setTimeout(poll, 2000);
  }
  poll();
  return w;
}

/* ==========================================================================
   Browser -- search that returns a page
   ========================================================================== */

function openBrowser(pageId, initialQuery, initialKind) {
  const w = createWindow({ key: "browser", title: "Browser", width: 620, height: 460,
                           icon: "globe", pad: false,
                           restore: { fn: "browser", arg: pageId || "" } });
  const bar = el("div");
  bar.style.cssText = "display:flex;gap:4px;padding:3px";
  const q = el("input", "fld");
  q.type = "text";
  q.placeholder = "Ask anything -- the answer comes back as a page";
  q.style.flex = "1 1 auto";
  const go = el("button", "btn", "Search");
  /* Deep research is a different act, so it gets a different button rather
     than a checkbox nobody finds: plan the sub-questions, read several
     independent sources, then synthesise. It takes minutes, which is why it
     narrates. */
  const deep = el("button", "btn", "Research");
  deep.title = "Plan, read several sources, and write a longer sourced report";
  /* The promotion gesture. A page is a document; this is the one click that
     turns it into software you own -- the plan's whole pitch in miniature.
     Disabled until there is a page to promote. */
  const mk = el("button", "btn", "Make interactive");
  mk.title = "Copy this page into a project as an app you can change";
  mk.disabled = true;
  bar.appendChild(q); bar.appendChild(go); bar.appendChild(deep); bar.appendChild(mk);
  w.body.appendChild(bar);

  const frame = el("iframe", "app");
  frame.setAttribute("sandbox", "allow-same-origin");
  frame.style.height = "calc(100% - 30px)";
  w.body.appendChild(frame);

  const status = el("div", "statusbar thin");
  w.node.appendChild(status);

  let current = null;

  function show(page) {
    current = page;
    mk.disabled = false;
    frame.src = "/pages/" + page.id + "/";
    setTitle(w, page.title || "Browser");
    status.textContent = "";
    const n = page.source_count != null ? page.source_count : (page.sources || []).length;
    status.appendChild(el("span", n ? "grounded" : "ungrounded",
      n ? `GROUNDED -- ${n} source${n === 1 ? "" : "s"}` : "UNGROUNDED -- no sources"));
  }

  async function search(kind) {
    const query = q.value.trim();
    if (!query) return;
    go.disabled = true; deep.disabled = true;
    status.textContent = kind === "research" ? "Researching..." : "Searching...";

    /* Research narrates. The bar is deliberately NOT a percentage of
       anything -- nobody knows how many sources the question needs -- so it
       creeps toward, but never reaches, done. A fake 100% is worse than an
       honest "still going". */
    let prog = null, seen = 0, off = null;
    if (kind === "research") {
      prog = showProgress({ title: "Deep research", text: query });
      off = ev => {
        seen++;
        prog.set(Math.min(90, seen * 7),
                 ev.phase + (ev.detail ? ": " + ev.detail.slice(0, 60) : ""));
      };
      onDesktopEvent("page-progress", off);
      if (!EV.live) prog.set(5, "working (no live feed from this gateway)");
    }

    try {
      const j = await api("/v1/pages", { method: "POST", body: { query, kind } });
      const page = await api("/v1/pages/" + j.id);
      show(page);
    } catch (e) {
      status.textContent = "";
      status.appendChild(el("span", "ungrounded", e.message));
    }
    if (prog) {
      /* Drop the handler with the dialog; a second research run should not
         drive a closed window. */
      const list = EV.handlers["page-progress"] || [];
      const at = list.indexOf(off);
      if (at >= 0) list.splice(at, 1);
      prog.done();
    }
    go.disabled = false; deep.disabled = false;
  }
  go.addEventListener("click", () => search("search"));
  deep.addEventListener("click", () => search("research"));
  q.addEventListener("keydown", e => { if (e.key === "Enter") search("search"); });
  /* The desktop ask field routes questions here when this window is already
     open -- createWindow returns the live singleton without re-running this
     builder, so the question has to arrive through the window itself. */
  w.__ask = (query, kind) => { q.value = query; search(kind || "search"); };

  mk.addEventListener("click", async () => {
    if (!current) return;
    mk.disabled = true;
    status.textContent = "Making it into an app...";
    try {
      const j = await api(`/v1/pages/${current.id}/promote`, { method: "POST" });
      /* The page stays where it was; the app is the new thing. Open it and
         refresh the desktop so its icon is there too. */
      await loadProjects();
      openApp(j.project);
      status.textContent = "";
      status.appendChild(el("span", "grounded",
        `Now a project: ${j.project} \u2014 ask PasClaw to change it`));
    } catch (e) {
      status.textContent = "";
      status.appendChild(el("span", "ungrounded", e.message));
    }
    mk.disabled = false;
  });

  if (pageId) api("/v1/pages/" + pageId).then(show).catch(() => {});
  else if (initialQuery) {
    /* Asked from the desktop background: the Browser opens already working
       on the question rather than presenting an empty field to retype into. */
    q.value = initialQuery;
    search(initialKind || "search");
  }
  else setTimeout(() => q.focus(), 0);
  return w;
}

/* ==========================================================================
   File Manager -- the workspace directory, as a directory

   The plan's "files are alive": the agent's own working files are on the
   desktop rather than behind a tool call. Read-only on purpose. /v1/fs is
   sandbox-checked and filters secret-bearing files (config.json, .env, TLS
   keys) server-side, so this window shows exactly what the operator surface
   is willing to show and nothing more -- and a browse window is not the
   place to invent a delete button.
   ========================================================================== */

function openFiles(startPath) {
  const w = createWindow({ key: "files", title: "File Manager", width: 640,
                           height: 440, icon: "folder", pad: false,
                           restore: { fn: "files", arg: startPath || "" } });
  const bar = el("div");
  bar.style.cssText = "display:flex;gap:4px;padding:3px;align-items:center";
  const up = el("button", "btn", "Up");
  const wsBtn = el("button", "btn", "Workspace");
  const where = el("input", "fld");
  where.type = "text";
  where.style.cssText = "flex:1 1 auto;font-family:monospace";
  bar.appendChild(up); bar.appendChild(wsBtn); bar.appendChild(where);
  w.body.appendChild(bar);

  const list = el("div");
  list.style.cssText = "overflow:auto;height:calc(100% - 30px)";
  w.body.appendChild(list);
  const status = el("div", "statusbar thin", "");
  w.node.appendChild(status);

  let cwd = startPath || "";
  let wsRoot = "";

  /* Parent directory, without assuming a separator the server did not use. */
  function parentOf(pathStr) {
    const sep = pathStr.includes("\\") && !pathStr.includes("/") ? "\\" : "/";
    const cut = pathStr.replace(/[\/\\]+$/, "").lastIndexOf(sep);
    return cut > 0 ? pathStr.slice(0, cut) : pathStr;
  }

  async function show(pathStr) {
    status.textContent = "Reading...";
    try {
      const j = await api("/v1/fs" + (pathStr ? "?path=" + encodeURIComponent(pathStr) : ""));
      cwd = j.path;
      wsRoot = j.workspace_root || "";
      wsBtn.disabled = !wsRoot;
      where.value = cwd;
      list.textContent = "";
      const rows = (j.entries || []).slice().sort((a, b) =>
        (a.dir === b.dir) ? a.name.localeCompare(b.name) : (a.dir ? -1 : 1));
      if (!rows.length) list.appendChild(el("div", "row muted", "(empty)"));
      rows.forEach(e => {
        const r = el("div", "row");
        r.style.cssText = "display:flex;gap:6px;padding:2px 6px;cursor:default";
        const ic = el("span");
        ic.style.cssText = "width:16px;height:16px;flex:0 0 16px";
        ic.innerHTML = icon(e.dir ? "folder" : "page");
        const nm = el("span", null, e.name);
        nm.style.flex = "1 1 auto";
        const sz = el("span", "muted", e.dir ? "" : String(e.size));
        r.appendChild(ic); r.appendChild(nm); r.appendChild(sz);
        r.addEventListener("dblclick", () => {
          if (e.dir) show(cwd.replace(/[\/\\]+$/, "") + "/" + e.name);
          else openFileView(cwd.replace(/[\/\\]+$/, "") + "/" + e.name, e.name);
        });
        list.appendChild(r);
      });
      status.textContent = rows.length + " item" + (rows.length === 1 ? "" : "s");
    } catch (err) {
      list.textContent = "";
      list.appendChild(el("div", "row muted", err.message));
      status.textContent = "";
    }
  }

  up.addEventListener("click", () => show(parentOf(cwd)));
  wsBtn.addEventListener("click", () => { if (wsRoot) show(wsRoot); });
  where.addEventListener("keydown", e => { if (e.key === "Enter") show(where.value.trim()); });
  show(startPath || "");
  return w;
}

/* A file, in a document window. Binary files say so rather than rendering
   as mojibake, and a truncated read says it was truncated -- a viewer that
   quietly shows you the first 64KB of a log is worse than one that admits
   to it. */
async function openFileView(pathStr, name) {
  const w = createWindow({ title: name || "File", width: 620, height: 440,
                           icon: "page", pad: false });
  const pre = el("pre");
  pre.style.cssText = "margin:0;padding:6px;overflow:auto;height:100%;" +
                      "white-space:pre-wrap;word-break:break-word;font-size:11px";
  w.body.appendChild(pre);
  const status = el("div", "statusbar thin", "");
  w.node.appendChild(status);
  try {
    const j = await api("/v1/fs/read?path=" + encodeURIComponent(pathStr));
    if (j.binary) {
      pre.textContent = "(binary file, " + j.size + " bytes)";
    } else {
      pre.textContent = j.content || "";
      if (j.truncated) status.textContent = "truncated";
    }
  } catch (e) {
    pre.textContent = e.message;
  }
  return w;
}

/* ==========================================================================
   Library -- every page and project ever made
   ========================================================================== */

async function openLibrary() {
  const w = createWindow({ key: "library", title: "Library", width: 460, height: 380,
                           icon: "brain", pad: false,
                           restore: { fn: "library" } });
  const list = el("div", "list in");
  list.style.height = "100%";
  w.body.appendChild(list);
  w.body.style.padding = "3px";

  try {
    const j = await api("/v1/pages");
    const pages = j.pages || [];
    if (!pages.length) {
      list.appendChild(el("div", "row muted", "No pages yet. Ask something in the Browser."));
    }
    pages.forEach(p => {
      const r = el("div", "row");
      const n = p.source_count || 0;
      r.textContent = `${p.title}  --  ${n} source${n === 1 ? "" : "s"}  ${p.created || ""}`;
      r.title = p.query || "";
      r.addEventListener("click", () => {
        list.querySelectorAll(".row.sel").forEach(x => x.classList.remove("sel"));
        r.classList.add("sel");
      });
      r.addEventListener("dblclick", () => openBrowser(p.id));
      list.appendChild(r);
    });
  } catch (e) {
    list.appendChild(el("div", "row", e.message));
  }
  return w;
}

/* ==========================================================================
   Display Properties -- the style picker
   ========================================================================== */

const STYLE_KEY = "pasclaw.desktop.style";

function loadStyleList() {
  /* The generated palette block carries its own manifest comment; read the
     style ids straight out of the stylesheet so the picker can never drift
     from the palettes that are actually present. */
  const ids = new Set();
  for (const sheet of document.styleSheets) {
    let rules;
    try { rules = sheet.cssRules; } catch { continue; }
    for (const r of rules || []) {
      const m = r.selectorText && r.selectorText.match(/\[data-style="([^"]+)"\]/);
      if (m) ids.add(m[1]);
    }
  }
  /* Display names come from the same generated block's STYLES manifest.
     CSS comments don't survive into cssRules, so read the <style>
     element's text. A style present in the sheet but missing from the
     manifest still gets a name -- never an empty row. */
  S.styleTitles = {};
  try {
    for (const st of document.querySelectorAll("style")) {
      const m = st.textContent.match(/\/\* STYLES = (\[.*?\]) \*\//);
      if (!m) continue;
      JSON.parse(m[1]).forEach(s => { S.styleTitles[s.id] = s.title; });
      break;
    }
  } catch {}
  S.styles = Array.from(ids).sort(
    (a, b) => styleTitle(a).localeCompare(styleTitle(b)));
}

/* Every theme is a vibe of the machine it remembers, and the names say
   so. The manifest titles already end in "Vibes"; the suffix is enforced
   here too so a stale or hand-edited manifest can't leak one without. */
function styleTitle(id) {
  const t = (S.styleTitles && S.styleTitles[id]) || id;
  return /\bVibes$/.test(t) ? t : t + " Vibes";
}

function applyStyle(id) {
  if (!id) return;
  document.documentElement.setAttribute("data-style", id);
  S.style = id;
  try { localStorage.setItem(STYLE_KEY, id); } catch {}
}

function openDisplay() {
  const w = createWindow({ key: "display", title: "Display Properties",
                           width: 260, height: 380, icon: "gear", max: false, pad: false });
  const list = el("div", "list in");
  list.style.cssText = "height:calc(100% - 26px);margin:3px";
  S.styles.forEach(id => {
    const r = el("div", "row" + (id === S.style ? " sel" : ""), styleTitle(id));
    r.addEventListener("click", () => {
      list.querySelectorAll(".row.sel").forEach(x => x.classList.remove("sel"));
      r.classList.add("sel");
      applyStyle(id);
    });
    list.appendChild(r);
  });
  w.body.appendChild(list);
  const bar = el("div", "statusbar thin");
  bar.appendChild(el("span", "muted", S.styles.length + " styles"));
  w.node.appendChild(bar);
  return w;
}

/* ==========================================================================
   Boot
   ========================================================================== */

async function boot() {
  loadStyleList();
  try { applyStyle(localStorage.getItem(STYLE_KEY) || "Synthwave"); } catch { applyStyle("Synthwave"); }
  buildMenu();
  initDock();
  initAsk();
  try {
    /* Ask the gateway how it is arranged before rendering anything that
       depends on it. A gateway too old to answer just leaves the defaults. */
    try {
      const cfg = await api("/v1/desktop/config");
      S.appsOrigin = cfg.apps_origin || "";
      S.appsIsolated = !!cfg.apps_isolated;
      S.host = cfg.host || "";
    } catch {}
    await loadWorkspaces();
    await loadProjects();
    await loadDesktops();
    /* Only after the first load succeeds -- subscribing before we know the
       token works would just produce a reconnect loop behind an auth wall. */
    subscribeEvents();
    await restoreDesktop();
  } catch (e) {
    /* A bearer-gated gateway is the usual cause; say so plainly rather than
       leaving an empty desktop with no explanation. */
    const w = createWindow({ title: "PasClaw Desktop", width: 380, height: 190, max: false });
    w.body.appendChild(el("p", null, "Could not reach the gateway:"));
    w.body.appendChild(el("p", null, e.message));
    if (e.status === 401) {
      const p = el("p", null, "This gateway requires a token. Set one, then reload:");
      w.body.appendChild(p);
      const row = el("div"); row.style.cssText = "display:flex;gap:4px";
      const inp = el("input", "fld"); inp.type = "password"; inp.style.flex = "1 1 auto";
      const save = el("button", "btn", "Save");
      save.addEventListener("click", () => {
        try { localStorage.setItem(TOKEN_KEY, inp.value.trim()); } catch {}
        location.reload();
      });
      row.appendChild(inp); row.appendChild(save);
      w.body.appendChild(row);
    }
    return;
  }
  paintTree();
}
boot();
</script>
