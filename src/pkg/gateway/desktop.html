<!DOCTYPE html>
<!--
  PasClaw Desktop -- the retro desktop client, in the browser.

  One file, vanilla ES2020, no build step: the same house rule webui.html
  follows, so editing this file and re-running `make` is the whole workflow.

  It is the twin of the FireMonkey client in desktop/: both drive the same
  /v1/* surface (PasClaw.Gateway.Desktop) and both take their colors from the
  SAME generated palette table, so a style looks identical in either. The
  palette block below is machine-generated from the styles repo -- see
  scripts/export-retro-palettes.py. Do not hand-edit colors.
-->

html, body {

  background: var(--desktop);
  -webkit-font-smoothing: none;
}
button, input, select, textarea { font: inherit; color: inherit; }

/* The bevel system. Retro chrome is 1-2px light/dark edges, which is exactly
   what an inset box-shadow expresses -- no images, crisp at any zoom. */
.out {
  background: var(--face);
  box-shadow:
    inset 1px 1px 0 0 var(--light), inset -1px -1px 0 0 var(--darkshadow),
    inset 2px 2px 0 0 var(--highlight), inset -2px -2px 0 0 var(--shadow);
}

#desktop {
  position: absolute; inset: 0 0 34px 0;

}

   permanent left edge (the plan's "left side of the Desktop is a treeview"),
   so windows and icons live in #stage beside it rather than on top of it. */
#dock {
  position: absolute; left: 0; top: 0; bottom: 0; width: 232px;
  display: flex; flex-direction: column; padding: 3px;
}
#dock.hidden { display: none; }
#dockhead {
  flex: 0 0 auto; height: 20px; display: flex; align-items: center; gap: 4px;
  padding: 0 2px 0 4px; font-weight: bold; font-size: 11px;

  background-image: linear-gradient(90deg, var(--titlea), var(--titlea2));
  color: var(--titleatext); user-select: none;
}

#treebody { flex: 1 1 auto; margin-top: 2px; overflow: auto; }
#dockfoot { flex: 0 0 auto; display: flex; gap: 3px; padding-top: 3px; }
#dockfoot .btn { flex: 1 1 auto; font-size: 11px; }
/* Drag handle for the dock's width. */
#dockgrip {
  position: absolute; top: 0; bottom: 0; right: -2px; width: 5px;

#stage { position: absolute; left: 232px; right: 0; top: 0; bottom: 0; overflow: hidden; }

}

}
.dicon .cap {

.win.max { left: 0 !important; top: 0 !important; }
.titlebar {
  display: flex; align-items: center; gap: 3px; height: 20px;

}
.win.active .titlebar {

  color: var(--titleatext);
}
.titlebar .t {
  flex: 1 1 auto; font-weight: bold; font-size: 11px;

}

.list { background: var(--window); overflow: auto; padding: 1px; }

/* ---- menu ---- */

/* ==========================================================================

/* The gateway may be bearer-gated. webui.html keeps its token in
   localStorage under this key; reuse it so opening the desktop after the
   classic UI needs no second login. */
const TOKEN_KEY = "pasclaw.gw.token";
function token() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; } }

async function api(path, opts = {}) {
  const o = Object.assign({}, opts);
  o.headers = Object.assign({ "content-type": "application/json" }, o.headers || {});
  const t = token();
  if (t) o.headers["authorization"] = "Bearer " + t;
  if (o.body && typeof o.body !== "string") o.body = JSON.stringify(o.body);
  const r = await fetch(path, o);
  const text = await r.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch { /* not json */ }
  if (!r.ok) {
    const msg = (json && json.error) || text || ("http " + r.status);
    const e = new Error(msg);
    e.status = r.status;
    /* Carry the whole body: a 409 consent refusal returns the command the
       caller must show before asking again. */
    e.detail = json;
    throw e;
  }
  return json;
}

const S = {
  workspaces: [], active: "workspace",
  projects: [], tree: {},          /* project -> { open, tasks: [...] } */
  selected: null,
  /* When set, the dock shows that project (chat + actions) instead of the
     board; the board is one "◂ Projects" away. See paintProjectPane. */
  dockProject: null,

     remote gateway and a "local" app is local to the server, not to you.
     The UI says so rather than letting the desktop metaphor imply it. */
  host: "",
};

/* ==========================================================================
   Window manager
   ========================================================================== */

let zTop = 10, winSeq = 0, cascade = 0;
const WINS = new Map();

function desktopRect() { return $("#stage").getBoundingClientRect(); }

function createWindow(opts) {
  const o = Object.assign({
    title: "Window", width: 480, height: 340, x: null, y: null,
    resizable: true, min: true, max: true, key: null, icon: "app",
    onClose: null,
  }, opts);

  /* A window with a key is a singleton -- reopening focuses the live one
     instead of stacking duplicates (Display Properties, the tree, Library). */
  if (o.key && WINS.has(o.key)) {
    const w = WINS.get(o.key);
    restoreWindow(w); focusWindow(w);
    return w;
  }

  const r = desktopRect();
  const width = Math.min(o.width, Math.max(220, r.width - 20));
  const height = Math.min(o.height, Math.max(140, r.height - 20));
  const x = o.x != null ? o.x : Math.min(24 + cascade * 22, Math.max(0, r.width - width - 10));
  const y = o.y != null ? o.y : Math.min(18 + cascade * 20, Math.max(0, r.height - height - 10));
  cascade = (cascade + 1) % 8;

  const n = el("div", "win out");
  n.style.left = x + "px"; n.style.top = y + "px";
  n.style.width = width + "px"; n.style.height = height + "px";
  n.style.zIndex = ++zTop;

  const bar = el("div", "titlebar");
  const ttl = el("div", "t", o.title);
  bar.appendChild(ttl);
  const mkBtn = (label, title, fn) => {
    const b = el("button", "tbtn"); b.innerHTML = label; b.title = title;
    b.addEventListener("mousedown", e => e.stopPropagation());
    b.addEventListener("click", e => { e.stopPropagation(); fn(); });
    bar.appendChild(b); return b;
  };
  if (o.min) mkBtn("&#9866;", "Minimize", () => minimizeWindow(w));
  if (o.max) mkBtn("&#9633;", "Maximize", () => toggleMax(w));
  mkBtn("&#10005;", "Close", () => closeWindow(w));
  n.appendChild(bar);

  const body = el("div", "wbody" + (o.pad === false ? "" : " pad"));
  n.appendChild(body);

  const w = {
    id: ++winSeq, key: o.key, node: n, bar, body, title: o.title,
    icon: o.icon, minimized: false, maximized: false, prev: null,
    onClose: o.onClose, onActive: null,
    /* How to bring this window back after a reload. Only windows that CAN
       be reconstructed carry one -- a progress dialog or a wizard is tied
       to work that is over, and restoring it would be a lie about state. */
    restore: o.restore || null,
  };
  WINS.set(o.key || ("w" + w.id), w);
  n.__win = w;
  if (w.restore) saveDesktop();

  if (o.resizable) {
    ["n","s","w","e","nw","ne","sw","se"].forEach(d => {
      const g = el("div", "edge " + d);
      g.addEventListener("mousedown", e => startResize(e, w, d));
      n.appendChild(g);
    });
  }

  /* Click ANYWHERE on an inactive window activates it, and the same press
     also begins the drag -- no second click needed. That behavior is the
     one every one of these systems shared. */
  n.addEventListener("mousedown", () => focusWindow(w), true);
  bar.addEventListener("mousedown", e => startDrag(e, w));
  bar.addEventListener("dblclick", () => { if (o.max) toggleMax(w); });

  $("#stage").appendChild(n);
  focusWindow(w);
  paintTaskbar();
  return w;
}

function setTitle(w, t) { w.title = t; w.bar.querySelector(".t").textContent = t; paintTaskbar(); }

function focusWindow(w) {
  if (w.minimized) restoreWindow(w);
  for (const x of WINS.values()) {
    if (x === w) continue;
    if (x.node.classList.contains("active")) {
      x.node.classList.remove("active");
      if (x.onActive) x.onActive(false);
    }
  }
  if (!w.node.classList.contains("active")) {
    w.node.classList.add("active");
    if (w.onActive) w.onActive(true);
  }
  w.node.style.zIndex = ++zTop;
  paintTaskbar();
}

function minimizeWindow(w) {
  w.minimized = true; w.node.classList.add("min"); w.node.classList.remove("active");
  paintTaskbar();
}
function restoreWindow(w) {
  w.minimized = false; w.node.classList.remove("min");
  paintTaskbar();
}
function toggleMax(w) {
  const r = desktopRect();
  if (w.maximized) {
    Object.assign(w.node.style, w.prev);
    w.maximized = false; w.node.classList.remove("max");
  } else {
    w.prev = { left: w.node.style.left, top: w.node.style.top,
               width: w.node.style.width, height: w.node.style.height };
    Object.assign(w.node.style, { left: "0px", top: "0px",
      width: r.width + "px", height: r.height + "px" });
    w.maximized = true; w.node.classList.add("max");
  }
}
function closeWindow(w) {
  if (w.onClose) { try { w.onClose(); } catch {} }
  w.node.remove();
  for (const [k, v] of WINS) if (v === w) WINS.delete(k);
  paintTaskbar();
  saveDesktop();
}

function startDrag(e, w) {
  if (e.button !== 0) return;
  const r = desktopRect();
  let sx = e.clientX, sy = e.clientY;
  let ox = w.node.offsetLeft, oy = w.node.offsetTop;
  /* Dragging a maximized window restores it, keeping the grab point --
     the pointer stays where it was on the title bar. */
  let restored = false;
  document.body.classList.add("dragging");
  const move = ev => {
    if (w.maximized && !restored && Math.abs(ev.clientY - sy) > 4) {
      const frac = (sx - r.left) / r.width;
      toggleMax(w);
      const nw = w.node.offsetWidth;
      ox = Math.max(0, sx - r.left - nw * frac); oy = 0;
      sx = ev.clientX; sy = ev.clientY; restored = true;
    }
    if (w.maximized) return;
    let nx = ox + ev.clientX - sx, ny = oy + ev.clientY - sy;
    /* Windows stay reachable: the title bar may not leave the desktop. */
    nx = Math.max(-w.node.offsetWidth + 60, Math.min(nx, r.width - 40));
    ny = Math.max(0, Math.min(ny, r.height - 22));
    w.node.style.left = nx + "px"; w.node.style.top = ny + "px";
  };
  const up = ev => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    document.body.classList.remove("dragging");
    /* Edge maximize: shoved against the top of the stage. */
    if (!w.maximized && ev.clientY - r.top <= 2) toggleMax(w);
    saveDesktop();
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
  e.preventDefault();
}

function startResize(e, w, dir) {
  if (e.button !== 0 || w.maximized) return;
  e.stopPropagation();
  const sx = e.clientX, sy = e.clientY;
  const x0 = w.node.offsetLeft, y0 = w.node.offsetTop;
  const w0 = w.node.offsetWidth, h0 = w.node.offsetHeight;
  document.body.classList.add("dragging");
  const move = ev => {
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    let nx = x0, ny = y0, nw = w0, nh = h0;
    if (dir.includes("e")) nw = Math.max(200, w0 + dx);
    if (dir.includes("s")) nh = Math.max(110, h0 + dy);
    if (dir.includes("w")) { nw = Math.max(200, w0 - dx); nx = x0 + (w0 - nw); }
    if (dir.includes("n")) { nh = Math.max(110, h0 - dy); ny = y0 + (h0 - nh); }
    Object.assign(w.node.style, { left: nx + "px", top: ny + "px",
      width: nw + "px", height: nh + "px" });
  };
  const up = () => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    document.body.classList.remove("dragging");
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
  e.preventDefault();
}

/* Keep windows on-screen when the desktop resizes. */
window.addEventListener("resize", () => {
  const r = desktopRect();
  for (const w of WINS.values()) {
    if (w.maximized) {
      w.node.style.width = r.width + "px"; w.node.style.height = r.height + "px";
      continue;
    }
    w.node.style.left = Math.min(w.node.offsetLeft, Math.max(0, r.width - 60)) + "px";
    w.node.style.top  = Math.min(w.node.offsetTop,  Math.max(0, r.height - 22)) + "px";
  }
});

/* ==========================================================================
   Taskbar
   ========================================================================== */

function paintTaskbar() {
  const host = $("#tasks");
  host.textContent = "";
  for (const w of WINS.values()) {
    const b = el("button", "taskbtn btn" +
      (w.node.classList.contains("active") && !w.minimized ? " on" : "") +
      (w.flash ? " flash" : ""), w.title);
    b.addEventListener("click", () => {
      if (w.flash) { w.flash = false; }
      if (w.minimized) { restoreWindow(w); focusWindow(w); }
      else if (w.node.classList.contains("active")) minimizeWindow(w);
      else focusWindow(w);
    });
    host.appendChild(b);
  }

  /* The pager pages DESKTOPS -- views inside this workspace. Cheap,
     instant, invisible to the agent. Workspaces moved to the menu, because
     switching one changes what PasClaw remembers and the consequential
     action should not have the one-click gesture. */
  const pg = $("#pager");
  pg.textContent = "";
  for (let n = 1; n <= (S.deskCount || 1); n++) {
    const b = el("button", "pgbtn btn" + (n === (S.desk || 1) ? " on" : ""), String(n));
    b.title = `Desktop ${n}`;
    b.addEventListener("click", () => switchDesktop(n));
    pg.appendChild(b);
  }
  if ((S.deskCount || 1) < 9) {
    const add = el("button", "pgbtn btn", "+");
    add.title = "New desktop";
    add.addEventListener("click", () => switchDesktop((S.deskCount || 1) + 1));
    pg.appendChild(add);
  }
}

async function loadDesktops() {
  try {
    const j = await api("/v1/desktop/desktops");
    S.desk = j.current; S.deskCount = j.count;
  } catch { S.desk = 1; S.deskCount = 1; }
}

async function switchDesktop(n) {
  if (n === S.desk) return;
  /* Save the arrangement being left, swap the current pointer, restore the
     one being entered. Nothing the agent can see changes -- that is the
     entire difference from a workspace switch. */
  try { await api("/v1/desktop/state", { method: "PUT", body: captureDesktop() }); } catch {}
  const j = await api("/v1/desktop/desktops", { method: "POST", body: { current: n } });
  S.desk = j.current; S.deskCount = j.count;
  for (const w of Array.from(WINS.values())) closeWindow(w);
  paintTaskbar();
  await restoreDesktop();
}

function tick() {
  const d = new Date();
  $("#clock").textContent =
    d.getHours().toString().padStart(2, "0") + ":" +
    d.getMinutes().toString().padStart(2, "0");
}
setInterval(tick, 15000); tick();

/* ==========================================================================
   Live updates

   The board changes because the AGENT changed it -- a job finished, a page
   landed, an app started -- so the desktop subscribes rather than asking
   every few seconds. EventSource cannot set an Authorization header, which
   is why the gateway also accepts ?token=.

   Polling stays as the fallback, not as the plan: a proxy that buffers SSE,
   or a browser that has run out of connections, should degrade to a slower
   desktop rather than a frozen one.
   ========================================================================== */

const EV = { src: null, handlers: {}, live: false };

function onDesktopEvent(type, fn) {
  (EV.handlers[type] = EV.handlers[type] || []).push(fn);
}

function subscribeEvents() {
  if (!window.EventSource) return;
  const t = token();
  const url = "/v1/desktop/events" + (t ? "?token=" + encodeURIComponent(t) : "");
  let src;
  try { src = new EventSource(url); } catch { return; }
  EV.src = src;

  src.addEventListener("open", () => { EV.live = true; });
  src.addEventListener("error", () => {
    /* EventSource reconnects on its own; all we do is stop claiming to be
       live so the poll keeps covering us in the meantime. */
    EV.live = false;
  });
  src.addEventListener("message", e => {
    let ev;
    try { ev = JSON.parse(e.data); } catch { return; }
    /* A gap means our queue overflowed and events were dropped. The only
       honest response is to re-read rather than to carry on from a state
       that may be wrong. */
    if (ev.type === "gap") { loadProjects().catch(() => {}); return; }
    (EV.handlers[ev.type] || []).forEach(fn => { try { fn(ev); } catch {} });
  });
}

/* The board's own events: anything that changes the project set repaints
   the icons and the tree.

   Coalesced, because these arrive in BURSTS. One agent turn that writes a
   ten-item checklist emits ten task events, and a reload per event meant
   ten full project-list round trips to render one board -- measured at 11
   GET /v1/projects for a single ten-item reconcile, which was half of all
   the traffic that operation caused. The intermediate states were never
   seen either: each reload painted a board that the next event
   immediately invalidated.

   A trailing window, not a leading one: the point is to land on the
   FINAL state, so the last event in a burst is the one that must be
   reflected. Direct callers keep using loadProjects and keep its exact
   semantics -- createAppFromDesktop awaits it precisely because it needs
   S.projects fresh before it opens the chat, and a coalesced refresh
   would hand it a stale list. */
const BOARD_REFRESH_MS = 120;
let boardTimer = null;
function refreshBoardSoon() {
  if (boardTimer) return;
  boardTimer = setTimeout(() => {
    boardTimer = null;
    loadProjects().catch(() => {});
  }, BOARD_REFRESH_MS);
}

onDesktopEvent("projects", refreshBoardSoon);
onDesktopEvent("project",  refreshBoardSoon);
onDesktopEvent("task",     refreshBoardSoon);
onDesktopEvent("job",      refreshBoardSoon);


/* ==========================================================================
   Desktop state -- the arrangement belongs to the workspace

   Saved on the SERVER, per workspace, not in localStorage: switching to the
   "home" workspace should bring back the home desktop from any browser
   pointed at this gateway. Only windows that carry a `restore` descriptor
   come back; a progress dialog or a wizard is tied to work that is over, and
   reopening one would be a lie about state.
   ========================================================================== */

const RESTORERS = {
  /* Kept for layouts saved before the floating chat window went away:
     openChat routes to wherever that project's conversation now lives. */
  chat:    a  => openChat(a),
  app:     a  => openApp(a),
  browser: a  => openBrowser(a || undefined),
  library: () => openLibrary(),
  files:   a  => openFiles(a || undefined),
  console: () => openConsole(),
};

let saveTimer = null;
let restoring = false;

function captureDesktop() {
  const wins = [];
  for (const w of WINS.values()) {
    if (!w.restore || !RESTORERS[w.restore.fn]) continue;
    const g = w.maximized && w.prev ? w.prev : w.node.style;
    wins.push({
      fn: w.restore.fn, arg: w.restore.arg || "",
      x: parseInt(g.left, 10) || 0, y: parseInt(g.top, 10) || 0,
      w: parseInt(g.width, 10) || 0, h: parseInt(g.height, 10) || 0,
      max: !!w.maximized, min: !!w.minimized,
    });
  }
  return {
    v: 1,
    style: S.style || "",
    /* The dock is not a window, but whether you have it open is part of how
       your desktop is arranged. */
    dock: !$("#dock").classList.contains("hidden"),
    windows: wins,
  };
}

/* Debounced: a drag fires this on every mouseup, and a restore fires it once
   per window it opens. Neither deserves a request each. */
function saveDesktop() {
  if (restoring) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    api("/v1/desktop/state", { method: "PUT", body: captureDesktop() })
      .catch(() => { /* a desktop that cannot save its layout still works */ });
  }, 700);
}

async function restoreDesktop() {
  let st = null;
  try { st = await api("/v1/desktop/state"); } catch { return; }
  if (!st) return;
  restoring = true;
  try { if (st.dock === false) hideDock(); else if (st.dock === true) openTree(); } catch {}
  if (!Array.isArray(st.windows) || !st.windows.length) { restoring = false; return; }
  try {
    for (const d of st.windows) {
      const fn = RESTORERS[d.fn];
      if (!fn) continue;
      let w;
      try { w = await fn(d.arg); } catch { continue; }
      if (!w || !w.node) continue;
      if (d.w > 0) {
        Object.assign(w.node.style, {
          left: d.x + "px", top: d.y + "px",
          width: d.w + "px", height: d.h + "px",
        });
      }
      if (d.max) toggleMax(w);
      if (d.min) minimizeWindow(w);
    }
  } finally {
    restoring = false;
  }
  paintTaskbar();
}

/* The console: the operator's own surface -- the full agent chat and every
   configuration page -- which used to be reachable only by NAVIGATING AWAY

   now, like everything else: same origin, so the bearer token in

function openConsole() {

async function loadWorkspaces() {
  const j = await api("/v1/workspaces");
  S.workspaces = j.workspaces || [];

async function switchWorkspace(name) {
  if (name === S.active) return;
  /* A workspace is a WALL, not a view: memory, sessions, skills and files
     all change. Deliberate gesture, named consequence. */
  if (!confirm(`Switch to ${name}?\n\nThis changes what PasClaw remembers: ` +
               `memory, sessions, skills and files are all per-workspace.`)) return;
  for (const w of Array.from(WINS.values())) closeWindow(w);
  await api("/v1/workspaces/activate", { method: "POST", body: { name } });
  S.tree = {}; S.selected = null;
  await loadWorkspaces();
  await loadProjects();
  await loadDesktops();
  /* Each workspace has its own desktops: switching is walking into a
     different room, arranged as you left it. */
  await restoreDesktop();
}

async function pickWorkspace() {
  const names = S.workspaces.map(w => `${w.slot}: ${w.label}${w.active ? " (current)" : ""}`);
  const pick = prompt("Switch workspace -- this changes what PasClaw remembers.\n\n" +
                      names.join("\n") + "\n\nNumber:", "");
  if (pick === null) return;
  const ws = S.workspaces.find(w => String(w.slot) === pick.trim());
  if (ws && !ws.active) switchWorkspace(ws.name);
}

async function newWorkspace() {
  const label = prompt("Name for the new workspace:", "");
  if (label === null) return;
  await api("/v1/workspaces", { method: "POST", body: { label } });
  await loadWorkspaces();
}

document.addEventListener("keydown", e => {
  if (!(e.ctrlKey && e.altKey)) return;
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const n = (S.desk || 1) + (e.key === "ArrowLeft" ? -1 : 1);
  if (n >= 1 && n <= (S.deskCount || 1)) { e.preventDefault(); switchDesktop(n); }
});

/* ==========================================================================
   Projects, icons, tree
   ========================================================================== */

async function loadProjects() {
  const j = await api("/v1/projects");
  S.projects = j.projects || [];
  paintIcons();
  paintChips();
  paintTree();
}

function paintIcons() {
  const host = $("#icons");
  host.textContent = "";
  const perCol = Math.max(1, Math.floor((desktopRect().height - 20) / 86));
  S.projects.forEach((p, i) => {
    const n = el("div", "dicon");
    n.style.left = (8 + Math.floor(i / perCol) * 90) + "px";
    n.style.top  = (8 + (i % perCol) * 86) + "px";
    const g = el("div", "glyph");
    g.innerHTML = icon(p.has_app ? "app" : "folder");
    n.appendChild(g);
    n.appendChild(el("span", "cap", p.title || p.name));
    n.addEventListener("click", () => {
      host.querySelectorAll(".dicon.sel").forEach(x => x.classList.remove("sel"));
      n.classList.add("sel");
    });
    /* Double-click opens the app if there is one, else the project's chat --
       "open" means "show me the thing", and for a project without an app
       yet the thing is the conversation that will build it. */
    n.addEventListener("dblclick", () => {
      if (p.has_app && p.app_ready) openApp(p.name);
      else openChat(p.name);
    });
    host.appendChild(n);
  });
}

/* ==========================================================================
   The desktop ask field + chips

   The background is the first place to type: a question goes to the
   Browser (which opens already answering it), and the chips underneath
   are the suite -- Notes, Calendar, Brain and the rest -- plus the
   Library. The suite always existed, but only `pasclaw project seed`
   installed it, so a desktop-only user had no way to even learn it was
   there; when it isn't installed, the one chip offers to install it.
   ========================================================================== */

function askFromDesktop(kind) {
  const fld = $("#askfld");
  const query = fld.value.trim();
  if (!query) return;
  fld.value = "";
  const existing = WINS.get("browser");
  if (existing && existing.__ask) {
    restoreWindow(existing); focusWindow(existing);
    existing.__ask(query, kind);
  }
  else openBrowser(undefined, query, kind);
}

/* Create App: the same memo, but the deliverable is software. Starts a
   project named after the request, opens its chat, and sends the memo as
   the first turn -- from there it is the ordinary lovable loop: chat on
   the left, the app running on the right. The project title is only a
   label derived from the first words; the full text goes to the chat. */
/* Turn a memo into a project name.

   This is not cosmetic: the title becomes the project's slug, its
   directory on disk, and the label under its icon forever after. The
   first cut of this took six words and sliced at 48 characters, which
   produced "a countdown timer app with a" -- a name ending on a dangling
   preposition and article, from a request that was perfectly clear.

   Three passes, in order:

     1. Drop the framing. "make me a", "build an", "I want a" -- these
        address the assistant, not the thing being built, and every
        project starting with "Make Me A" is six wasted characters in a
        column that is already narrow.
     2. Take the first clause. A memo often opens with the app and then
        keeps going; the sentence break is a better boundary than a word
        count.
     3. Trim what got left dangling. Trailing function words go, and a
        preposition or conjunction whose object was cut off takes the
        rest of its phrase with it -- "countdown timer app with a big"
        becomes "countdown timer app". Guarded to leave at least two
        words, so an aggressive rule cannot reduce a request to "App". */
const TITLE_TAIL = new Set([
  "a", "an", "the", "my", "our", "your", "its", "their", "this", "that",
  "these", "those", "and", "or", "but", "with", "for", "to", "of", "in",
  "on", "at", "from", "by", "into", "using", "is", "are", "be", "as",
  "some", "any",
]);
const TITLE_CUT = new Set([
  "with", "for", "to", "of", "in", "on", "at", "from", "by", "into",
  "using", "and", "or", "but", "so", "plus",
]);

function deriveProjectTitle(text) {
  let s = String(text || "").trim();
  s = s.replace(
    /^(?:please\s+)?(?:can\s+you\s+)?(?:make|build|create|write|design|generate|give)\s+(?:me\s+)?/i, "");
  s = s.replace(/^i\s+(?:want|need|would\s+like)\s+/i, "");
  /* The leading article goes too -- "A Stopwatch" is a worse folder name
     than "Stopwatch", and every request starts with one. \b matters:
     without it the alternation matches the "a" inside "an" and leaves a
     stray "n expense tracker". */
  s = s.replace(/^(?:a|an|the)\b\s*/i, "");
  /* First clause only -- sentence end, or a line break in a longer memo. */
  s = s.split(/[.!?\n]/)[0].trim();

  let words = s.split(/\s+/).filter(Boolean);
  let cut = words.length > 6;
  words = words.slice(0, 6);
  /* Character budget, on a word boundary rather than mid-word. */
  while (words.length > 2 && words.join(" ").length > 48) {
    words.pop();
    cut = true;
  }
  while (words.length > 2 &&
         TITLE_TAIL.has(words[words.length - 1].toLowerCase().replace(/\W/g, ""))) {
    words.pop();
    cut = true;
  }
  if (cut) {
    for (let i = words.length - 1; i >= 2; i--) {
      if (TITLE_CUT.has(words[i].toLowerCase().replace(/\W/g, ""))) {
        words = words.slice(0, i);
        break;
      }
    }
  }
  let title = words.join(" ").replace(/[,;:]+$/, "").trim();
  if (!title) title = String(text || "").trim().slice(0, 48).trim();
  if (!title) return "";
  return title.charAt(0).toUpperCase() + title.slice(1);
}

async function createAppFromDesktop(plan) {
  const fld = $("#askfld");
  const text = fld.value.trim();
  if (!text) return;
  const title = deriveProjectTitle(text);
  fld.value = "";
  try {
    /* The server's create is idempotent: a title that sanitizes to an
       existing slug hands back the OLD project, and two different
       requests sharing their first words would silently share -- and
       overwrite -- one app. So ask for the list first and retry with a
       numbered title until the slug that comes back is genuinely new. */
    const taken = new Set(
      ((await api("/v1/projects")).projects || []).map(p => p.name));
    let j = null;
    for (let n = 1; n <= 20; n++) {
      const t = n === 1 ? title : title + " " + n;
      j = await api("/v1/projects", { method: "POST", body: { title: t } });
      if (!taken.has(j.name)) break;
      j = null;
    }
    if (!j) throw new Error(
      "could not find a free project name for \"" + title + "\"");
    await loadProjects();
    openChat(j.name);
    projectChat(j.name).submitText(
      plan ? text + "\n\nPlan this first. Do not build anything yet: set " +
             "out what the app is, what it is made of, and what you will " +
             "do in what order, so I can approve it or change it."
           : text,
      plan ? "plan" : "build");
  } catch (e) { alert(e.message); }
}

function paintChips() {
  const host = $("#chips");
  if (!host) return;
  host.textContent = "";

  function chip(label, iconName, fn, title) {
    const c = el("span", "chip");
    const g = el("span"); g.innerHTML = icon(iconName);
    c.appendChild(g);
    c.appendChild(el("span", null, label));
    if (title) c.title = title;
    c.addEventListener("click", fn);
    host.appendChild(c);
    return c;
  }

  const suite = S.projects.filter(p => p.suite && p.has_app);
  suite.forEach(p =>
    chip(p.title || p.name, "app", () => openApp(p.name)));
  if (!suite.length)
    chip("Install Notes, Calendar & the suite...", "disk", async ev => {
      try {
        const j = await api("/v1/suite", { method: "POST" });
        await loadProjects();
        showMessage({ title: "Suite installed", kind: "info",
          text: `${j.created} app(s) added. They are ordinary projects -- ` +
                `open one and ask PasClaw to change it.` });
      } catch (e) { alert(e.message); }
    }, "Notes, Calendar, Mail and the rest -- one click, once");
  chip("Library", "brain", openLibrary,
       "Pages and sessions this workspace has accumulated");
}

/* What the four intents do, and where the answer lands. Two of them open
   the Browser and two of them create a project, which is worth saying out
   loud under the field -- the difference between "where did my text go"
   and not. */
const ASK_KINDS = {
  ask:      { where: "Answers as a page in the Browser." },
  research: { where: "Digs until saturated, then a sourced report in the Browser." },
  plan:     { where: "New project. Plans first -- nothing is built until you approve." },
  build:    { where: "New project. Starts building straight away." },
};

function askKind() {
  const s = $("#askkind");
  return (s && s.value) || "ask";
}

function paintAskWhere() {
  const k = ASK_KINDS[askKind()];
  $("#askwhere").textContent = k ? k.where : "";
}

function goFromDesktop() {
  switch (askKind()) {
    case "research": return askFromDesktop("research");
    case "plan":     return createAppFromDesktop(true);
    case "build":    return createAppFromDesktop(false);
    default:         return askFromDesktop("search");
  }
}

function initAsk() {
  $("#askgo").addEventListener("click", goFromDesktop);
  $("#askkind").addEventListener("change", paintAskWhere);
  paintAskWhere();
  /* A memo, so Enter has to be shared: plain Enter runs the selected
     intent, Shift+Enter makes a line break for the longer descriptions
     the app intents want. */
  $("#askfld").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      goFromDesktop();
    }
  });
}

/* The dock is always there; "Projects" on the menu just un-hides it. */
function openTree() {
  $("#dock").classList.remove("hidden");
  $("#stage").classList.remove("wide");
  paintTree();
}
function hideDock() {
  $("#dock").classList.add("hidden");
  $("#stage").classList.add("wide");
}

function initDock() {
  $("#dockhide").addEventListener("click", hideDock);
  $("#newproj").addEventListener("click", newProject);
  $("#refresh").addEventListener("click", async () => {
    S.tree = {};
    await loadProjects();
  });
  /* Drag the dock's right edge to resize it. The stage's left offset follows,
     so windows never end up underneath. */
  $("#dockgrip").addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    const sx = e.clientX, w0 = $("#dock").offsetWidth;
    document.body.classList.add("dragging");
    const move = ev => {
      const nw = Math.max(150, Math.min(460, w0 + ev.clientX - sx));
      $("#dock").style.width = nw + "px";
      $("#stage").style.left = nw + "px";
    };
    const up = () => {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      document.body.classList.remove("dragging");
      paintIcons();
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
    e.preventDefault();
  });
}

/* The dock in PROJECT mode: opening a project turns the left bar into that
   project, chat foremost -- because "modify the app to do X" IS the way
   work happens here, and it was two clicks and a floating window away.
   A header row leads back to the board; the app and a new task are one
   button each. */
function paintProjectPane(name) {
  const host = document.getElementById("treebody");
  if (!host) return;
  /* Detach, never clear: textContent = "" would destroy the cached chat
     pane's DOM (the transcript) while the closure kept streaming into it. */
  while (host.firstChild) host.removeChild(host.firstChild);
  host.style.display = "flex";
  host.style.flexDirection = "column";
  const p = S.projects.find(x => x.name === name);

  const head = el("div");
  head.style.cssText = "flex:0 0 auto;display:flex;gap:4px;align-items:center;padding:2px";
  const back = el("button", "btn", "◂ Projects");
  back.title = "Back to the project board";
  back.addEventListener("click", () => { S.dockProject = null; paintTree(); });
  head.appendChild(back);
  const title = el("span", null, p ? (p.title || p.name) : name);
  title.style.cssText = "font-weight:bold;flex:1 1 auto;overflow:hidden;" +
                        "text-overflow:ellipsis;white-space:nowrap";
  head.appendChild(title);
  host.appendChild(head);

  const acts = el("div");
  acts.style.cssText = "flex:0 0 auto;display:flex;gap:4px;padding:0 2px 4px";
  const open = el("button", "btn", "▶ Open App");
  if (p && p.has_app) open.addEventListener("click", () => openApp(name));
  else { open.disabled = true; open.title = "No app yet -- ask for one below."; }
  acts.appendChild(open);
  const addTask = el("button", "btn", "+ Task");
  addTask.title = "Add a task to this project's board";
  addTask.addEventListener("click", async () => {
    await newTask(name);
    paintTree();
  });
  acts.appendChild(addTask);
  host.appendChild(acts);

  /* The open tasks, compactly -- the board's summary, not its replacement.
     The full tree (jobs included) is one click back. */
  const st = S.tree[name] || (S.tree[name] = { open: true, tasks: null });
  if (!st.tasks) loadTasks(name).then(() => {
    if (S.dockProject === name) paintTree();
  });
  const open_ = (st.tasks || []).filter(t => t.status !== "done");
  if (open_.length) {
    const tl = el("div");
    tl.style.cssText = "flex:0 0 auto;max-height:30%;overflow:auto;" +
                       "padding:0 2px 4px";
    open_.forEach(t => {
      const tr = el("div", "node");
      tr.appendChild(el("span", "st-" + t.status, t.id + "  " + t.title));
      tr.title = t.notes || "";
      tl.appendChild(tr);
    });
    host.appendChild(tl);
  }

  /* The chat, filling the rest -- unless the app window has it.

     One conversation, one place: when the app is open its window is the
     home (the point of the left bar is having the app beside the words
     that change it), and the dock says where it went rather than showing
     a second, emptier copy of the same thing. */
  const pane = el("div");
  pane.style.cssText = "flex:1 1 auto;min-height:0;padding:2px";
  host.appendChild(pane);
  const aw = WINS.get("app:" + name);
  if (aw && aw.__chatShown && aw.__chatShown()) {
    const note = el("div", "muted");
    note.style.cssText = "padding:6px;font-size:11px";
    note.appendChild(el("div", null, "The conversation is in the app window."));
    const go = el("button", "btn", "Show it");
    go.style.marginTop = "6px";
    go.addEventListener("click", () => { restoreWindow(aw); focusWindow(aw); });
    note.appendChild(go);
    pane.appendChild(note);
    return;
  }
  showChatIn(name, pane).focus();
}

function paintTree() {
  const host = document.getElementById("treebody");
  if (!host) return;
  if (S.dockProject) return paintProjectPane(S.dockProject);
  host.style.display = "";
  host.style.flexDirection = "";
  while (host.firstChild) host.removeChild(host.firstChild);
  const tree = el("div", "tree");

  if (!S.projects.length) {
    tree.appendChild(el("div", "node muted", "No projects yet."));
    tree.appendChild(el("div", "node muted", "Ask PasClaw to build one."));
    host.appendChild(tree);
    return;
  }

  S.projects.forEach(p => {
    const st = S.tree[p.name] || (S.tree[p.name] = { open: false, tasks: null });

    const row = el("div", "node" + (S.selected === p.name ? " sel" : ""));
    const tw = el("span", "twist", st.open ? "▼" : "▶");
    row.appendChild(tw);
    const g = el("span"); g.style.cssText = "width:14px;height:14px;flex:0 0 14px";
    g.innerHTML = icon(p.has_app ? "app" : "folder");
    row.appendChild(g);
    row.appendChild(el("span", null, p.title || p.name));
    if (p.open_tasks) row.appendChild(el("span", "badge", String(p.open_tasks)));
    /* The twist expands in place (tasks, jobs -- the board view); the row
       itself OPENS the project, turning the dock into its chat + actions.
       That split is the whole gesture: a task is "modify the app to do X",
       so opening a project should land you where you can say so. */
    tw.addEventListener("click", async e => {
      e.stopPropagation();
      S.selected = p.name;
      st.open = !st.open;
      if (st.open && !st.tasks) await loadTasks(p.name);
      paintTree();
    });
    row.addEventListener("click", async () => {
      S.selected = p.name;
      S.dockProject = p.name;
      if (!st.tasks) await loadTasks(p.name);
      paintTree();
    });
    tree.appendChild(row);

    if (!st.open) return;
    (st.tasks || []).forEach(t => {
      const tr = el("div", "node");
      tr.style.paddingLeft = "18px";
      const tt = el("span", "twist", t.jobs ? (t.__open ? "▼" : "▶") : "");
      tr.appendChild(tt);
      const lbl = el("span", "st-" + t.status, t.id + "  " + t.title);
      tr.appendChild(lbl);
      tr.title = t.notes || "";
      tr.addEventListener("click", async () => {
        if (!t.jobs) return;
        t.__open = !t.__open;
        if (t.__open && !t.__jobs) {
          const j = await api(`/v1/projects/${p.name}/tasks/${t.id}/jobs`);
          t.__jobs = j.jobs || [];
        }
        paintTree();
      });
      tree.appendChild(tr);

      if (!t.__open) return;
      (t.__jobs || []).forEach(job => {
        const jr = el("div", "node");
        jr.style.paddingLeft = "36px";
        jr.appendChild(el("span", "twist", ""));
        jr.appendChild(el("span", "st-" + (job.status === "failed" ? "blocked" :
          job.status === "running" ? "active" : "done"),
          job.id + "  " + job.status + (job.summary ? " -- " + job.summary : "")));
        jr.addEventListener("dblclick", () => openJobLog(p.name, t.id, job.id));
        tree.appendChild(jr);
      });
    });

    const add = el("div", "node muted");
    add.style.paddingLeft = "18px";
    add.appendChild(el("span", "twist", "+"));
    add.appendChild(el("span", null, "New task..."));
    add.addEventListener("click", () => newTask(p.name));
    tree.appendChild(add);
  });

  host.appendChild(tree);
}

async function loadTasks(project) {
  const j = await api(`/v1/projects/${project}/tasks`);
  (S.tree[project] || (S.tree[project] = {})).tasks = j.tasks || [];
}

async function newProject() {
  const title = prompt("What should this project be called?", "");
  if (!title) return;
  try {
    const j = await api("/v1/projects", { method: "POST", body: { title } });
    await loadProjects();
    /* Land in the project pane, cursor in the chat: the next thing anyone
       does with a new project is describe the app they want. }*/
    S.selected = j.name;
    S.dockProject = j.name;
    paintTree();
  } catch (e) { alert(e.message); }
}

async function newTask(project) {
  const title = prompt("Task title:", "");
  if (!title) return;
  await api(`/v1/projects/${project}/tasks`, { method: "POST", body: { title } });
  await loadTasks(project);
  await loadProjects();
}

/* The agent keeps a working checklist through its todo_write tool, and the
   desktop watches those calls stream by in the chat -- so the checklist
   shows up on the project's task board instead of living only inside the
   model's head. Reconciled by title, never deleted: todo_write REPLACES
   the model's list each call, but a task that fell off the model's radar
   is still work someone asked for. Unchecked items are created as todo,
   checked ones are marked done.

   Serialized per project: one turn can rewrite the checklist several
   times, and two overlapping reconciles would both see "missing" and both
   create -- the very duplicates matching by title exists to prevent. */
const CHECKLIST_SYNC = new Map();

function mirrorChecklist(project, argsStr) {
  const items = [];
  try {
    (JSON.parse(argsStr).checklist || "").split("\n").forEach(ln => {
      const m = ln.match(/^\s*[-*]\s*\[([ xX])\]\s*(.+?)\s*$/);
      if (m) items.push({ done: m[1] !== " ", title: m[2] });
    });
  } catch { return; }
  if (!items.length) return;
  const prev = CHECKLIST_SYNC.get(project) || Promise.resolve();
  const next = prev.then(async () => {
    try {
      const j = await api(`/v1/projects/${project}/tasks`);
      const have = new Map();
      (j.tasks || []).forEach(t => { if (!have.has(t.title)) have.set(t.title, t); });
      /* Reconcile the items CONCURRENTLY.

         Each item touches a different task, so the writes do not depend
         on each other -- but awaiting them one at a time made a ten-item
         checklist ten sequential round trips, which is what stretched
         the resulting event burst well past any coalescing window and
         cost a full project reload every couple of items.

         Duplicate titles within ONE checklist are folded out first. The
         sequential version deduped them by accident -- the first create
         landed in `have`, so the second pass found it and skipped -- and
         concurrent creates would lose that and file the task twice. The
         server has no title uniqueness to fall back on. */
      const seen = new Set();
      const wanted = items.filter(
        it => !seen.has(it.title) && seen.add(it.title));

      /* allSettled, not all: Promise.all rejects the moment ONE write
         fails, which would release this project's queue while the other
         writes were still in flight -- and the next reconcile would then
         read a board that is still being written, re-create what it
         could not see, or let a stale status land on top of a newer one.
         Every launched request has to settle before the queue moves on;
         individual failures are reported by the catch below, which is
         where they were always handled. */
      const settled = await Promise.allSettled(wanted.map(async it => {
        const t = have.get(it.title);
        if (!t) {
          const made = await api(`/v1/projects/${project}/tasks`,
            { method: "POST", body: { title: it.title } });
          have.set(it.title, { id: made.id, status: "todo" });
          if (it.done)
            await api(`/v1/projects/${project}/tasks/${made.id}`,
              { method: "PATCH", body: { status: "done" } });
        } else if (it.done && t.status !== "done") {
          await api(`/v1/projects/${project}/tasks/${t.id}`,
            { method: "PATCH", body: { status: "done" } });
          t.status = "done";
        } else if (!it.done && t.status === "done") {
          /* The model walked it back: a later checklist unchecked the
             item because more work turned up. A board still claiming
             done would be lying, which is worse than reopening. */
          await api(`/v1/projects/${project}/tasks/${t.id}`,
            { method: "PATCH", body: { status: "todo" } });
          t.status = "todo";
        }
      }));
      /* allSettled means the catch below no longer sees these, so say so
         here instead of losing them. Still best effort -- a board that
         missed one item is not a reason to stop the conversation. */
      const failed = settled.filter(r => r.status === "rejected");
      if (failed.length)
        console.warn(`checklist mirror: ${failed.length} of ${wanted.length} ` +
                     `write(s) failed`, failed[0].reason);
      await loadProjects();
      if (S.tree[project]) { await loadTasks(project); paintTree(); }
    } catch {} /* best effort: the chat must not stall on the board */
  });
  CHECKLIST_SYNC.set(project, next);
}

/* ==========================================================================
   Chat -- per project, with artifact cards
   ========================================================================== */

/* ONE conversation per project, for the life of the page.

   Not one per window: a project used to be able to have its chat open in
   a floating window, the dock pane and the app window at once, three
   buildChatUI closures with three private history arrays, and whichever
   one you typed into was the only one that knew what you had said. This
   map is the single instance; showChatIn re-parents its root DOM node to
   whichever surface is currently its home, and appendChild detaches it
   from the previous one, so two live copies cannot exist. */
const PROJECT_CHATS = new Map();

function projectChat(project) {
  let c = PROJECT_CHATS.get(project);
  if (!c) { c = buildChatUI(project); PROJECT_CHATS.set(project, c); }
  return c;
}

function showChatIn(project, hostEl) {
  const c = projectChat(project);
  if (c.root.parentNode !== hostEl) hostEl.appendChild(c.root);
  return c;
}

/* Where a project's conversation belongs, and how to get there.

   An app's chat surface IS the left bar of its app window -- ask for the
   chat and you get the app with the conversation beside it, because what
   you are about to say is nearly always about what you are looking at. A
   project with no app yet has no such window, so its conversation lives
   in the dock's project pane until the first app exists. */
function openChat(project) {
  const p = S.projects.find(x => x.name === project);
  if (p && p.has_app && p.app_ready) return openApp(project, { chat: true });
  S.selected = project;
  S.dockProject = project;
  $("#dock").classList.remove("hidden");
  $("#stage").classList.remove("wide");
  paintTree();
  return null;
}

/* The chat itself. Built once per project (see projectChat) and moved
   between surfaces rather than rebuilt, so the transcript, the streaming
   state and the history array follow the conversation wherever it is
   shown -- and closing the window that happened to be hosting it does
   not end it. */
function buildChatUI(project) {
  const wrap = el("div", "chat");
  const log = el("div", "log in");
  const composer = el("div", "composer");
  const ta = el("textarea", "fld");
  ta.placeholder = "Describe the app you want. PasClaw builds it here.";
  const send = el("button", "btn", "Send");
  composer.appendChild(ta); composer.appendChild(send);
  wrap.appendChild(log); wrap.appendChild(composer);

  const history = [];

  function addMsg(who, text, cls) {
    const m = el("div", "msg " + (cls || ""));
    m.appendChild(el("div", "who", who));
    const b = el("div", "body", text);
    m.appendChild(b);
    log.appendChild(m);
    log.scrollTop = log.scrollHeight;
    return b;
  }

  /* ---- the conversation outlives the page ---- */

  /* One session file per project, so a reload -- or a different browser
     against the same gateway -- reopens the conversation rather than
     starting a stranger's. The id is derived, not stored: a project slug
     is already a safe session id, and deriving it means there is no
     mapping to keep in step. */
  const sessionId = "desktop-" + project;

  async function saveHistory() {
    /* Best effort. A conversation that cannot be filed is still a
       conversation; losing the turn on screen because the save failed
       would be the worse trade. */
    try {
      await api("/v1/sessions/" + sessionId, {
        method: "PUT",
        body: { title: "Desktop: " + project, messages: history },
      });
    } catch {}
  }

  /* Replay what was filed. Only user and assistant turns: the artifact
     cards and tool lines belong to the turn that produced them and would
     be a lie if re-rendered against a later app. */
  async function loadHistory() {
    let j;
    try { j = await api("/v1/sessions/" + sessionId); }
    catch { return; }              /* no session yet -- a fresh project */
    const msgs = (j && j.messages) || [];
    if (!msgs.length) return;
    msgs.forEach(m => {
      if (m.role !== "user" && m.role !== "assistant") return;
      history.push({ role: m.role, content: m.content || "" });
      addMsg(m.role === "user" ? "you" : "pasclaw", m.content || "",
             m.role === "user" ? "u" : "");
    });
    addMsg("desktop", "— earlier conversation, reopened —", "");
  }

  /* Every card in this conversation, oldest first. A card is only "old"
     once a later turn made another one, which is why this list exists
     rather than a flag on each card. */
  const cards = [];

  /* An artifact card: the turn produced or updated something runnable.
     Pinned to the message that made it, so scrolling back through a
     conversation is scrolling back through versions -- and an old card
     opens the version THAT turn produced, not whatever the app is now.

     The body is captured when the card is made, because there is nowhere
     else to get it from later: the app directory holds one file and each
     turn overwrites it. */
  function addArtifact(kind, name, opener, body) {
    const card = el("div", "artifact");
    const g = el("div", "ico");
    g.innerHTML = icon(kind === "page" ? "page" : "app");
    card.appendChild(g);
    const meta = el("div", "meta");
    meta.appendChild(el("div", "nm", name));
    const kd = el("div", "kd", kind === "page" ? "page -- document" : "app -- " + kind);
    meta.appendChild(kd);
    card.appendChild(meta);
    const run = el("button", "btn", "\u25b6 Run");
    const rec = { card, kd, run, body: body || "", opener };
    /* Everything before this one is now a previous version. */
    cards.forEach(c => markOld(c));
    cards.push(rec);
    run.addEventListener("click", () => {
      if (rec.old) openVersion(rec); else rec.opener();
    });
    card.appendChild(run);
    log.appendChild(card);
    log.scrollTop = log.scrollHeight;
  }

  function markOld(rec) {
    if (rec.old) return;
    rec.old = true;
    rec.kd.textContent += "  \u2014 earlier version";
    /* A card with nothing captured cannot show a version, so it stops
       claiming it can rather than opening the current app and pretending
       that is what this turn made. */
    if (!rec.body) { rec.run.disabled = true; rec.run.title = "not captured"; }
    else rec.run.textContent = "\u25b6 View";
  }

  /* Open a captured version, read-only, in its own window. Nothing on disk
     is touched until Restore is pressed -- looking at an old draft should
     not be a decision. */
  function openVersion(rec) {
    const w = createWindow({
      title: "Earlier version", width: 620, height: 460, icon: "page", pad: false,
    });
    const bar = el("div");
    bar.style.cssText = "display:flex;gap:4px;padding:3px;align-items:center";
    bar.appendChild(el("div", "muted", "This is what that turn produced."));
    const spacer = el("div"); spacer.style.flex = "1 1 auto"; bar.appendChild(spacer);
    const restore = el("button", "btn", "Restore this version");
    bar.appendChild(restore);
    w.body.appendChild(bar);

    /* srcdoc + the same sandbox the live app gets: an old version is model
       output too, and being old does not make it trusted. */
    const frame = el("iframe", "app");
    frame.setAttribute("sandbox", "allow-scripts allow-forms");
    frame.style.height = "calc(100% - 30px)";
    frame.srcdoc = rec.body;
    w.body.appendChild(frame);

    restore.addEventListener("click", async () => {
      if (!confirm("Put this version back as the current app?\n\n" +
                   "The version on disk now will be replaced.")) return;
      restore.disabled = true;
      try {
        await api(`/v1/apps/${project}/entry`, { method: "PUT", body: rec.body });
        closeWindow(w);
        rec.opener();
      } catch (e) {
        addMsg("desktop", "Could not restore: " + e.message);
        restore.disabled = false;
      }
    });
    return w;
  }

  /* True between a plan turn landing and its approval.

     The approve card invites "ask for changes", and a change typed into
     the composer goes through plain submit() -- which would have sent it
     as a BUILD turn, re-arming every mutating tool before anyone pressed
     Approve, while the stale approval card sat there offering to do what
     had already happened. A conversation with a plan awaiting approval
     stays in plan mode until the approval handler says otherwise. */
  let planPending = false;

  async function submit(mode) {
    await ready;
    /* Explicit mode wins (the approve handler passes "build"); otherwise
       a pending plan keeps the conversation read-only. */
    if (!mode && planPending) mode = "plan";
    const text = ta.value.trim();
    if (!text) return;
    ta.value = "";
    addMsg("you", text, "u");
    history.push({ role: "user", content: text });

    const body = addMsg("pasclaw", "");
    send.disabled = true;
    let acc = "", touchedApp = false;

    try {
      const t = token();
      const r = await fetch("/v1/chat/completions", {
        method: "POST",
        headers: Object.assign(
          { "content-type": "application/json", "accept": "text/event-stream" },
          t ? { authorization: "Bearer " + t } : {}),
        body: JSON.stringify({
          stream: true,
          messages: history,
          /* The builder prompt goes in the top-level "system" field,
             which the gateway now composes as the LAST section of its
             own prompt.

             Not as a system message in messages[]: that is the shape
             reserved for a third party's persona, and the gateway
             honours it by skipping BuildSystemPrompt entirely -- so
             sending it that way would have cost this conversation the
             workspace context, memory, AGENTS rules, skill catalog and
             tool-use rules it needs to build anything. "Deliverables
             are apps, written here" is a house rule for PasClaw, not a
             different assistant. */
          system: builderPrompt(project),
          /* Plan mode is enforced server-side -- its dispatch gate
             refuses mutating tools -- so "plan before building" is not
             an instruction the model can decide to skip. */
          mode: mode === "plan" ? "plan" : "build",
        }),
      });
      if (!r.ok) { body.textContent = `(http ${r.status})`; send.disabled = false; return; }

      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
          if (line.startsWith(":")) {
            /* The gateway's tool side-channel. A write into this project's
               app/ directory is what tells us an artifact appeared -- we
               don't have to ask the model to announce it. */
            const c = line.slice(1).trim();
            if (c.startsWith("pasclaw-tool ")) {
              try {
                const tj = JSON.parse(c.slice("pasclaw-tool ".length));
                const argstr = JSON.stringify(tj.args || tj.arguments || {});
                if (/projects\/[^"]*\/app\//.test(argstr)) touchedApp = true;
                /* The model's own checklist IS this project's task list.
                   Mirror it as the calls stream by, not at turn end, so
                   the board fills in while the agent is still working. */
                if (tj.t === "call" && tj.name === "todo_write")
                  mirrorChecklist(project, tj.args);
              } catch {}
            }
            continue;
          }
          if (!line.startsWith("data:")) continue;
          const data = line.slice(5).trim();
          if (data === "[DONE]") break;
          try {
            const j = JSON.parse(data);
            const d = (j.choices && j.choices[0] && j.choices[0].delta &&
                       j.choices[0].delta.content) || "";
            if (d) { acc += d; body.textContent = acc; log.scrollTop = log.scrollHeight; }
          } catch {}
        }
      }
    } catch (e) {
      body.textContent = acc + "\n(" + e.message + ")";
    }
    send.disabled = false;
    history.push({ role: "assistant", content: acc });

    /* Period-native output: if the turn emitted a UI block, show the
       furniture and strip it from the visible text. Unrecognised or
       malformed blocks stay as text -- an answer must never vanish.

       submitText goes WITH the block: a project can have this
       conversation open in three places at once (dock pane, app-window
       pane, floating window), each with its own history closure, and a
       dialog's answer belongs to the one that asked. Looking the chat
       up by project afterwards would answer whichever home a fixed
       order happened to find first -- the asking conversation would
       never hear back, and another would be handed a reply to a
       question it never asked. */
    const ui = extractUIBlocks(acc);
    if (ui.blocks.length) {
      body.textContent = ui.text;
      ui.blocks.forEach(b => renderUIBlock(b, project, submitText));
    }

    /* A plan turn ends with a decision, so the decision gets a button
       rather than an instruction to type "yes". Approving sends the
       build turn with the plan already in history -- the model is not
       told the plan again, it is told to carry out the one above. */
    if (mode === "plan") { planPending = true; addApproveBar(); }

    /* Did this turn leave a runnable app behind? Ask the gateway rather
       than trusting the transcript. */
    try {
      const app = await api("/v1/apps/" + project);
      if (app && app.exists && app.ready) {
        /* Capture the body this turn produced. Best effort: a card without
           it still runs the live app, it just cannot show history. */
        let body = "";
        try {
          const r = await fetch(`/apps/${project}/${app.entry}`);
          if (r.ok) body = await r.text();
        } catch {}
        addArtifact(app.kind, app.name || project, () => openApp(project), body);
        /* The lovable loop: chat on the left, the app RUNNING on the right,
           updated after each turn. A turn that touched the app reloads the
           open app window in place; when there is no window yet -- the
           first build, chatting from the dock -- it opens one WITH the
           chat, which is the moment the conversation moves into its
           permanent home. A turn that touched nothing moves nothing. */
        if (touchedApp && app.servable) {
          const aw = WINS.get("app:" + project);
          if (aw && aw.__reloadApp) aw.__reloadApp();
          else openApp(project, { chat: true });
        }
      } else if (touchedApp) {
        addMsg("desktop", "The app was written but has no runnable entry yet.");
      }
    } catch {}
    /* File the turn. After the artifact check, so a reload reopens the
       conversation exactly as it settled. */
    saveHistory();
    await loadProjects();
    if (S.tree[project]) { await loadTasks(project); paintTree(); }
  }

  /* Named so the turn handler above can hand it to renderUIBlock: an
     answered dialog continues THIS conversation, not one that merely
     shares the project. */
  const submitText = (text, mode) => { ta.value = text; submit(mode); };

  /* The approve gate for a planned app. Only one can be live at a time:
     a second plan turn retires the first bar, because approving a plan
     two turns stale would build something the conversation has already
     moved past. */
  let approveBar = null;
  function addApproveBar() {
    if (approveBar) approveBar.remove();
    const bar = el("div", "artifact");
    approveBar = bar;
    const g = el("div", "ico"); g.innerHTML = icon("page");
    bar.appendChild(g);
    const meta = el("div", "meta");
    meta.appendChild(el("div", "nm", "Plan -- nothing built yet"));
    meta.appendChild(el("div", "kd",
      "Ask for changes, or approve to start building"));
    bar.appendChild(meta);
    const go = el("button", "btn", "Approve & build");
    go.addEventListener("click", () => {
      if (approveBar === bar) approveBar = null;
      bar.remove();
      /* The one place plan mode is left, and it takes a click to do it. */
      planPending = false;
      submitText("Approved -- build it. Follow the plan above; if you hit " +
                 "something it did not anticipate, say so rather than " +
                 "quietly doing something else.", "build");
    });
    bar.appendChild(go);
    log.appendChild(bar);
    log.scrollTop = log.scrollHeight;
  }

  /* Bare calls: the click event would otherwise arrive as submit's mode
     argument, and an Event is not "plan". */
  send.addEventListener("click", () => submit());
  ta.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
  });
  /* The load has to WIN, not merely start.

     Kicking it off unawaited raced the first Send: submit pushed the new
     user turn, sent it with no prior context, and loadHistory then
     appended the older turns AFTER it in the same array -- so the model
     answered without the conversation, and the next saveHistory filed
     the reply ahead of everything it was replying to, corrupting the
     session's order permanently. The composer is disabled until the
     replay lands, and submit awaits it as well: the disable is what the
     user sees, the await is what makes it true for a programmatic
     submitText that never touches the field. */
  ta.disabled = true;
  send.disabled = true;
  const ready = loadHistory()
    .catch(() => {})
    .then(() => { ta.disabled = false; send.disabled = false; });

  return {
    root: wrap,
    submitText,
    focus: () => ta.focus(),
  };
}

/* The builder-mode overlay. Kept client-side for now so it is visible and
   editable next to the UI that depends on it; the plan moves it into a
   shipped skill (skills/app-factory) so it becomes promptware. */
/* Per-style personality. The plan's idea: a desktop that looks like System 6
   should not answer like a 2020s chatbot. This costs nothing -- it is a
   sentence appended to the system prompt -- and it is what makes the style
   picker feel like it changes the machine rather than the paint. */
const STYLE_VOICE = {
  AppleSystem: "Answer the way a 1984 Macintosh would: few words, plain " +
    "nouns, no exclamation. The machine is polite and very small.",
  MacOS9:      "Answer warmly and briefly, like Mac OS 9 Help.",
  Win31:       "Answer like a Windows 3.1 manual: numbered, literal, dry.",
  Win95:       "Answer like a Windows 95 wizard: short steps, plain language.",
  Win98:       "Answer like a Windows 98 wizard: short steps, plain language.",
  NeXTSTEP:    "Answer precisely and technically, like NeXTSTEP documentation.",
  BeOS:        "Answer briskly and a little playfully, like BeOS release notes.",
  Amiga13:     "Answer tersely, like an Amiga Workbench requester.",
  Amiga20:     "Answer tersely, like an Amiga Workbench requester.",
  GEM:         "Answer in very few words, like a GEM desk accessory.",
  Synthwave:   "Answer with a little neon swagger -- brief, confident, " +
    "never purple. You are a 1984 that never happened.",
  Phosphor:    "Answer like an amber terminal: terse, monospaced in spirit, " +
    "no decoration.",
  ClaudeCode:     "Answer plainly and concisely, like a good CLI.",
  ClaudeCodeDark: "Answer plainly and concisely, like a good CLI.",
};

function builderPrompt(project) {
  const voice = STYLE_VOICE[S.style];
  return [
    `You are working inside the PasClaw Desktop project "${project}".`,
    `Deliverables are APPS, not essays. When the user asks for something,`,
    `build it as software they can open in a window.`,
    ``,
    `Write the app into projects/${project}/app/ inside the workspace, and`,
    `maintain projects/${project}/app/app.json:`,
    `  {"name":"...","kind":"page|html|python","entry":"index.html",`,
    `   "window":{"width":640,"height":480}}`,
    `Choose the lightest kind that works: "page" (a static document, no`,
    `scripts) then "html" (a self-contained page WITH scripts) then "python".`,
    `An html app persists data through the desktop's SDK. Include it and use`,
    `the two calls -- do NOT fetch the API directly, the app is sandboxed and`,
    `the call will be blocked:`,
    /* The closing tag is split: a literal </' + 'script> inside this file's
       own <script> element would end it and break the page. */
    "  <script src=\"pasclaw.js\"><\/script>",
    `  await pasclaw.setJSON("books", list);`,
    `  const list = await pasclaw.getJSON("books", []);`,
    `The app may not reach any other origin -- and that includes its LOOKS.`,
    `The serving CSP blocks every off-origin URL: CDN scripts, stylesheets,`,
    `fonts and images all silently fail to load. An app styled from`,
    `cdn.tailwindcss.com or Google Fonts renders as bare unstyled HTML.`,
    `So the page must be SELF-CONTAINED: write your own CSS in a <style>`,
    `block, use system font stacks, and draw icons as inline SVG or`,
    `unicode. No Tailwind CDN, no FontAwesome, no fonts.googleapis.com,`,
    `no <script src> or <link href> pointing off the page except the`,
    `pasclaw.js line above.`,
    `If a real library or font is genuinely needed, VENDOR it: download`,
    `the file into the app directory with web_fetch`,
    `(save_to=projects/${project}/app/vendor/<file>) and reference it`,
    `relatively (<script src="vendor/chart.js">). Same-origin files are`,
    `served and the sandbox allows them. Prefer inline over vendored,`,
    `vendored over nothing at all -- and keep vendored files small and`,
    `few; never hot-link.`,
    ``,
    `Keep the board current with the project and task tools as you work:`,
    `create tasks for the steps, and report each job when it finishes.`,
    `Be brief in chat -- the app is the answer.`,
    ``,
    `THIS DESKTOP RENDERS STRUCTURED OUTPUT AS REAL UI. When you would`,
    `otherwise write a numbered plan, emit a fenced block instead and the`,
    `user gets a wizard whose Next button approves each step (and whose`,
    `Finish turns the steps into tasks on the board):`,
    "```pasclaw-ui",
    `{"ui":"wizard","title":"Plan","steps":[{"title":"...","body":"..."}]}`,
    "```",
    `When you need a decision, ask with buttons rather than prose -- the`,
    `chosen label comes back as the user's next message:`,
    "```pasclaw-ui",
    `{"ui":"ask","text":"Use IMAP or the Gmail API?",`,
    ` "buttons":[{"label":"IMAP","value":"IMAP"},{"label":"Gmail API","value":"Gmail API"}]}`,
    "```",
    `Use these sparingly and only when they fit; ordinary prose is fine.`,
    voice ? `` : ``,
    voice ? `VOICE: ${voice}` : ``,
  ].filter(l => l !== null && l !== undefined).join("\n");
}

/* ==========================================================================
   Period-native agent output

   The §0 idea, made concrete: the agent does not answer a plan with a
   markdown list, it answers with a WIZARD whose pages are the steps and
   whose Next button is your approval. A question is a message box with real
   buttons. Work in progress is the progress dialog with the chunky bar.

   These are ordinary desktop windows built from the same palette, so they
   look native in all 27 styles. They are driven from the chat stream: the
   client recognises structured output (a fenced ```pasclaw-ui block, or a
   plan the model wrote through plan_write) and renders furniture instead of
   text. Anything it does not recognise stays plain text -- an unrecognised
   answer must never disappear.
   ========================================================================== */

/* A wizard. Steps is an array of {title, body}; onFinish gets the step list
   back so the caller can turn approved steps into tasks. */
function showWizard(opts) {
  const steps = (opts.steps || []).filter(Boolean);
  if (!steps.length) return null;
  let i = 0;

  const w = createWindow({
    title: opts.title || "Wizard", width: 460, height: 320,
    icon: "page", max: false, pad: false,
  });
  const wrap = el("div", "wizard");
  const page = el("div", "page");
  const foot = el("div", "foot");
  const back = el("button", "btn", "< Back");
  const next = el("button", "btn", "Next >");
  const cancel = el("button", "btn", "Cancel");
  foot.appendChild(back); foot.appendChild(next); foot.appendChild(cancel);
  wrap.appendChild(page); wrap.appendChild(foot);
  w.body.appendChild(wrap);
  w.body.style.padding = "3px";

  function paint() {
    page.textContent = "";
    page.appendChild(el("div", "side"));
    const st = steps[i];
    page.appendChild(el("h3", null, st.title || `Step ${i + 1}`));
    if (st.body) page.appendChild(el("p", null, st.body));
    /* The overview list doubles as the plan: you can see the whole shape
       while you approve one step at a time. */
    const ol = el("ol", "steps");
    steps.forEach((s2, n) => {
      const li = el("li", n === i ? "cur" : null, s2.title || `Step ${n + 1}`);
      ol.appendChild(li);
    });
    page.appendChild(ol);
    back.disabled = i === 0;
    next.textContent = i === steps.length - 1 ? "Finish" : "Next >";
    setTitle(w, `${opts.title || "Wizard"} -- step ${i + 1} of ${steps.length}`);
  }
  back.addEventListener("click", () => { if (i > 0) { i--; paint(); } });
  next.addEventListener("click", () => {
    if (i < steps.length - 1) { i++; paint(); return; }
    closeWindow(w);
    if (opts.onFinish) opts.onFinish(steps);
  });
  cancel.addEventListener("click", () => closeWindow(w));
  paint();
  return w;
}

/* A message box. buttons is an array of {label, value}; onPick gets the
   value. Kind picks the glyph: info | warn | stop | ask. */
function showMessage(opts) {
  const w = createWindow({
    title: opts.title || "Message", width: 360, height: 168,
    icon: "page", max: false, min: false, pad: false,
  });
  const box = el("div", "msgbox");
  const ico = el("div", "ico");
  ico.innerHTML = MSG_ICONS[opts.kind] || MSG_ICONS.info;
  box.appendChild(ico);
  box.appendChild(el("div", "text", opts.text || ""));
  w.body.appendChild(box);

  const foot = el("div", "msgfoot");
  const buttons = opts.buttons || [{ label: "OK", value: true }];
  buttons.forEach((b, n) => {
    const btn = el("button", "btn", b.label);
    btn.style.minWidth = "78px";
    btn.addEventListener("click", () => {
      closeWindow(w);
      if (opts.onPick) opts.onPick(b.value);
    });
    foot.appendChild(btn);
    if (n === 0) setTimeout(() => btn.focus(), 0);
  });
  w.body.appendChild(foot);
  return w;
}

/* The progress dialog. Returns a handle with .set(pct, what) and .done(). */
function showProgress(opts) {
