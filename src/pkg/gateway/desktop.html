<!DOCTYPE html>
<!--
  PasClaw Desktop -- the retro desktop client, in the browser.

  One file, vanilla ES2020, no build step: the same house rule webui.html
  follows, so editing this file and re-running `make` is the whole workflow.

  It is the twin of the FireMonkey client in desktop/: both drive the same
  /v1/* surface (PasClaw.Gateway.Desktop) and both take their colors from the
  SAME generated palette table, so a style looks identical in either. The
  palette block below is machine-generated from the styles repo -- see
  scripts/export-retro-palettes.py. Do not hand-edit colors.
-->

button, input, select, textarea { font: inherit; color: inherit; }

/* The bevel system. Retro chrome is 1-2px light/dark edges, which is exactly

.out {

   so windows and icons live in #stage beside it rather than on top of it. */

}

function icon(name) { return ICONS[name] || ICONS.app; }

/* ==========================================================================
   Window manager
   ========================================================================== */

let zTop = 10, winSeq = 0, cascade = 0;
const WINS = new Map();

function desktopRect() { return $("#stage").getBoundingClientRect(); }

function createWindow(opts) {
  const o = Object.assign({
    title: "Window", width: 480, height: 340, x: null, y: null,
    resizable: true, min: true, max: true, key: null, icon: "app",
    onClose: null,
  }, opts);

  /* A window with a key is a singleton -- reopening focuses the live one
     instead of stacking duplicates (Display Properties, the tree, Library). */
  if (o.key && WINS.has(o.key)) {
    const w = WINS.get(o.key);
    restoreWindow(w); focusWindow(w);
    return w;
  }

  const r = desktopRect();
  const width = Math.min(o.width, Math.max(220, r.width - 20));
  const height = Math.min(o.height, Math.max(140, r.height - 20));
  const x = o.x != null ? o.x : Math.min(24 + cascade * 22, Math.max(0, r.width - width - 10));
  const y = o.y != null ? o.y : Math.min(18 + cascade * 20, Math.max(0, r.height - height - 10));
  cascade = (cascade + 1) % 8;

  const n = el("div", "win out");
  n.style.left = x + "px"; n.style.top = y + "px";
  n.style.width = width + "px"; n.style.height = height + "px";
  n.style.zIndex = ++zTop;

  const bar = el("div", "titlebar");
  const ttl = el("div", "t", o.title);
  bar.appendChild(ttl);
  const mkBtn = (label, title, fn) => {
    const b = el("button", "tbtn"); b.innerHTML = label; b.title = title;
    b.addEventListener("mousedown", e => e.stopPropagation());
    b.addEventListener("click", e => { e.stopPropagation(); fn(); });
    bar.appendChild(b); return b;
  };
  if (o.min) mkBtn("&#9866;", "Minimize", () => minimizeWindow(w));
  if (o.max) mkBtn("&#9633;", "Maximize", () => toggleMax(w));
  mkBtn("&#10005;", "Close", () => closeWindow(w));
  n.appendChild(bar);

  const body = el("div", "wbody" + (o.pad === false ? "" : " pad"));
  n.appendChild(body);

  const w = {
    id: ++winSeq, key: o.key, node: n, bar, body, title: o.title,
    icon: o.icon, minimized: false, maximized: false, prev: null,
    onClose: o.onClose, onActive: null,
  };
  WINS.set(o.key || ("w" + w.id), w);
  n.__win = w;

  if (o.resizable) {
    ["n","s","w","e","nw","ne","sw","se"].forEach(d => {
      const g = el("div", "edge " + d);
      g.addEventListener("mousedown", e => startResize(e, w, d));
      n.appendChild(g);
    });
  }

  /* Click ANYWHERE on an inactive window activates it, and the same press
     also begins the drag -- no second click needed. That behavior is the
     one every one of these systems shared. */
  n.addEventListener("mousedown", () => focusWindow(w), true);
  bar.addEventListener("mousedown", e => startDrag(e, w));
  bar.addEventListener("dblclick", () => { if (o.max) toggleMax(w); });

  $("#stage").appendChild(n);
  focusWindow(w);
  paintTaskbar();
  return w;
}

function setTitle(w, t) { w.title = t; w.bar.querySelector(".t").textContent = t; paintTaskbar(); }

function focusWindow(w) {
  if (w.minimized) restoreWindow(w);
  for (const x of WINS.values()) {
    if (x === w) continue;
    if (x.node.classList.contains("active")) {
      x.node.classList.remove("active");
      if (x.onActive) x.onActive(false);
    }
  }
  if (!w.node.classList.contains("active")) {
    w.node.classList.add("active");
    if (w.onActive) w.onActive(true);
  }
  w.node.style.zIndex = ++zTop;
  paintTaskbar();
}

function minimizeWindow(w) {
  w.minimized = true; w.node.classList.add("min"); w.node.classList.remove("active");
  paintTaskbar();
}
function restoreWindow(w) {
  w.minimized = false; w.node.classList.remove("min");
  paintTaskbar();
}
function toggleMax(w) {
  const r = desktopRect();
  if (w.maximized) {
    Object.assign(w.node.style, w.prev);
    w.maximized = false; w.node.classList.remove("max");
  } else {
    w.prev = { left: w.node.style.left, top: w.node.style.top,
               width: w.node.style.width, height: w.node.style.height };
    Object.assign(w.node.style, { left: "0px", top: "0px",
      width: r.width + "px", height: r.height + "px" });
    w.maximized = true; w.node.classList.add("max");
  }
}
function closeWindow(w) {
  if (w.onClose) { try { w.onClose(); } catch {} }
  w.node.remove();
  for (const [k, v] of WINS) if (v === w) WINS.delete(k);
  paintTaskbar();
}

function startDrag(e, w) {
  if (e.button !== 0) return;
  const r = desktopRect();
  let sx = e.clientX, sy = e.clientY;
  let ox = w.node.offsetLeft, oy = w.node.offsetTop;
  /* Dragging a maximized window restores it, keeping the grab point --
     the pointer stays where it was on the title bar. */
  let restored = false;
  document.body.classList.add("dragging");
  const move = ev => {
    if (w.maximized && !restored && Math.abs(ev.clientY - sy) > 4) {
      const frac = (sx - r.left) / r.width;
      toggleMax(w);
      const nw = w.node.offsetWidth;
      ox = Math.max(0, sx - r.left - nw * frac); oy = 0;
      sx = ev.clientX; sy = ev.clientY; restored = true;
    }
    if (w.maximized) return;
    let nx = ox + ev.clientX - sx, ny = oy + ev.clientY - sy;
    /* Windows stay reachable: the title bar may not leave the desktop. */
    nx = Math.max(-w.node.offsetWidth + 60, Math.min(nx, r.width - 40));
    ny = Math.max(0, Math.min(ny, r.height - 22));
    w.node.style.left = nx + "px"; w.node.style.top = ny + "px";
  };
  const up = ev => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    document.body.classList.remove("dragging");
    /* Edge maximize: shoved against the top of the stage. */
    if (!w.maximized && ev.clientY - r.top <= 2) toggleMax(w);
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
  e.preventDefault();
}

function startResize(e, w, dir) {
  if (e.button !== 0 || w.maximized) return;
  e.stopPropagation();
  const sx = e.clientX, sy = e.clientY;
  const x0 = w.node.offsetLeft, y0 = w.node.offsetTop;
  const w0 = w.node.offsetWidth, h0 = w.node.offsetHeight;
  document.body.classList.add("dragging");
  const move = ev => {
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    let nx = x0, ny = y0, nw = w0, nh = h0;
    if (dir.includes("e")) nw = Math.max(200, w0 + dx);
    if (dir.includes("s")) nh = Math.max(110, h0 + dy);
    if (dir.includes("w")) { nw = Math.max(200, w0 - dx); nx = x0 + (w0 - nw); }
    if (dir.includes("n")) { nh = Math.max(110, h0 - dy); ny = y0 + (h0 - nh); }
    Object.assign(w.node.style, { left: nx + "px", top: ny + "px",
      width: nw + "px", height: nh + "px" });
  };
  const up = () => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    document.body.classList.remove("dragging");
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
  e.preventDefault();
}

/* Keep windows on-screen when the desktop resizes. */
window.addEventListener("resize", () => {
  const r = desktopRect();
  for (const w of WINS.values()) {
    if (w.maximized) {
      w.node.style.width = r.width + "px"; w.node.style.height = r.height + "px";
      continue;
    }
    w.node.style.left = Math.min(w.node.offsetLeft, Math.max(0, r.width - 60)) + "px";
    w.node.style.top  = Math.min(w.node.offsetTop,  Math.max(0, r.height - 22)) + "px";
  }
});

/* ==========================================================================
   Taskbar
   ========================================================================== */

function paintTaskbar() {
  const host = $("#tasks");
  host.textContent = "";
  for (const w of WINS.values()) {
    const b = el("button", "taskbtn btn" +
      (w.node.classList.contains("active") && !w.minimized ? " on" : "") +
      (w.flash ? " flash" : ""), w.title);
    b.addEventListener("click", () => {
      if (w.flash) { w.flash = false; }
      if (w.minimized) { restoreWindow(w); focusWindow(w); }
      else if (w.node.classList.contains("active")) minimizeWindow(w);
      else focusWindow(w);
    });
    host.appendChild(b);
  }

  const pg = $("#pager");
  pg.textContent = "";
  S.workspaces.forEach(ws => {
    const b = el("button", "pgbtn btn" + (ws.active ? " on" : ""), String(ws.slot));
    b.title = ws.label + (ws.projects ? ` -- ${ws.projects} project(s)` : "");
    b.addEventListener("click", () => switchWorkspace(ws.name));
    pg.appendChild(b);
  });
  const add = el("button", "pgbtn btn", "+");
  add.title = "New workspace";
  add.addEventListener("click", newWorkspace);
  pg.appendChild(add);
}

function tick() {
  const d = new Date();
  $("#clock").textContent =
    d.getHours().toString().padStart(2, "0") + ":" +
    d.getMinutes().toString().padStart(2, "0");
}
setInterval(tick, 15000); tick();

/* ==========================================================================
   Workspaces
   ========================================================================== */

async function loadWorkspaces() {
  const j = await api("/v1/workspaces");
  S.workspaces = j.workspaces || [];
  S.active = j.active;
  paintTaskbar();
}

async function switchWorkspace(name) {
  if (name === S.active) return;
  /* Switching desktops closes this one's windows: they belong to the
     workspace, not to the browser tab. */
  for (const w of Array.from(WINS.values())) closeWindow(w);
  await api("/v1/workspaces/activate", { method: "POST", body: { name } });
  S.tree = {}; S.selected = null;
  await loadWorkspaces();
  await loadProjects();
}

async function newWorkspace() {
  const label = prompt("Name for the new workspace:", "");
  if (label === null) return;
  await api("/v1/workspaces", { method: "POST", body: { label } });
  await loadWorkspaces();
}

document.addEventListener("keydown", e => {
  if (!(e.ctrlKey && e.altKey)) return;
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const i = S.workspaces.findIndex(w => w.active);
  if (i < 0) return;
  const j = e.key === "ArrowLeft" ? i - 1 : i + 1;
  if (j >= 0 && j < S.workspaces.length) { e.preventDefault(); switchWorkspace(S.workspaces[j].name); }
});

/* ==========================================================================
   Projects, icons, tree
   ========================================================================== */

async function loadProjects() {
  const j = await api("/v1/projects");
  S.projects = j.projects || [];
  paintIcons();
  paintTree();
}

function paintIcons() {
  const host = $("#icons");
  host.textContent = "";
  const perCol = Math.max(1, Math.floor((desktopRect().height - 20) / 86));
  S.projects.forEach((p, i) => {
    const n = el("div", "dicon");
    n.style.left = (8 + Math.floor(i / perCol) * 90) + "px";
    n.style.top  = (8 + (i % perCol) * 86) + "px";
    const g = el("div", "glyph");
    g.innerHTML = icon(p.has_app ? "app" : "folder");
    n.appendChild(g);
    n.appendChild(el("span", "cap", p.title || p.name));
    n.addEventListener("click", () => {
      host.querySelectorAll(".dicon.sel").forEach(x => x.classList.remove("sel"));
      n.classList.add("sel");
    });
    /* Double-click opens the app if there is one, else the project's chat --
       "open" means "show me the thing", and for a project without an app
       yet the thing is the conversation that will build it. */
    n.addEventListener("dblclick", () => {
      if (p.has_app && p.app_ready) openApp(p.name);
      else openChat(p.name);
    });
    host.appendChild(n);
  });
}

/* The dock is always there; "Projects" on the menu just un-hides it. */
function openTree() {
  $("#dock").classList.remove("hidden");
  $("#stage").classList.remove("wide");
  paintTree();
}
function hideDock() {
  $("#dock").classList.add("hidden");
  $("#stage").classList.add("wide");
}

function initDock() {
  $("#dockhide").addEventListener("click", hideDock);
  $("#newproj").addEventListener("click", newProject);
  $("#refresh").addEventListener("click", async () => {
    S.tree = {};
    await loadProjects();
  });
  /* Drag the dock's right edge to resize it. The stage's left offset follows,
     so windows never end up underneath. */
  $("#dockgrip").addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    const sx = e.clientX, w0 = $("#dock").offsetWidth;
    document.body.classList.add("dragging");
    const move = ev => {
      const nw = Math.max(150, Math.min(460, w0 + ev.clientX - sx));
      $("#dock").style.width = nw + "px";
      $("#stage").style.left = nw + "px";
    };
    const up = () => {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      document.body.classList.remove("dragging");
      paintIcons();
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
    e.preventDefault();
  });
}

function paintTree() {
  const host = document.getElementById("treebody");
  if (!host) return;
  host.textContent = "";
  const tree = el("div", "tree");

  if (!S.projects.length) {
    tree.appendChild(el("div", "node muted", "No projects yet."));
    tree.appendChild(el("div", "node muted", "Ask PasClaw to build one."));
    host.appendChild(tree);
    return;
  }

  S.projects.forEach(p => {
    const st = S.tree[p.name] || (S.tree[p.name] = { open: false, tasks: null });

    const row = el("div", "node" + (S.selected === p.name ? " sel" : ""));
    const tw = el("span", "twist", st.open ? "▼" : "▶");
    row.appendChild(tw);
    const g = el("span"); g.style.cssText = "width:14px;height:14px;flex:0 0 14px";
    g.innerHTML = icon(p.has_app ? "app" : "folder");
    row.appendChild(g);
    row.appendChild(el("span", null, p.title || p.name));
    if (p.open_tasks) row.appendChild(el("span", "badge", String(p.open_tasks)));
    row.addEventListener("click", async () => {
      S.selected = p.name;
      st.open = !st.open;
      if (st.open && !st.tasks) await loadTasks(p.name);
      paintTree();
    });
    row.addEventListener("dblclick", () => openChat(p.name));
    tree.appendChild(row);

    if (!st.open) return;
    (st.tasks || []).forEach(t => {
      const tr = el("div", "node");
      tr.style.paddingLeft = "18px";
      const tt = el("span", "twist", t.jobs ? (t.__open ? "▼" : "▶") : "");
      tr.appendChild(tt);
      const lbl = el("span", "st-" + t.status, t.id + "  " + t.title);
      tr.appendChild(lbl);
      tr.title = t.notes || "";
      tr.addEventListener("click", async () => {
        if (!t.jobs) return;
        t.__open = !t.__open;
        if (t.__open && !t.__jobs) {
          const j = await api(`/v1/projects/${p.name}/tasks/${t.id}/jobs`);
          t.__jobs = j.jobs || [];
        }
        paintTree();
      });
      tree.appendChild(tr);

      if (!t.__open) return;
      (t.__jobs || []).forEach(job => {
        const jr = el("div", "node");
        jr.style.paddingLeft = "36px";
        jr.appendChild(el("span", "twist", ""));
        jr.appendChild(el("span", "st-" + (job.status === "failed" ? "blocked" :
          job.status === "running" ? "active" : "done"),
          job.id + "  " + job.status + (job.summary ? " -- " + job.summary : "")));
        jr.addEventListener("dblclick", () => openJobLog(p.name, t.id, job.id));
        tree.appendChild(jr);
      });
    });

    const add = el("div", "node muted");
    add.style.paddingLeft = "18px";
    add.appendChild(el("span", "twist", "+"));
    add.appendChild(el("span", null, "New task..."));
    add.addEventListener("click", () => newTask(p.name));
    tree.appendChild(add);
  });

  host.appendChild(tree);
}

async function loadTasks(project) {
  const j = await api(`/v1/projects/${project}/tasks`);
  (S.tree[project] || (S.tree[project] = {})).tasks = j.tasks || [];
}

async function newProject() {
  const title = prompt("What should this project be called?", "");
  if (!title) return;
  try {
    const j = await api("/v1/projects", { method: "POST", body: { title } });
    await loadProjects();
    openChat(j.name);
  } catch (e) { alert(e.message); }
}

async function newTask(project) {
  const title = prompt("Task title:", "");
  if (!title) return;
  await api(`/v1/projects/${project}/tasks`, { method: "POST", body: { title } });
  await loadTasks(project);
  await loadProjects();
}

/* ==========================================================================
   Chat -- per project, with artifact cards
   ========================================================================== */

function openChat(project) {
  const p = S.projects.find(x => x.name === project);
  const w = createWindow({
    key: "chat:" + project, title: (p ? p.title : project) + " -- Chat",
    width: 520, height: 420, icon: "chat", pad: false,
  });

  const wrap = el("div", "chat");
  const log = el("div", "log in");
  const composer = el("div", "composer");
  const ta = el("textarea", "fld");
  ta.placeholder = "Describe the app you want. PasClaw builds it here.";
  const send = el("button", "btn", "Send");
  composer.appendChild(ta); composer.appendChild(send);
  wrap.appendChild(log); wrap.appendChild(composer);
  w.body.appendChild(wrap);
  w.body.style.padding = "5px";

  const history = [];

  function addMsg(who, text, cls) {
    const m = el("div", "msg " + (cls || ""));
    m.appendChild(el("div", "who", who));
    const b = el("div", "body", text);
    m.appendChild(b);
    log.appendChild(m);
    log.scrollTop = log.scrollHeight;
    return b;
  }

  /* An artifact card: the turn produced or updated something runnable.
     Pinned to the message that made it, so scrolling back through a
     conversation is scrolling back through versions. */
  function addArtifact(kind, name, opener) {
    const card = el("div", "artifact");
    const g = el("div", "ico");
    g.innerHTML = icon(kind === "page" ? "page" : "app");
    card.appendChild(g);
    const meta = el("div", "meta");
    meta.appendChild(el("div", "nm", name));
    meta.appendChild(el("div", "kd", kind === "page" ? "page -- document" : "app -- " + kind));
    card.appendChild(meta);
    const run = el("button", "btn", "▶ Run");
    run.addEventListener("click", opener);
    card.appendChild(run);
    log.appendChild(card);
    log.scrollTop = log.scrollHeight;
  }

  async function submit() {
    const text = ta.value.trim();
    if (!text) return;
    ta.value = "";
    addMsg("you", text, "u");
    history.push({ role: "user", content: text });

    const body = addMsg("pasclaw", "");
    send.disabled = true;
    let acc = "", touchedApp = false;

    try {
      const t = token();
      const r = await fetch("/v1/chat/completions", {
        method: "POST",
        headers: Object.assign(
          { "content-type": "application/json", "accept": "text/event-stream" },
          t ? { authorization: "Bearer " + t } : {}),
        body: JSON.stringify({
          stream: true,
          messages: history,
          /* Builder mode: the system prompt that makes the deliverable an
             app rather than an essay, scoped to this project. */
          system: builderPrompt(project),
        }),
      });
      if (!r.ok) { body.textContent = `(http ${r.status})`; send.disabled = false; return; }

      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
          if (line.startsWith(":")) {
            /* The gateway's tool side-channel. A write into this project's
               app/ directory is what tells us an artifact appeared -- we
               don't have to ask the model to announce it. */
            const c = line.slice(1).trim();
            if (c.startsWith("pasclaw-tool ")) {
              try {
                const tj = JSON.parse(c.slice("pasclaw-tool ".length));
                const argstr = JSON.stringify(tj.args || tj.arguments || {});
                if (/projects\/[^"]*\/app\//.test(argstr)) touchedApp = true;
              } catch {}
            }
            continue;
          }
          if (!line.startsWith("data:")) continue;
          const data = line.slice(5).trim();
          if (data === "[DONE]") break;
          try {
            const j = JSON.parse(data);
            const d = (j.choices && j.choices[0] && j.choices[0].delta &&
                       j.choices[0].delta.content) || "";
            if (d) { acc += d; body.textContent = acc; log.scrollTop = log.scrollHeight; }
          } catch {}
        }
      }
    } catch (e) {
      body.textContent = acc + "\n(" + e.message + ")";
    }
    send.disabled = false;
    history.push({ role: "assistant", content: acc });

    /* Period-native output: if the turn emitted a UI block, show the
       furniture and strip it from the visible text. Unrecognised or
       malformed blocks stay as text -- an answer must never vanish. */
    const ui = extractUIBlocks(acc);
    if (ui.blocks.length) {
      body.textContent = ui.text;
      ui.blocks.forEach(b => renderUIBlock(b, project));
    }

    /* Did this turn leave a runnable app behind? Ask the gateway rather
       than trusting the transcript. */
    try {
      const app = await api("/v1/apps/" + project);
      if (app && app.exists && app.ready) {
        addArtifact(app.kind, app.name || project, () => openApp(project));
      } else if (touchedApp) {
        addMsg("desktop", "The app was written but has no runnable entry yet.");
      }
    } catch {}
    await loadProjects();
    if (S.tree[project]) { await loadTasks(project); paintTree(); }
  }

  send.addEventListener("click", submit);
  ta.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
  });
  /* Let a dialog's answer continue this conversation (see renderUIBlock). */
  w.__submitText = text => { ta.value = text; submit(); };
  setTimeout(() => ta.focus(), 0);
  return w;
}

/* The builder-mode overlay. Kept client-side for now so it is visible and
   editable next to the UI that depends on it; the plan moves it into a
   shipped skill (skills/app-factory) so it becomes promptware. */
/* Per-style personality. The plan's idea: a desktop that looks like System 6
   should not answer like a 2020s chatbot. This costs nothing -- it is a
   sentence appended to the system prompt -- and it is what makes the style
   picker feel like it changes the machine rather than the paint. */
const STYLE_VOICE = {
  AppleSystem: "Answer the way a 1984 Macintosh would: few words, plain " +
    "nouns, no exclamation. The machine is polite and very small.",
  MacOS9:      "Answer warmly and briefly, like Mac OS 9 Help.",
  Win31:       "Answer like a Windows 3.1 manual: numbered, literal, dry.",
  Win95:       "Answer like a Windows 95 wizard: short steps, plain language.",
  Win98:       "Answer like a Windows 98 wizard: short steps, plain language.",
  NeXTSTEP:    "Answer precisely and technically, like NeXTSTEP documentation.",
  BeOS:        "Answer briskly and a little playfully, like BeOS release notes.",
  Amiga13:     "Answer tersely, like an Amiga Workbench requester.",
  Amiga20:     "Answer tersely, like an Amiga Workbench requester.",
  GEM:         "Answer in very few words, like a GEM desk accessory.",
  Synthwave:   "Answer with a little neon swagger -- brief, confident, " +
    "never purple. You are a 1984 that never happened.",
  Phosphor:    "Answer like an amber terminal: terse, monospaced in spirit, " +
    "no decoration.",
  ClaudeCode:     "Answer plainly and concisely, like a good CLI.",
  ClaudeCodeDark: "Answer plainly and concisely, like a good CLI.",
};

function builderPrompt(project) {
  const voice = STYLE_VOICE[S.style];
  return [
    `You are working inside the PasClaw Desktop project "${project}".`,
    `Deliverables are APPS, not essays. When the user asks for something,`,
    `build it as software they can open in a window.`,
    ``,
    `Write the app into projects/${project}/app/ inside the workspace, and`,
    `maintain projects/${project}/app/app.json:`,
    `  {"name":"...","kind":"page|html|python","entry":"index.html",`,
    `   "window":{"width":640,"height":480}}`,
    `Choose the lightest kind that works: "page" (a static document, no`,
    `scripts) then "html" (a self-contained page WITH scripts) then "python".`,
    `An html app persists data through the desktop's SDK. Include it and use`,
    `the two calls -- do NOT fetch the API directly, the app is sandboxed and`,
    `the call will be blocked:`,
    /* The closing tag is split: a literal </' + 'script> inside this file's
       own <script> element would end it and break the page. */
    "  <script src=\"pasclaw.js\"><\/script>",
    `  await pasclaw.setJSON("books", list);`,
    `  const list = await pasclaw.getJSON("books", []);`,
    `The app may not reach any other origin.`,
    ``,
    `Keep the board current with the project and task tools as you work:`,
    `create tasks for the steps, and report each job when it finishes.`,
    `Be brief in chat -- the app is the answer.`,
    ``,
    `THIS DESKTOP RENDERS STRUCTURED OUTPUT AS REAL UI. When you would`,
    `otherwise write a numbered plan, emit a fenced block instead and the`,
    `user gets a wizard whose Next button approves each step (and whose`,
    `Finish turns the steps into tasks on the board):`,
    "```pasclaw-ui",
    `{"ui":"wizard","title":"Plan","steps":[{"title":"...","body":"..."}]}`,
    "```",
    `When you need a decision, ask with buttons rather than prose -- the`,
    `chosen label comes back as the user's next message:`,
    "```pasclaw-ui",
    `{"ui":"ask","text":"Use IMAP or the Gmail API?",`,
    ` "buttons":[{"label":"IMAP","value":"IMAP"},{"label":"Gmail API","value":"Gmail API"}]}`,
    "```",
    `Use these sparingly and only when they fit; ordinary prose is fine.`,
    voice ? `` : ``,
    voice ? `VOICE: ${voice}` : ``,
  ].filter(l => l !== null && l !== undefined).join("\n");
}

/* ==========================================================================
   Period-native agent output

   The §0 idea, made concrete: the agent does not answer a plan with a
   markdown list, it answers with a WIZARD whose pages are the steps and
   whose Next button is your approval. A question is a message box with real
   buttons. Work in progress is the progress dialog with the chunky bar.

   These are ordinary desktop windows built from the same palette, so they
   look native in all 27 styles. They are driven from the chat stream: the
   client recognises structured output (a fenced ```pasclaw-ui block, or a
   plan the model wrote through plan_write) and renders furniture instead of
   text. Anything it does not recognise stays plain text -- an unrecognised
   answer must never disappear.
   ========================================================================== */

/* A wizard. Steps is an array of {title, body}; onFinish gets the step list
   back so the caller can turn approved steps into tasks. */
function showWizard(opts) {
  const steps = (opts.steps || []).filter(Boolean);
  if (!steps.length) return null;
  let i = 0;

  const w = createWindow({
    title: opts.title || "Wizard", width: 460, height: 320,
    icon: "page", max: false, pad: false,
  });
  const wrap = el("div", "wizard");
  const page = el("div", "page");
  const foot = el("div", "foot");
  const back = el("button", "btn", "< Back");
  const next = el("button", "btn", "Next >");
  const cancel = el("button", "btn", "Cancel");
  foot.appendChild(back); foot.appendChild(next); foot.appendChild(cancel);
  wrap.appendChild(page); wrap.appendChild(foot);
  w.body.appendChild(wrap);
  w.body.style.padding = "3px";

  function paint() {
    page.textContent = "";
    page.appendChild(el("div", "side"));
    const st = steps[i];
    page.appendChild(el("h3", null, st.title || `Step ${i + 1}`));
    if (st.body) page.appendChild(el("p", null, st.body));
    /* The overview list doubles as the plan: you can see the whole shape
       while you approve one step at a time. */
    const ol = el("ol", "steps");
    steps.forEach((s2, n) => {
      const li = el("li", n === i ? "cur" : null, s2.title || `Step ${n + 1}`);
      ol.appendChild(li);
    });
    page.appendChild(ol);
    back.disabled = i === 0;
    next.textContent = i === steps.length - 1 ? "Finish" : "Next >";
    setTitle(w, `${opts.title || "Wizard"} -- step ${i + 1} of ${steps.length}`);
  }
  back.addEventListener("click", () => { if (i > 0) { i--; paint(); } });
  next.addEventListener("click", () => {
    if (i < steps.length - 1) { i++; paint(); return; }
    closeWindow(w);
    if (opts.onFinish) opts.onFinish(steps);
  });
  cancel.addEventListener("click", () => closeWindow(w));
  paint();
  return w;
}

/* A message box. buttons is an array of {label, value}; onPick gets the
   value. Kind picks the glyph: info | warn | stop | ask. */
function showMessage(opts) {
  const w = createWindow({
    title: opts.title || "Message", width: 360, height: 168,
    icon: "page", max: false, min: false, pad: false,
  });
  const box = el("div", "msgbox");
  const ico = el("div", "ico");
  ico.innerHTML = MSG_ICONS[opts.kind] || MSG_ICONS.info;
  box.appendChild(ico);
  box.appendChild(el("div", "text", opts.text || ""));
  w.body.appendChild(box);

  const foot = el("div", "msgfoot");
  const buttons = opts.buttons || [{ label: "OK", value: true }];
  buttons.forEach((b, n) => {
    const btn = el("button", "btn", b.label);
    btn.style.minWidth = "78px";
    btn.addEventListener("click", () => {
      closeWindow(w);
      if (opts.onPick) opts.onPick(b.value);
    });
    foot.appendChild(btn);
    if (n === 0) setTimeout(() => btn.focus(), 0);
  });
  w.body.appendChild(foot);
  return w;
}

const MSG_ICONS = {
  info: `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="var(--titlea)"
    stroke="var(--darkshadow)"/><text x="16" y="23" text-anchor="middle"
    font-size="19" font-weight="bold" fill="var(--titleatext)">i</text></svg>`,
  ask: `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="var(--titlea)"
    stroke="var(--darkshadow)"/><text x="16" y="24" text-anchor="middle"
    font-size="20" font-weight="bold" fill="var(--titleatext)">?</text></svg>`,
  warn: `<svg viewBox="0 0 32 32"><path d="M16 3 L30 28 H2 Z" fill="#ffd700"
    stroke="var(--darkshadow)"/><text x="16" y="26" text-anchor="middle"
    font-size="18" font-weight="bold" fill="#000">!</text></svg>`,
  stop: `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="#c00"
    stroke="var(--darkshadow)"/><rect x="7" y="13" width="18" height="6" fill="#fff"/></svg>`,
};

/* The progress dialog. Returns a handle with .set(pct, what) and .done(). */
function showProgress(opts) {
  const w = createWindow({
    title: opts.title || "Working", width: 340, height: 150,
    icon: "page", max: false, pad: false,
  });
  const box = el("div", "prog");
  box.appendChild(el("div", null, opts.text || "Working..."));
  const bar = el("div", "bar");
  const fill = el("div", "fill");
  fill.style.width = "0%";
  bar.appendChild(fill);
  box.appendChild(bar);
  const what = el("div", "what", "");
  box.appendChild(what);
  w.body.appendChild(box);
  return {
    window: w,
    set(pct, note) {
      fill.style.width = Math.max(0, Math.min(100, pct)) + "%";
      if (note != null) what.textContent = note;
    },
    done() { try { closeWindow(w); } catch {} },
  };
}

/* ---- recognising structured output in a chat reply ----

   The contract is deliberately tiny and optional: a fenced block

     ```pasclaw-ui
     {"ui":"wizard","title":"Plan","steps":[{"title":"..","body":".."}]}
     ```

   renders as furniture. Everything outside the block stays visible as text,
   so a model that ignores the convention loses nothing, and a malformed
   block degrades to the raw text rather than vanishing. */
function extractUIBlocks(text) {
  const out = { text: text, blocks: [] };
  const re = /```pasclaw-ui\s*([\s\S]*?)```/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    try {
      const obj = JSON.parse(m[1]);
      if (obj && obj.ui) out.blocks.push(obj);
    } catch { continue; }   /* malformed: leave it as visible text */
  }
  if (out.blocks.length)
    out.text = text.replace(re, (whole, body) => {
      try { JSON.parse(body); return ""; } catch { return whole; }
    }).trim();
  return out;
}

/* Render one recognised block. Project is passed so a wizard's approved
   steps can become real tasks on that project's board. */
function renderUIBlock(block, project) {
  if (block.ui === "wizard") {
    return showWizard({
      title: block.title || "Plan",
      steps: block.steps || [],
      onFinish: async steps => {
        if (!project) return;
        /* Approving a plan is what creates the tasks. That is the whole
           gesture: Next, Next, Finish -> a board. */
        for (const st of steps) {
          try {
            await api(`/v1/projects/${project}/tasks`, {
              method: "POST",
              body: { title: st.title || "Step", notes: st.body || "" },
            });
          } catch {}
        }
        await loadProjects();
        if (S.tree[project]) { await loadTasks(project); paintTree(); }
        showMessage({
          title: "Plan accepted", kind: "info",
          text: `${steps.length} task(s) added to ${project}.`,
        });
      },
    });
  }
  if (block.ui === "message" || block.ui === "ask") {
    return showMessage({
      title: block.title || "PasClaw",
      kind: block.kind || (block.ui === "ask" ? "ask" : "info"),
      text: block.text || "",
      buttons: block.buttons || [{ label: "OK", value: true }],
      onPick: v => {
        /* An answered question goes back as the next chat turn, so the
           conversation continues where the dialog left off. */
        if (block.reply === false || !project) return;
        const w = WINS.get("chat:" + project);
        if (w && w.__submitText) w.__submitText(String(v));
      },
    });
  }
  return null;
}

/* ==========================================================================
   App windows

   The state broker. App iframes are sandboxed WITHOUT allow-same-origin, so
   they cannot call the gateway themselves -- if they could, they would also
   be same-origin with this page and able to read the operator's token. So
   they post a message here and we make the call on their behalf, scoped to
   the project whose window the message actually came from. An app cannot
   name another project: we ignore what it claims and use the mapping from
   its own contentWindow.
   ========================================================================== */

const FRAME_PROJECT = new Map();   /* contentWindow -> project slug */

window.addEventListener("message", async ev => {
  const m = ev.data;
  if (!m || m.__pasclaw !== "state") return;
  const project = FRAME_PROJECT.get(ev.source);
  const reply = (payload) => {
    try { ev.source.postMessage(Object.assign({ __pasclaw: "reply", id: m.id }, payload), "*"); }
    catch {}
  };
  if (!project) { reply({ error: "unknown app frame" }); return; }
  const key = String(m.key || "");
  const url = `/v1/apps/${encodeURIComponent(project)}/state/${encodeURIComponent(key)}`;
  try {
    if (m.op === "get") {
      const j = await api(url);
      reply({ value: j.exists ? j.value : null });
    } else if (m.op === "set") {
      await api(url, { method: "PUT", body: String(m.value == null ? "" : m.value),
                       headers: { "content-type": "text/plain" } });
      reply({ value: true });
    } else if (m.op === "del") {
      await api(url, { method: "DELETE" });
      reply({ value: true });
    } else if (m.op === "action") {
      const j = await api(`/v1/apps/${encodeURIComponent(project)}/action/` +
                          encodeURIComponent(String(m.key || "")), { method: "POST" });
      reply({ value: j });
    } else if (m.op === "read") {
      /* The allowlist lives on the server; we just forward the name so an
         app cannot reach past it by talking to us instead. */
      const j = await api(`/v1/apps/${encodeURIComponent(project)}/read/` +
                          encodeURIComponent(String(m.key || "")));
      reply({ value: j.items || [] });
    } else {
      reply({ error: "unknown op" });
    }
  } catch (e) {
    reply({ error: e.message });
  }
});

async function openApp(project) {
  let app;
  try { app = await api("/v1/apps/" + project); }
  catch (e) { alert(e.message); return; }
  if (!app.exists) { alert("This project has no app yet."); return; }
  if (!app.servable) {
    /* A process kind. It does not render in a window -- it RUNS, on the
       machine the gateway is on. That distinction matters enough to have its
       own window rather than an alert. */
    openProcessApp(project, app);
    return;
  }
  /* Declared permissions are shown before the app is opened, not buried in
     a manifest the user will never read. */
  if (app.network) {
    if (!confirm(`"${app.name}" declares network access to:\n  ${app.network}\n\nOpen it?`)) return;
  }

  const w = createWindow({
    key: "app:" + project, title: app.name || project,
    width: app.width || 640, height: (app.height || 480) + 26,
    icon: "app", pad: false,
  });
  const frame = el("iframe", "app");
  /* The app is model-authored code. Sandboxed here AND served under a CSP by
     the gateway -- neither alone is enough: the sandbox stops it reaching
     this page's DOM and the operator's token, the CSP stops it reaching the
     network. Persistence goes through the broker above instead. */
  frame.setAttribute("sandbox", "allow-scripts allow-forms");
  frame.addEventListener("load", () => {
    if (frame.contentWindow) FRAME_PROJECT.set(frame.contentWindow, project);
  });
  frame.src = appURL(project) + "?t=" + Date.now();
  w.body.appendChild(frame);
  /* Register the frame NOW, not on load: the SDK inside the app posts its
     first state read while the document is still parsing, which is before
     the load event fires. Registering late loses that first request. */
  if (frame.contentWindow) FRAME_PROJECT.set(frame.contentWindow, project);
  w.onClose = () => {
    if (frame.contentWindow) FRAME_PROJECT.delete(frame.contentWindow);
  };

  const bar = el("div", "statusbar thin");
  const reload = el("button", "btn", "Reload");
  reload.addEventListener("click", () => {
    frame.src = appURL(project) + "?t=" + Date.now();
    if (frame.contentWindow) FRAME_PROJECT.set(frame.contentWindow, project);
  });
  bar.appendChild(reload);
  const chat = el("button", "btn", "Chat");
  chat.addEventListener("click", () => openChat(project));
  bar.appendChild(chat);
  bar.appendChild(el("span", "muted", app.kind + (app.network ? " -- net: " + app.network : "")));
  w.node.appendChild(bar);
  return w;
}

/* A process app: python / fpc / delphi. These are not documents, so there is
   nothing to render -- the window is a control panel. It states plainly WHERE
   the process runs, because the desktop metaphor otherwise implies "here",
   and with a remote gateway that is wrong. */
async function openProcessApp(project, app) {
  const w = createWindow({
    key: "proc:" + project, title: (app.name || project) + " -- Run",
    width: 520, height: 340, icon: "app", pad: false,
  });

  const head = el("div");
  head.style.cssText = "padding:6px 6px 0";
  head.appendChild(el("div", null, `${app.name || project}  [${app.kind}]`));
  const inDocker = (app.run_backend === "docker");
  const where = el("div", "muted",
    (inDocker ? "Runs in a container on the PasClaw host"
              : "Runs as a process on the PasClaw host") +
    (S.host ? `: ${S.host}` : ""));
  head.appendChild(where);
  if (!inDocker)
    head.appendChild(el("div", "muted",
      "Set shell_backend to \"docker\" to run apps in a container instead."));
  const cmd = el("div", "muted", "");
  cmd.style.cssText = "font-family:monospace;word-break:break-all;margin-top:3px";
  head.appendChild(cmd);
  if (app.network) head.appendChild(el("div", "muted", "declares network: " + app.network));
  if (app.env) head.appendChild(el("div", "muted",
    "expects env: " + app.env + "  (put these in the project's app/.env)"));
  w.body.appendChild(head);

  const bar = el("div");
  bar.style.cssText = "display:flex;gap:4px;padding:6px";
  const runBtn = el("button", "btn", "Run");
  const stopBtn = el("button", "btn", "Stop");
  const openBtn = el("button", "btn", "Open");
  openBtn.disabled = true;
  const state = el("span", "muted", "");
  state.style.cssText = "align-self:center;margin-left:6px";
  bar.appendChild(runBtn); bar.appendChild(stopBtn);
  bar.appendChild(openBtn); bar.appendChild(state);
  w.body.appendChild(bar);

  const log = el("div", "log in");
  log.style.cssText = "margin:0 6px 6px;height:calc(100% - 132px);" +
                      "white-space:pre-wrap;font-family:monospace;font-size:11px";
  w.body.appendChild(log);

  let url = null;
  function render(info) {
    state.textContent = info.state + (info.port ? `  port ${info.port}` : "");
    cmd.textContent = info.command || app.run_command || "";
    runBtn.disabled = info.state === "running";
    stopBtn.disabled = info.state !== "running";
    url = info.url || (info.port ? `http://127.0.0.1:${info.port}/` : null);
    openBtn.disabled = !url;
  }

  async function refresh() {
    try {
      const m = await api("/v1/apps/" + project);
      render({ state: m.run_state || "stopped", port: m.run_port || 0,
               command: m.run_command, url: m.run_url });
      const l = await api(`/v1/apps/${project}/runlog`);
      const atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
      log.textContent = l.log || "";
      if (atEnd) log.scrollTop = log.scrollHeight;
    } catch {}
  }

  runBtn.addEventListener("click", async () => {
    runBtn.disabled = true;
    try {
      /* First ask WITHOUT confirm: the gateway answers 409 with the exact
         command, which is what we show the user. Consent to a hidden command
         is not consent. */
      let planned = app.run_command || "";
      try {
        await api(`/v1/apps/${project}/run`, { method: "POST", body: {} });
      } catch (e) {
        if (e.status === 409 && e.detail && e.detail.command) planned = e.detail.command;
      }
      const lines = [
        `Run this app?`, ``,
        `  ${planned || "(command unknown)"}`, ``,
        S.host ? `It runs on the PasClaw host (${S.host}), not necessarily on this machine.`
               : `It runs on the PasClaw host, not necessarily on this machine.`,
      ];
      if (app.network) lines.push(``, `It declares network access to: ${app.network}`);
      lines.push(``, inDocker
        ? `It runs inside a container; only its app/ directory is mounted.`
        : `It runs directly on that machine, with the same reach you have.`);
      if (!confirm(lines.join("\n"))) { runBtn.disabled = false; return; }
      const info = await api(`/v1/apps/${project}/run`,
                            { method: "POST", body: { confirm: true } });
      render(info);
      /* An app that serves HTTP is worth opening straight away. */
      if (info.url) openBtn.click();
    } catch (e) {
      log.textContent += "\n" + e.message;
    }
    refresh();
  });

  stopBtn.addEventListener("click", async () => {
    try { await api(`/v1/apps/${project}/stop`, { method: "POST" }); } catch (e) {}
    refresh();
  });

  openBtn.addEventListener("click", () => {
    if (!url) return;
    /* A process app that serves HTTP gets a browser window like any page.
       It is NOT sandboxed as an app frame -- it is a server the user chose
       to run, on a port only they can reach. */
    const v = createWindow({
      key: "procview:" + project, title: (app.name || project),
      width: app.width || 640, height: (app.height || 480) + 8,
      icon: "globe", pad: false,
    });
    const f = el("iframe", "app");
    f.src = url;
    v.body.appendChild(f);
  });

  await refresh();
  const timer = setInterval(refresh, 3000);
  w.onClose = () => clearInterval(timer);
  return w;
}

/* ==========================================================================
   Job log
   ========================================================================== */

async function openJobLog(project, task, job) {
  const w = createWindow({
    key: `job:${project}:${task}:${job}`,
    title: `${project} ${task}/${job}`, width: 520, height: 300, icon: "page", pad: false,
  });
  const pre = el("div", "log in");
  pre.style.whiteSpace = "pre-wrap";
  pre.style.fontFamily = "monospace";
  w.body.appendChild(pre);
  w.body.style.padding = "3px";
  let stop = false;
  w.onClose = () => { stop = true; };
  async function poll() {
    if (stop) return;
    try {
      const j = await api(`/v1/projects/${project}/tasks/${task}/jobs/${job}/log`);
      const at = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 4;
      pre.textContent = j.log || "(no output yet)";
      if (at) pre.scrollTop = pre.scrollHeight;
    } catch {}
    if (!stop) setTimeout(poll, 2000);
  }
  poll();
  return w;
}

/* ==========================================================================
   Browser -- search that returns a page
   ========================================================================== */

function openBrowser(pageId) {
  const w = createWindow({ key: "browser", title: "Browser", width: 620, height: 460,
                           icon: "globe", pad: false });
  const bar = el("div");
  bar.style.cssText = "display:flex;gap:4px;padding:3px";
  const q = el("input", "fld");
  q.type = "text";
  q.placeholder = "Ask anything -- the answer comes back as a page";
  q.style.flex = "1 1 auto";
  const go = el("button", "btn", "Search");
  bar.appendChild(q); bar.appendChild(go);
  w.body.appendChild(bar);

  const frame = el("iframe", "app");
  frame.setAttribute("sandbox", "allow-same-origin");
  frame.style.height = "calc(100% - 30px)";
  w.body.appendChild(frame);

  const status = el("div", "statusbar thin");
  w.node.appendChild(status);

  function show(page) {
    frame.src = "/pages/" + page.id + "/";
    setTitle(w, page.title || "Browser");
    status.textContent = "";
    const n = page.source_count != null ? page.source_count : (page.sources || []).length;
    status.appendChild(el("span", n ? "grounded" : "ungrounded",
      n ? `GROUNDED -- ${n} source${n === 1 ? "" : "s"}` : "UNGROUNDED -- no sources"));
  }

  async function search() {
    const query = q.value.trim();
    if (!query) return;
    go.disabled = true;
    status.textContent = "Searching...";
    try {
      const j = await api("/v1/pages", { method: "POST", body: { query, kind: "search" } });
      const page = await api("/v1/pages/" + j.id);
      show(page);
    } catch (e) {
      status.textContent = "";
      status.appendChild(el("span", "ungrounded", e.message));
    }
    go.disabled = false;
  }
  go.addEventListener("click", search);
  q.addEventListener("keydown", e => { if (e.key === "Enter") search(); });

  if (pageId) api("/v1/pages/" + pageId).then(show).catch(() => {});
  else setTimeout(() => q.focus(), 0);
  return w;
}

/* ==========================================================================
   Library -- every page and project ever made
   ========================================================================== */

async function openLibrary() {
  const w = createWindow({ key: "library", title: "Library", width: 460, height: 380,
                           icon: "brain", pad: false });
  const list = el("div", "list in");
  list.style.height = "100%";
  w.body.appendChild(list);
  w.body.style.padding = "3px";

  try {
    const j = await api("/v1/pages");
    const pages = j.pages || [];
    if (!pages.length) {
      list.appendChild(el("div", "row muted", "No pages yet. Ask something in the Browser."));
    }
    pages.forEach(p => {
      const r = el("div", "row");
      const n = p.source_count || 0;
      r.textContent = `${p.title}  --  ${n} source${n === 1 ? "" : "s"}  ${p.created || ""}`;
      r.title = p.query || "";
      r.addEventListener("click", () => {
        list.querySelectorAll(".row.sel").forEach(x => x.classList.remove("sel"));
        r.classList.add("sel");
      });
      r.addEventListener("dblclick", () => openBrowser(p.id));
      list.appendChild(r);
    });
  } catch (e) {
    list.appendChild(el("div", "row", e.message));
  }
  return w;
}

/* ==========================================================================
   Display Properties -- the style picker
   ========================================================================== */

const STYLE_KEY = "pasclaw.desktop.style";

function loadStyleList() {
  /* The generated palette block carries its own manifest comment; read the
     style ids straight out of the stylesheet so the picker can never drift
     from the palettes that are actually present. */
  const ids = new Set();
  for (const sheet of document.styleSheets) {
    let rules;
    try { rules = sheet.cssRules; } catch { continue; }
    for (const r of rules || []) {
      const m = r.selectorText && r.selectorText.match(/\[data-style="([^"]+)"\]/);
      if (m) ids.add(m[1]);
    }
  }
  S.styles = Array.from(ids).sort();
}

function applyStyle(id) {
  if (!id) return;
  document.documentElement.setAttribute("data-style", id);
  S.style = id;
  try { localStorage.setItem(STYLE_KEY, id); } catch {}
}

function openDisplay() {
  const w = createWindow({ key: "display", title: "Display Properties",
                           width: 260, height: 380, icon: "gear", max: false, pad: false });
  const list = el("div", "list in");
  list.style.cssText = "height:calc(100% - 26px);margin:3px";
  S.styles.forEach(id => {
    const r = el("div", "row" + (id === S.style ? " sel" : ""), id);
    r.addEventListener("click", () => {
      list.querySelectorAll(".row.sel").forEach(x => x.classList.remove("sel"));
      r.classList.add("sel");
      applyStyle(id);
    });
    list.appendChild(r);
  });
  w.body.appendChild(list);
  const bar = el("div", "statusbar thin");
  bar.appendChild(el("span", "muted", S.styles.length + " styles"));
  w.node.appendChild(bar);
  return w;
}

/* ==========================================================================
   Boot
   ========================================================================== */

async function boot() {
  loadStyleList();
  try { applyStyle(localStorage.getItem(STYLE_KEY) || "Win95"); } catch { applyStyle("Win95"); }
  buildMenu();
  initDock();
  try {
    /* Ask the gateway how it is arranged before rendering anything that
       depends on it. A gateway too old to answer just leaves the defaults. */
    try {
      const cfg = await api("/v1/desktop/config");
      S.appsOrigin = cfg.apps_origin || "";
      S.appsIsolated = !!cfg.apps_isolated;
      S.host = cfg.host || "";
    } catch {}
    await loadWorkspaces();
    await loadProjects();
  } catch (e) {
    /* A bearer-gated gateway is the usual cause; say so plainly rather than
       leaving an empty desktop with no explanation. */
    const w = createWindow({ title: "PasClaw Desktop", width: 380, height: 190, max: false });
    w.body.appendChild(el("p", null, "Could not reach the gateway:"));
    w.body.appendChild(el("p", null, e.message));
    if (e.status === 401) {
      const p = el("p", null, "This gateway requires a token. Set one, then reload:");
      w.body.appendChild(p);
      const row = el("div"); row.style.cssText = "display:flex;gap:4px";
      const inp = el("input", "fld"); inp.type = "password"; inp.style.flex = "1 1 auto";
      const save = el("button", "btn", "Save");
      save.addEventListener("click", () => {
        try { localStorage.setItem(TOKEN_KEY, inp.value.trim()); } catch {}
        location.reload();
      });
      row.appendChild(inp); row.appendChild(save);
      w.body.appendChild(row);
    }
    return;
  }
  paintTree();
}
boot();
</script>
