    let acc = "", touchedApp = false, stopped = false;
    /* The side-channel events of THIS turn, and the throttle that turns
       them plus the accumulated text into markdown + cards while the
       stream is still running. One paint per frame at most: a fast
       tool loop can deliver dozens of deltas between refreshes, and
       re-rendering the bubble for each is work nobody can see. */
    const toolEvents = [];
    let raf = 0;
    const schedulePaint = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        paintAssistant(body, acc, toolEvents);
        log.scrollTop = log.scrollHeight;
      });
    };
    /* Should this turn queue behind another screen's turn, the gateway
       says so (turn-queued, addressed to this client) and the reply
       bubble explains the silence. The first streamed delta paints over
       it. */
    TURN_WAITS.set(sessionId, () => {
      if (!acc) body.textContent =
        "(waiting for another turn on this conversation to finish...)";
    });

    try {
      const t = token();
      const r = await fetch("/v1/chat/completions", {
        method: "POST",
        signal,
        headers: Object.assign(
          { "content-type": "application/json", "accept": "text/event-stream",
            /* Which conversation this turn belongs to. The gateway reads
               it, loads that session, and files the answer back into
               it. */
            "x-pasclaw-session": sessionId },
          /* And which SCREEN sent it (the hello frame's name), so a
             turn-queued notice can address exactly this tab. */
          MY_CLIENT ? { "x-pasclaw-client": MY_CLIENT } : {},
          t ? { authorization: "Bearer " + t } : {}),
        body: JSON.stringify({
          stream: true,
          /* Just the new turn. The rest is already on the server. */
          messages: [{ role: "user", content: text }],
          session_context: true,
          /* What to call this conversation the first time it is filed,
             so the Library lists projects rather than a column of the
             route that made them. */
          session_title: "Desktop: " + project,
          /* The builder prompt goes in the top-level "system" field,
             which the gateway now composes as the LAST section of its
             own prompt.

             Not as a system message in messages[]: that is the shape
             reserved for a third party's persona, and the gateway
             honours it by skipping BuildSystemPrompt entirely -- so
             sending it that way would have cost this conversation the
             workspace context, memory, AGENTS rules, skill catalog and
             tool-use rules it needs to build anything. "Deliverables
             are apps, written here" is a house rule for PasClaw, not a
             different assistant. */
          system: builderPrompt(project),
          /* Plan mode is enforced server-side -- its dispatch gate
             refuses mutating tools -- so "plan before building" is not
             an instruction the model can decide to skip. */
          mode: mode === "plan" ? "plan" : "build",
        }),
      });
      if (!r.ok) {
        /* A turn that never started still has to END -- releasing the
           controller so the button stops reading "Stop" and the next
           Send actually sends.

           The re-send hazard the pre-session-native version of this
           branch also defended against (an unanswered user turn left in
           a client-held history) is gone by construction: the browser
           holds no transcript, and a request the gateway refused was
           never filed, so there is nothing to ask twice. Paint the
           failure and release. */
        body.textContent = `(http ${r.status})`;
        turn.end();
        return;
      }

      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
          if (line.startsWith(":")) {
            /* The gateway's tool side-channel. A write into this project's
               app/ directory is what tells us an artifact appeared -- we
               don't have to ask the model to announce it. */
            const c = line.slice(1).trim();
            if (c.startsWith("pasclaw-tool ")) {
              try {
                const tj = JSON.parse(c.slice("pasclaw-tool ".length));
                /* Keep the full detail: it becomes the body of this
                   call's card. A result arriving without any new text
                   still repaints, so the card fills in the moment the
                   tool comes back rather than at the next delta. */
                toolEvents.push(tj);
                schedulePaint();
                const argstr = JSON.stringify(tj.args || tj.arguments || {});
                if (/projects\/[^"]*\/app\//.test(argstr)) touchedApp = true;
                /* The model's own checklist IS this project's task list.
                   Mirror it as the calls stream by, not at turn end, so
                   the board fills in while the agent is still working. */
                if (tj.t === "call" && tj.name === "todo_write")
                  mirrorChecklist(project, tj.args);
              } catch {}
            }
            continue;
          }
          if (!line.startsWith("data:")) continue;
          const data = line.slice(5).trim();
          if (data === "[DONE]") break;
          try {
            const j = JSON.parse(data);
            const d = (j.choices && j.choices[0] && j.choices[0].delta &&
                       j.choices[0].delta.content) || "";
            if (d) { acc += d; schedulePaint(); }
          } catch {}
        }
      }
    } catch (e) {
      /* Stopping is not an error -- it is the answer to a button press.
         Whatever had already streamed in stays; only the label changes,
         so the transcript reads as a turn cut short rather than one that
         failed on its own. */
      if (isAbort(e)) {
        stopped = true;
        paintAssistant(body, (acc ? acc + "\n\n" : "") + "(stopped)", toolEvents);
      } else {
        paintAssistant(body, (acc ? acc + "\n\n" : "") + "(" + e.message + ")",
                       toolEvents);
      }
    }
    turn.end();
    /* Final paint, synchronously. The streaming paints ride
       requestAnimationFrame, which does not fire in a hidden tab -- a
       turn that finished while the reader was on another window would
       otherwise sit stale until something else repainted it. */
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    /* A stopped turn is still filed, by the gateway, before it closed
       the stream -- the model DID whatever it did before the stop, and
       a transcript that disagrees with the workspace is worse than a
       short one. The client just stops here: no artifact card, no app
       reload, no board sync, because none of those questions were
       answered. */
    if (stopped) return;

    /* Period-native output: if the turn emitted a UI block, show the
       furniture and strip it from the visible text. Unrecognised or
       malformed blocks stay as text -- an answer must never vanish.

       submitText goes WITH the block: a project can have this
       conversation open in three places at once (dock pane, app-window
       pane, floating window), and a dialog's answer belongs to the one
       that asked. Looking the chat
       up by project afterwards would answer whichever home a fixed
       order happened to find first -- the asking conversation would
       never hear back, and another would be handed a reply to a
       question it never asked. */
    const ui = extractUIBlocks(acc);
    if (ui.blocks.length) {
      paintAssistant(body, ui.text, toolEvents);
      ui.blocks.forEach(b => renderUIBlock(b, project, submitText));
    } else {
      paintAssistant(body, acc, toolEvents);
    }
    log.scrollTop = log.scrollHeight;

    /* The loop can stop because it ran out of iterations rather than
       because it finished. The gateway already says so in the reply --
       it appends the notice and sets finish_reason=length -- but the
       notice ends by telling the reader to type "continue", which is a
       worse thing to ask of someone than a button next to the sentence
       that asked for it. */
    if (/hit the tool-call limit of/.test(acc)) addContinueBar();

    /* A plan turn ends with a decision, so the decision gets a button
       rather than an instruction to type "yes". Approving sends the
       build turn into the same session, where the plan already is -- the
       model is not told the plan again, it is told to carry out the one
       above. */
    if (mode === "plan") { planPending = true; addApproveBar(); }

    /* Did this turn leave a runnable app behind? Ask the gateway rather
       than trusting the transcript. */
    try {
      const app = await api("/v1/apps/" + project);
      if (app && app.exists && app.ready) {
        /* Capture the body this turn produced. Best effort: a card without
           it still runs the live app, it just cannot show history. */
        let body = "";
        try {
          const r = await fetch(`/apps/${project}/${app.entry}`);
          if (r.ok) body = await r.text();
        } catch {}
        addArtifact(app.kind, app.name || project, () => openApp(project), body);
        /* The lovable loop: chat on the left, the app RUNNING on the right,
           updated after each turn. A turn that touched the app reloads the
           open app window in place; when there is no window yet -- the
           first build, chatting from the dock -- it opens one WITH the
           chat, which is the moment the conversation moves into its
           permanent home. A turn that touched nothing moves nothing. */
        if (touchedApp && app.servable) {
          const aw = WINS.get("app:" + project);
          if (aw && aw.__reloadApp) {
            /* Held back when the user has unsaved work in the app: the
               window shows an "Updated -- Reload" button instead, and
               the conversation says so rather than leaving the reader
               wondering why the app on the right did not change. */
            if (!aw.__reloadApp())
              addMsg("desktop",
                "The app was rebuilt. Your unsaved changes are still in the " +
                "window, so it has not reloaded -- press Reload when you are " +
                "ready.");
          }
          else openApp(project, { chat: true });
        }
      } else if (touchedApp) {
        addMsg("desktop", "The app was written but has no runnable entry yet.");
      }
    } catch {}
    /* Nothing to file: the gateway already did, before it closed the
       stream. */
    await loadProjects();
    if (S.tree[project]) { await loadTasks(project); paintTree(); }
  }

  /* Named so the turn handler above can hand it to renderUIBlock: an
     answered dialog continues THIS conversation, not one that merely
     shares the project. */
  const submitText = (text, mode) => { ta.value = text; submit(mode); };

  /* The approve gate for a planned app. Only one can be live at a time:
     a second plan turn retires the first bar, because approving a plan
     two turns stale would build something the conversation has already
     moved past. */
  let approveBar = null;
  /* Resume a turn that stopped on the iteration cap. The conversation
     already carries everything, so "continue" is genuinely all it needs
     -- and the notice says the work already done must not be redone,
     which is why this resumes rather than re-sending the request. */
  function addContinueBar() {
    const bar = el("div", "artifact");
    const g = el("div", "ico"); g.innerHTML = icon("app");
    bar.appendChild(g);
    const meta = el("div", "meta");
    meta.appendChild(el("div", "nm", "Stopped at the tool-call limit"));
    meta.appendChild(el("div", "kd", "It was still working when it ran out"));
    bar.appendChild(meta);
    const go = el("button", "btn", "Continue");
    go.addEventListener("click", () => {
      bar.remove();
      submitText("continue");
    });
    bar.appendChild(go);
    log.appendChild(bar);
    log.scrollTop = log.scrollHeight;
  }

  function addApproveBar() {
    if (approveBar) approveBar.remove();
    const bar = el("div", "artifact");
    approveBar = bar;
    const g = el("div", "ico"); g.innerHTML = icon("page");
    bar.appendChild(g);
    const meta = el("div", "meta");
    meta.appendChild(el("div", "nm", "Plan -- nothing built yet"));
    meta.appendChild(el("div", "kd",
      "Ask for changes, or approve to start building"));
    bar.appendChild(meta);
    const go = el("button", "btn", "Approve & build");
    go.addEventListener("click", () => {
      if (approveBar === bar) approveBar = null;
      bar.remove();
      /* The one place plan mode is left, and it takes a click to do it. */
      planPending = false;
      submitText("Approved -- build it. Follow the plan above; if you hit " +
                 "something it did not anticipate, say so rather than " +
                 "quietly doing something else.", "build");
    });
    bar.appendChild(go);
    log.appendChild(bar);
    log.scrollTop = log.scrollHeight;
  }

  /* Bare calls: the click event would otherwise arrive as submit's mode
     argument, and an Event is not "plan". */
  /* One button, two jobs: Send while idle, Stop while a turn runs.

     The KEY has a third: Enter with text in the box while a turn runs
     steers it. "Also make the header blue", typed mid-build, used to
     stop the build it was amending -- the worst possible reading of an
     addendum. /v1/steer injects the note into the running loop (the
     next iteration sees it); the transcript shows it arrow-marked, and
     the gateway files it with the turn. Enter on an empty box still
     stops, so the keyboard-only path to Stop survives. */
  const steerOrStop = async () => {
    const text = ta.value.trim();
    if (turn.running && text) {
      ta.value = "";
      addMsg("you", "\u21b3 " + text, "u");
      try {
        await api("/v1/steer", { method: "POST",
          headers: { "x-pasclaw-session": sessionId },
          body: { text } });
      } catch (e) { addMsg("desktop", "(steer failed: " + e.message + ")"); }
      return;
    }
    if (!turn.stop()) submit();
  };
  send.addEventListener("click", () => { if (!turn.stop()) submit(); });
  ta.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); steerOrStop(); }
  });
  /* The load has to WIN, not merely start.

     The stored order is now the server's to keep, so an early Send can
     no longer corrupt it. What it can still do is misread: the replay
     would paint the older turns UNDER a question already on screen, so
     the window shows an answer above what it answered. The composer is
     disabled until the replay lands, and submit awaits it as well: the
     disable is what the user sees, the await is what makes it true for
     a programmatic submitText that never touches the field. */
  ta.disabled = true;
  send.disabled = true;
  const ready = loadHistory()
    .catch(() => {})
    .then(() => { ta.disabled = false; send.disabled = false; });

  return {
    root: wrap,
    submitText,
    focus: () => ta.focus(),
  };
}

/* The builder-mode overlay. Kept client-side for now so it is visible and
   editable next to the UI that depends on it; the plan moves it into a
   shipped skill (skills/app-factory) so it becomes promptware. */
/* Per-style personality. The plan's idea: a desktop that looks like System 6
   should not answer like a 2020s chatbot. This costs nothing -- it is a
   sentence appended to the system prompt -- and it is what makes the style
   picker feel like it changes the machine rather than the paint. */
const STYLE_VOICE = {
  AppleSystem: "Answer the way a 1984 Macintosh would: few words, plain " +
    "nouns, no exclamation. The machine is polite and very small.",
  MacOS9:      "Answer warmly and briefly, like Mac OS 9 Help.",
  Win31:       "Answer like a Windows 3.1 manual: numbered, literal, dry.",
  Win95:       "Answer like a Windows 95 wizard: short steps, plain language.",
  Win98:       "Answer like a Windows 98 wizard: short steps, plain language.",
  NeXTSTEP:    "Answer precisely and technically, like NeXTSTEP documentation.",
  BeOS:        "Answer briskly and a little playfully, like BeOS release notes.",
  Amiga13:     "Answer tersely, like an Amiga Workbench requester.",
  Amiga20:     "Answer tersely, like an Amiga Workbench requester.",
  GEM:         "Answer in very few words, like a GEM desk accessory.",
  Synthwave:   "Answer with a little neon swagger -- brief, confident, " +
    "never purple. You are a 1984 that never happened.",
  Phosphor:    "Answer like an amber terminal: terse, monospaced in spirit, " +
    "no decoration.",
  ClaudeCode:     "Answer plainly and concisely, like a good CLI.",
  ClaudeCodeDark: "Answer plainly and concisely, like a good CLI.",
};

function builderPrompt(project) {
  const voice = STYLE_VOICE[S.style];
  return [
    `You are working inside the PasClaw Desktop project "${project}".`,
    `Deliverables are APPS, not essays. When the user asks for something,`,
    `build it as software they can open in a window.`,
    ``,
    `Write the app into projects/${project}/app/ inside the workspace, and`,
    `maintain projects/${project}/app/app.json:`,
    `  {"name":"...","kind":"page|html|python","entry":"index.html",`,
    `   "window":{"width":640,"height":480}}`,
    `Choose the lightest kind that works: "page" (a static document, no`,
    `scripts) then "html" (a self-contained page WITH scripts) then "python".`,
    `An html app persists data through the desktop's SDK. Include it and use`,
    `the two calls -- do NOT fetch the API directly, the app is sandboxed and`,
    `the call will be blocked:`,
    /* The closing tag is split: a literal </' + 'script> inside this file's
       own <script> element would end it and break the page. */
    "  <script src=\"pasclaw.js\"><\/script>",
    `  await pasclaw.setJSON("books", list);`,
    `  const list = await pasclaw.getJSON("books", []);`,
    `The app may not reach any other origin -- and that includes its LOOKS.`,
    `The serving CSP blocks every off-origin URL: CDN scripts, stylesheets,`,
    `fonts and images all silently fail to load. An app styled from`,
    `cdn.tailwindcss.com or Google Fonts renders as bare unstyled HTML.`,
    `So the page must be SELF-CONTAINED: write your own CSS in a <style>`,
    `block, use system font stacks, and draw icons as inline SVG or`,
    `unicode. No Tailwind CDN, no FontAwesome, no fonts.googleapis.com,`,
    `no <script src> or <link href> pointing off the page except the`,
    `pasclaw.js line above.`,
    `If a real library or font is genuinely needed, VENDOR it: download`,
    `the file into the app directory with web_fetch`,
    `(save_to=projects/${project}/app/vendor/<file>) and reference it`,
    `relatively (<script src="vendor/chart.js">). Same-origin files are`,
    `served and the sandbox allows them. Prefer inline over vendored,`,
    `vendored over nothing at all -- and keep vendored files small and`,
    `few; never hot-link.`,
    ``,
    `Keep the board current with the project and task tools as you work:`,
    `create tasks for the steps, and report each job when it finishes.`,
    `Be brief in chat -- the app is the answer.`,
    ``,
    `THIS DESKTOP RENDERS STRUCTURED OUTPUT AS REAL UI. When you would`,
    `otherwise write a numbered plan, emit a fenced block instead and the`,
    `user gets a wizard whose Next button approves each step (and whose`,
    `Finish turns the steps into tasks on the board):`,
    "```pasclaw-ui",
    `{"ui":"wizard","title":"Plan","steps":[{"title":"...","body":"..."}]}`,
    "```",
    `When you need a decision, ask with buttons rather than prose -- the`,
    `chosen label comes back as the user's next message:`,
    "```pasclaw-ui",
    `{"ui":"ask","text":"Use IMAP or the Gmail API?",`,
    ` "buttons":[{"label":"IMAP","value":"IMAP"},{"label":"Gmail API","value":"Gmail API"}]}`,
    "```",
    `Use these sparingly and only when they fit; ordinary prose is fine.`,
    voice ? `` : ``,
    voice ? `VOICE: ${voice}` : ``,
  ].filter(l => l !== null && l !== undefined).join("\n");
}

/* ==========================================================================
   Period-native agent output

   The §0 idea, made concrete: the agent does not answer a plan with a
   markdown list, it answers with a WIZARD whose pages are the steps and
   whose Next button is your approval. A question is a message box with real
   buttons. Work in progress is the progress dialog with the chunky bar.

   These are ordinary desktop windows built from the same palette, so they
   look native in all 27 styles. They are driven from the chat stream: the
   client recognises structured output (a fenced ```pasclaw-ui block, or a
   plan the model wrote through plan_write) and renders furniture instead of
   text. Anything it does not recognise stays plain text -- an unrecognised
   answer must never disappear.
   ========================================================================== */

/* A wizard. Steps is an array of {title, body}; onFinish gets the step list
   back so the caller can turn approved steps into tasks. */
function showWizard(opts) {
  const steps = (opts.steps || []).filter(Boolean);
  if (!steps.length) return null;
  let i = 0;

  const w = createWindow({
    title: opts.title || "Wizard", width: 460, height: 320,
    icon: "page", max: false, pad: false,
  });
  const wrap = el("div", "wizard");
  const page = el("div", "page");
  const foot = el("div", "foot");
  const back = el("button", "btn", "< Back");
  const next = el("button", "btn", "Next >");
  const cancel = el("button", "btn", "Cancel");
  foot.appendChild(back); foot.appendChild(next); foot.appendChild(cancel);
  wrap.appendChild(page); wrap.appendChild(foot);
  w.body.appendChild(wrap);
  w.body.style.padding = "3px";

  function paint() {
    page.textContent = "";
    page.appendChild(el("div", "side"));
    const st = steps[i];
    page.appendChild(el("h3", null, st.title || `Step ${i + 1}`));
    if (st.body) page.appendChild(el("p", null, st.body));
    /* The overview list doubles as the plan: you can see the whole shape
       while you approve one step at a time. */
    const ol = el("ol", "steps");
    steps.forEach((s2, n) => {
      const li = el("li", n === i ? "cur" : null, s2.title || `Step ${n + 1}`);
      ol.appendChild(li);
    });
    page.appendChild(ol);
    back.disabled = i === 0;
    next.textContent = i === steps.length - 1 ? "Finish" : "Next >";
    setTitle(w, `${opts.title || "Wizard"} -- step ${i + 1} of ${steps.length}`);
  }
  back.addEventListener("click", () => { if (i > 0) { i--; paint(); } });
  next.addEventListener("click", () => {
    if (i < steps.length - 1) { i++; paint(); return; }
    closeWindow(w);
    if (opts.onFinish) opts.onFinish(steps);
  });
  cancel.addEventListener("click", () => closeWindow(w));
  paint();
  return w;
}

/* A message box. buttons is an array of {label, value}; onPick gets the
   value. Kind picks the glyph: info | warn | stop | ask. */
function showMessage(opts) {
  const w = createWindow({
    title: opts.title || "Message", width: 360, height: 168,
    icon: "page", max: false, min: false, pad: false,
  });
  const box = el("div", "msgbox");
  const ico = el("div", "ico");
  ico.innerHTML = MSG_ICONS[opts.kind] || MSG_ICONS.info;
  box.appendChild(ico);
  box.appendChild(el("div", "text", opts.text || ""));
  w.body.appendChild(box);

  const foot = el("div", "msgfoot");
  const buttons = opts.buttons || [{ label: "OK", value: true }];
  buttons.forEach((b, n) => {
    const btn = el("button", "btn", b.label);
    btn.style.minWidth = "78px";
    btn.addEventListener("click", () => {
      closeWindow(w);
      if (opts.onPick) opts.onPick(b.value);
    });
    foot.appendChild(btn);
    if (n === 0) setTimeout(() => btn.focus(), 0);
  });
  w.body.appendChild(foot);
  return w;
}

const MSG_ICONS = {
  info: `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="var(--titlea)"
    stroke="var(--darkshadow)"/><text x="16" y="23" text-anchor="middle"
    font-size="19" font-weight="bold" fill="var(--titleatext)">i</text></svg>`,
  ask: `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="var(--titlea)"
    stroke="var(--darkshadow)"/><text x="16" y="24" text-anchor="middle"
    font-size="20" font-weight="bold" fill="var(--titleatext)">?</text></svg>`,
  warn: `<svg viewBox="0 0 32 32"><path d="M16 3 L30 28 H2 Z" fill="#ffd700"
    stroke="var(--darkshadow)"/><text x="16" y="26" text-anchor="middle"
    font-size="18" font-weight="bold" fill="#000">!</text></svg>`,
  stop: `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="#c00"
    stroke="var(--darkshadow)"/><rect x="7" y="13" width="18" height="6" fill="#fff"/></svg>`,
};

/* The progress dialog. Returns a handle with .set(pct, what) and .done(). */
function showProgress(opts) {
  const w = createWindow({
    title: opts.title || "Working", width: 340, height: 150,
    icon: "page", max: false, pad: false,
  });
  const box = el("div", "prog");
  box.appendChild(el("div", null, opts.text || "Working..."));
  const bar = el("div", "bar");
  const fill = el("div", "fill");
  fill.style.width = "0%";
  bar.appendChild(fill);
  box.appendChild(bar);
  const what = el("div", "what", "");
  box.appendChild(what);
  w.body.appendChild(box);
  return {
    window: w,
    set(pct, note) {
      fill.style.width = Math.max(0, Math.min(100, pct)) + "%";
      if (note != null) what.textContent = note;
    },
    done() { try { closeWindow(w); } catch {} },
  };
}

/* ---- recognising structured output in a chat reply ----

   The contract is deliberately tiny and optional: a fenced block

     ```pasclaw-ui
     {"ui":"wizard","title":"Plan","steps":[{"title":"..","body":".."}]}
     ```

   renders as furniture. Everything outside the block stays visible as text,
   so a model that ignores the convention loses nothing, and a malformed
   block degrades to the raw text rather than vanishing. */
function extractUIBlocks(text) {
  const out = { text: text, blocks: [] };
  const re = /```pasclaw-ui\s*([\s\S]*?)```/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    try {
      const obj = JSON.parse(m[1]);
      if (obj && obj.ui) out.blocks.push(obj);
    } catch { continue; }   /* malformed: leave it as visible text */
  }
  if (out.blocks.length)
    out.text = text.replace(re, (whole, body) => {
      try { JSON.parse(body); return ""; } catch { return whole; }
    }).trim();
  return out;
}

/* Render one recognised block. Project is passed so a wizard's approved
   steps can become real tasks on that project's board. */
/* Reply is the submitText of the conversation that EMITTED this block --
   passed in rather than looked up, because a project can have several
   chat homes open at once and only one of them asked. */
function renderUIBlock(block, project, reply) {
  if (block.ui === "wizard") {
    return showWizard({
      title: block.title || "Plan",
      steps: block.steps || [],
      onFinish: async steps => {
        if (!project) return;
        /* Approving a plan is what creates the tasks. That is the whole
           gesture: Next, Next, Finish -> a board. */
        for (const st of steps) {
          try {
            await api(`/v1/projects/${project}/tasks`, {
              method: "POST",
              body: { title: st.title || "Step", notes: st.body || "" },
            });
          } catch {}
        }
        await loadProjects();
        if (S.tree[project]) { await loadTasks(project); paintTree(); }
        showMessage({
          title: "Plan accepted", kind: "info",
          text: `${steps.length} task(s) added to ${project}.`,
        });
      },
    });
  }
  if (block.ui === "message" || block.ui === "ask") {
    return showMessage({
      title: block.title || "PasClaw",
      kind: block.kind || (block.ui === "ask" ? "ask" : "info"),
      text: block.text || "",
      buttons: block.buttons || [{ label: "OK", value: true }],
      onPick: v => {
        /* An answered question goes back as the next chat turn, so the
           conversation continues exactly where the dialog left off. No
           reply callback means nothing asked (a block rendered outside a
           turn), and staying silent beats guessing at a conversation. */
        if (block.reply === false || !reply) return;
        reply(String(v));
      },
    });
  }
  return null;
}

/* ==========================================================================
   App windows

   The state broker. App iframes are sandboxed WITHOUT allow-same-origin, so
   they cannot call the gateway themselves -- if they could, they would also
   be same-origin with this page and able to read the operator's token. So
   they post a message here and we make the call on their behalf, scoped to
   the project whose window the message actually came from. An app cannot
   name another project: we ignore what it claims and use the mapping from
   its own contentWindow.
   ========================================================================== */

const FRAME_PROJECT = new Map();   /* contentWindow -> project slug */

/* Projects whose app has unsaved work in it.

   An app window is reloaded when a chat turn changes the app -- that is
   the live-preview half of the build loop -- and a reload throws the
   frame away with whatever the user had typed into it. The host cannot
   look: apps are cross-origin and sandboxed on purpose. So the SDK tells
   it, marking dirty on the first keystroke and clean again when the app
   persists through pasclaw.set. */
const APP_DIRTY = new Set();

window.addEventListener("message", async ev => {
  const m = ev.data;
  if (m && m.__pasclaw === "dirty") {
    const p = FRAME_PROJECT.get(ev.source);
    if (!p) return;
    if (m.dirty) APP_DIRTY.add(p); else APP_DIRTY.delete(p);
    const w = WINS.get("app:" + p);
    if (w && w.__dirtyChanged) w.__dirtyChanged(!!m.dirty);
    return;
  }
  if (!m || m.__pasclaw !== "state") return;
  const project = FRAME_PROJECT.get(ev.source);
  const reply = (payload) => {
    try { ev.source.postMessage(Object.assign({ __pasclaw: "reply", id: m.id }, payload), "*"); }
    catch {}
  };
  if (!project) { reply({ error: "unknown app frame" }); return; }
  const key = String(m.key || "");
  const url = `/v1/apps/${encodeURIComponent(project)}/state/${encodeURIComponent(key)}`;
  try {
    if (m.op === "get") {
      const j = await api(url);
      reply({ value: j.exists ? j.value : null });
    } else if (m.op === "set") {
      await api(url, { method: "PUT", body: String(m.value == null ? "" : m.value),
                       headers: { "content-type": "text/plain" } });
      reply({ value: true });
    } else if (m.op === "del") {
      await api(url, { method: "DELETE" });
      reply({ value: true });
    } else if (m.op === "action") {
      /* The arg rides as the body. We forward it verbatim -- the allowlist
         and the argument validation both live on the server, so the broker
         has no opinion to add and no chance to get one wrong. */
      const j = await api(`/v1/apps/${encodeURIComponent(project)}/action/` +
                          encodeURIComponent(String(m.key || "")),
                          { method: "POST", body: m.value || "" });
      reply({ value: j });
    } else if (m.op === "read") {
      /* The allowlist lives on the server; we just forward the name so an
         app cannot reach past it by talking to us instead. */
      const j = await api(`/v1/apps/${encodeURIComponent(project)}/read/` +
                          encodeURIComponent(String(m.key || "")) +
                          (m.value ? "?q=" + encodeURIComponent(String(m.value)) : ""));
      reply({ value: j.items || [] });
    } else {
      reply({ error: "unknown op" });
    }
  } catch (e) {
    reply({ error: e.message });
  }
});

async function openApp(project, opts) {
  let app;
  try { app = await api("/v1/apps/" + project); }
  catch (e) { alert(e.message); return; }
  if (!app.exists) { alert("This project has no app yet."); return; }
  if (!app.servable) {
    /* A process kind. It does not render in a window -- it RUNS, on the
       machine the gateway is on. That distinction matters enough to have its
       own window rather than an alert. */
    openProcessApp(project, app);
    return;
  }
  /* Already open: createWindow hands back the live window rather than a
     fresh one, and everything below BUILDS the window's contents -- running
     it again would stack a second app frame and a second chat pane inside
     the same body. Checked before the permission prompt too, so raising an
     open app never re-asks a question already answered. */
  const live = WINS.get("app:" + project);
  if (live) {
    restoreWindow(live); focusWindow(live);
    if (opts && opts.chat && live.__showChat) live.__showChat();
    return live;
  }

  /* Declared permissions are shown before the app is opened, not buried in
     a manifest the user will never read. */
  if (app.network) {
    if (!confirm(`"${app.name}" declares network access to:\n  ${app.network}\n\nOpen it?`)) return;
  }

  const w = createWindow({
    key: "app:" + project, title: app.name || project,
    width: app.width || 640, height: (app.height || 480) + 26,
    icon: "app", pad: false,
    restore: { fn: "app", arg: project },
  });
  const frame = el("iframe", "app");
  /* The app is model-authored code. Sandboxed here AND served under a CSP by
     the gateway -- neither alone is enough: the sandbox stops it reaching
     this page's DOM and the operator's token, the CSP stops it reaching the
     network. Persistence goes through the broker above instead. */
  frame.setAttribute("sandbox", "allow-scripts allow-forms");
  frame.addEventListener("load", () => {
    if (frame.contentWindow) FRAME_PROJECT.set(frame.contentWindow, project);
  });
  frame.src = appURL(project) + "?t=" + Date.now();

  /* [chat][grip][app]: the editing conversation lives INSIDE the app
     window, on the left, hidden until asked for. The app is the thing
     being made; the chat is how it changes; putting a wall of window
     management between them was friction with no compensating clarity. */
  const split = el("div", "appsplit");
  const side = el("div", "appside");
  side.style.display = "none";
  const grip = el("div", "appgrip");
  grip.style.display = "none";
  split.appendChild(side); split.appendChild(grip); split.appendChild(frame);
  w.body.appendChild(split);

  /* Drag the grip to resize the pane. The iframe eats mouse events, so it
     goes pointer-inert for the duration of the drag. */
  grip.addEventListener("mousedown", e => {
    e.preventDefault();
    const x0 = e.clientX, w0 = side.offsetWidth;
    frame.style.pointerEvents = "none";
    const move = ev => { side.style.width = Math.max(180, w0 + ev.clientX - x0) + "px"; };
    const up = () => {
      frame.style.pointerEvents = "";
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });
  /* Register the frame NOW, not on load: the SDK inside the app posts its
     first state read while the document is still parsing, which is before
     the load event fires. Registering late loses that first request. */
  if (frame.contentWindow) FRAME_PROJECT.set(frame.contentWindow, project);
  w.onClose = () => {
    if (frame.contentWindow) FRAME_PROJECT.delete(frame.contentWindow);
  };

  const bar = el("div", "statusbar thin");
  const reload = el("button", "btn", "Reload");
  const doReload = () => {
    APP_DIRTY.delete(project);
    setUpdated(false);
    frame.src = appURL(project) + "?t=" + Date.now();
    if (frame.contentWindow) FRAME_PROJECT.set(frame.contentWindow, project);
  };
  /* Clicking Reload is a decision, so it just reloads -- but it says what
     it costs when there is something to lose. */
  reload.addEventListener("click", () => {
    if (APP_DIRTY.has(project) &&
        !confirm("Reload the app?\n\nYou have unsaved changes in it, and " +
                 "reloading discards them.")) return;
    doReload();
  });
  bar.appendChild(reload);

  /* "The app changed" -- shown instead of reloading over someone's work. */
  const updated = el("button", "btn", "Updated — Reload");
  updated.title = "This app was rebuilt. Reload to see the new version.";
  updated.style.display = "none";
  updated.addEventListener("click", doReload);
  bar.appendChild(updated);
  function setUpdated(on) { updated.style.display = on ? "" : "none"; }
  w.__dirtyChanged = () => {};

  /* The live-preview half of the build loop -- but NOT over unsaved work.

     A finished chat turn that changed the app refreshes this window in
     place, which is what makes "chat on the left, the app updating on the
     right" feel live. The reload destroys the frame though, so when the
     user has typed something the app has not persisted, the update is
     OFFERED rather than applied: the button appears, the typing survives,
     and the reload happens when they say so. Nothing is lost silently,
     and nobody has to notice a subtlety to keep their work. */
  w.__reloadApp = () => {
    if (APP_DIRTY.has(project)) { setUpdated(true); return false; }
    doReload();
    return true;
  };
  const chat = el("button", "btn", "Chat");
  chat.title = "Edit this app by asking -- the conversation docks on the left";
  /* Reveal moves the project's ONE chat in here; hide leaves it parked in
     the pane, still live, still streaming if a turn is running. */
  /* Revealing the dock GROWS the window; it does not shrink the app.

     The dock is a fixed-width column inside the same window, so docking
     it used to come straight out of the app's own viewport: a 380x260
     app opened with the chat showing got 109px of width -- 71% of what
     it asked for -- and rendered clipped. The app's declared width is
     the one thing in that layout the desktop has no right to overrule,
     so the window widens by what the dock and grip take and the frame
     keeps its size. Hiding the dock gives the width back.

     Clamped to the viewport, since a wide app plus a dock can exceed the
     screen -- and a window wider than the desktop is a worse outcome
     than a narrower app. */
  const dockWidth = () =>
    Math.round(side.getBoundingClientRect().width +
               grip.getBoundingClientRect().width);
  /* How much room the window actually has: the STAGE, not the viewport.
     While the projects dock is showing, #stage starts to the right of it
     and clips what overflows -- so measuring against window.innerWidth
     would grow the window under the dock's own edge and clip exactly the
     side this is meant to protect. Measured from the window's left edge,
     since that is where its width is spent from. */
  const roomForWindow = () => {
    const stage = desktopRect();
    return Math.max(200, Math.round(
      stage.right - w.node.getBoundingClientRect().left - 8));
  };
  /* Remember what the dock actually cost, which is NOT always dockWidth:
     a window already at the stage's edge grows by less, or not at all,
     and giving back the full dock width would shrink the app a little
     more on every show/hide cycle until it was unusable. */
  let dockGrowth = 0;
  const showChat = () => {
    const was = side.style.display !== "none";
    side.style.display = "flex";
    grip.style.display = "";
    showChatIn(project, side).focus();
    if (!was) {
      const before = w.node.offsetWidth;
      w.node.style.width =
        Math.min(before + dockWidth(), roomForWindow()) + "px";
      dockGrowth = Math.max(0, w.node.offsetWidth - before);
    }
  };
  chat.addEventListener("click", () => {
    if (side.style.display !== "none") {
      const give = dockGrowth;
      dockGrowth = 0;
      side.style.display = "none"; grip.style.display = "none";
      w.node.style.width = Math.max(200, w.node.offsetWidth - give) + "px";
      /* Handing it back to the dock rather than parking it here keeps the
         "one place at a time" rule true while the pane is hidden. */
      if (S.dockProject === project) paintTree();
      return;
    }
    showChat();
  });
  /* The dock asks this before deciding whether to host the chat itself;
     openApp calls showChat when raising an already-open window. */
  w.__chatShown = () => side.style.display !== "none";
  w.__showChat = showChat;
  bar.appendChild(chat);
  bar.appendChild(el("span", "muted", app.kind + (app.network ? " -- net: " + app.network : "")));
  w.node.appendChild(bar);

  /* Closing this window must not close the conversation. The chat is
     re-parented out of the doomed pane and back to the dock, which is
     where it lives when no app window is open -- so reopening the app
     finds the same transcript rather than a blank one.

     The repaint is DEFERRED because closeWindow fires onClose before it
     removes the window from WINS. Repainting inline, the dock would
     still find this window there, still ask __chatShown (true, the pane
     was never hidden), and render the "conversation is in the app
     window" placeholder -- pointing a Show it button at a window that no
     longer exists, with the chat stranded in the detached pane until
     something else happened to repaint. One turn of the event loop is
     all it takes for the close to have finished. */
  const priorClose = w.onClose;
  w.onClose = () => {
    if (priorClose) { try { priorClose(); } catch {} }
    setTimeout(() => { if (S.dockProject === project) paintTree(); }, 0);
  };

  if (opts && opts.chat) showChat();
  return w;
}

/* A process app: python / fpc / delphi. These are not documents, so there is
   nothing to render -- the window is a control panel. It states plainly WHERE
   the process runs, because the desktop metaphor otherwise implies "here",
   and with a remote gateway that is wrong. */
async function openProcessApp(project, app) {
  /* Reopen guard: the panel polls and holds run state; a rebuild would
     stack a second control bar and log over the first. */
  const alreadyProc = WINS.get("proc:" + project);
  if (alreadyProc) {
    restoreWindow(alreadyProc); focusWindow(alreadyProc);
    return alreadyProc;
  }
  const w = createWindow({
    key: "proc:" + project, title: (app.name || project) + " -- Run",
    width: 520, height: 340, icon: "app", pad: false,
  });

  const head = el("div");
  head.style.cssText = "padding:6px 6px 0";
  head.appendChild(el("div", null, `${app.name || project}  [${app.kind}]`));
  /* Three places an app can run, and the user should never have to guess
     which. A remote daemon is the one that surprises people: the app's
     files and ports are on a machine that is neither this browser nor the
     gateway. */
  const remoteDocker = (app.run_backend === "docker-remote");
  const inDocker = (app.run_backend === "docker") || remoteDocker;
  const where = el("div", "muted",
    (remoteDocker ? "Runs in a container on a remote Docker host"
     : inDocker   ? "Runs in a container on the PasClaw host"
                  : "Runs as a process on the PasClaw host") +
    (!remoteDocker && S.host ? `: ${S.host}` : ""));
  head.appendChild(where);
  if (remoteDocker)
    head.appendChild(el("div", "muted",
      "Its files are copied in, not mounted, and it cannot publish a port " +
      "back to this machine \u2014 console apps only."));
  if (!inDocker)
    head.appendChild(el("div", "muted",
      "Set shell_backend to \"docker\" to run apps in a container instead."));
  const cmd = el("div", "muted", "");
  cmd.style.cssText = "font-family:monospace;word-break:break-all;margin-top:3px";
  head.appendChild(cmd);
  if (app.network) head.appendChild(el("div", "muted", "declares network: " + app.network));
  if (app.env) head.appendChild(el("div", "muted",
    "expects env: " + app.env + "  (put these in the project's app/.env)"));
  w.body.appendChild(head);

  const bar = el("div");
  bar.style.cssText = "display:flex;gap:4px;padding:6px";
  const runBtn = el("button", "btn", "Run");
  const stopBtn = el("button", "btn", "Stop");
  const openBtn = el("button", "btn", "Open");
  openBtn.disabled = true;
  const state = el("span", "muted", "");
  state.style.cssText = "align-self:center;margin-left:6px";
  bar.appendChild(runBtn); bar.appendChild(stopBtn);
  bar.appendChild(openBtn); bar.appendChild(state);
  w.body.appendChild(bar);

  const log = el("div", "log in");
  log.style.cssText = "margin:0 6px 6px;height:calc(100% - 132px);" +
                      "white-space:pre-wrap;font-family:monospace;font-size:11px";
  w.body.appendChild(log);

  let url = null;
  function render(info) {
    state.textContent = info.state + (info.port ? `  port ${info.port}` : "");
    cmd.textContent = info.command || app.run_command || "";
    runBtn.disabled = info.state === "running";
    stopBtn.disabled = info.state !== "running";
    url = info.url || (info.port ? `http://127.0.0.1:${info.port}/` : null);
    openBtn.disabled = !url;
  }

  async function refresh() {
    try {
      const m = await api("/v1/apps/" + project);
      render({ state: m.run_state || "stopped", port: m.run_port || 0,
               command: m.run_command, url: m.run_url });
      const l = await api(`/v1/apps/${project}/runlog`);
      const atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
      log.textContent = l.log || "";
      if (atEnd) log.scrollTop = log.scrollHeight;
    } catch {}
  }

  runBtn.addEventListener("click", async () => {
    runBtn.disabled = true;
    try {
      /* First ask WITHOUT confirm: the gateway answers 409 with the exact
         command, which is what we show the user. Consent to a hidden command
         is not consent. */
      let planned = app.run_command || "";
      try {
        await api(`/v1/apps/${project}/run`, { method: "POST", body: {} });
      } catch (e) {
        if (e.status === 409 && e.detail && e.detail.command) planned = e.detail.command;
      }
      const lines = [
        `Run this app?`, ``,
        `  ${planned || "(command unknown)"}`, ``,
        S.host ? `It runs on the PasClaw host (${S.host}), not necessarily on this machine.`
               : `It runs on the PasClaw host, not necessarily on this machine.`,
      ];
      if (app.network) lines.push(``, `It declares network access to: ${app.network}`);
      lines.push(``, remoteDocker
        ? `It runs inside a container on a REMOTE Docker host; its files are copied there.`
        : inDocker
        ? `It runs inside a container; only its app/ directory is mounted.`
        : `It runs directly on that machine, with the same reach you have.`);
      if (!confirm(lines.join("\n"))) { runBtn.disabled = false; return; }
      const info = await api(`/v1/apps/${project}/run`,
                            { method: "POST", body: { confirm: true } });
      render(info);
      /* An app that serves HTTP is worth opening straight away. */
      if (info.url) openBtn.click();
    } catch (e) {
      log.textContent += "\n" + e.message;
    }
    refresh();
  });

  stopBtn.addEventListener("click", async () => {
    try { await api(`/v1/apps/${project}/stop`, { method: "POST" }); } catch (e) {}
    refresh();
  });

  openBtn.addEventListener("click", () => {
    if (!url) return;
    /* A process app that serves HTTP gets a browser window like any page.
       It is NOT sandboxed as an app frame -- it is a server the user chose
       to run, on a port only they can reach. Reopening points the existing
       frame at the (possibly new) url rather than stacking another. */
    const live = WINS.get("procview:" + project);
    if (live) {
      restoreWindow(live); focusWindow(live);
      const lf = live.body.querySelector("iframe");
      if (lf && lf.src !== url) lf.src = url;
      return;
    }
    const v = createWindow({
      key: "procview:" + project, title: (app.name || project),
      width: app.width || 640, height: (app.height || 480) + 8,
      icon: "globe", pad: false,
    });
    const f = el("iframe", "app");
    f.src = url;
    v.body.appendChild(f);
  });

  await refresh();
  const timer = setInterval(refresh, 3000);
  w.onClose = () => clearInterval(timer);
  return w;
}

/* ==========================================================================
   Job log
   ========================================================================== */

async function openJobLog(project, task, job) {
  /* Reopen guard: the existing window is already polling this job. */
  const already = WINS.get(`job:${project}:${task}:${job}`);
  if (already) { restoreWindow(already); focusWindow(already); return already; }
  const w = createWindow({
    key: `job:${project}:${task}:${job}`,
    title: `${project} ${task}/${job}`, width: 520, height: 300, icon: "page", pad: false,
  });
  const pre = el("div", "log in");
  pre.style.whiteSpace = "pre-wrap";
  pre.style.fontFamily = "monospace";
  w.body.appendChild(pre);
  w.body.style.padding = "3px";
  let stop = false;
  w.onClose = () => { stop = true; };
  async function poll() {
    if (stop) return;
    try {
      const j = await api(`/v1/projects/${project}/tasks/${task}/jobs/${job}/log`);
      const at = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 4;
      pre.textContent = j.log || "(no output yet)";
      if (at) pre.scrollTop = pre.scrollHeight;
    } catch {}
    if (!stop) setTimeout(poll, 2000);
  }
  poll();
  return w;
}

/* ==========================================================================
   Browser -- search that returns a page
   ========================================================================== */

function openBrowser(pageId, initialQuery, initialKind) {
  /* Already open: navigate the live window instead of rebuilding into it.
     createWindow hands back the existing window for a repeated key, and
     everything below APPENDS -- so a second call used to stack a second
     toolbar and iframe into the same body, with the page loading into the
     hidden lower frame while the visible one stayed blank. The same guard
     openApp documents, applied here. */
  const already = WINS.get("browser");
  if (already) {
    restoreWindow(already); focusWindow(already);
    if (pageId && already.__showPageId) already.__showPageId(pageId);
    else if (initialQuery && already.__ask) already.__ask(initialQuery, initialKind);
    return already;
  }
  const w = createWindow({ key: "browser", title: "Browser", width: 620, height: 460,
                           icon: "globe", pad: false,
                           restore: { fn: "browser", arg: pageId || "" } });
  const bar = el("div");
  bar.style.cssText = "display:flex;gap:4px;padding:3px";
  const q = el("input", "fld");
  q.type = "text";
  q.placeholder = "Ask anything -- the answer comes back as a page";
  q.style.flex = "1 1 auto";
  const go = el("button", "btn", "Search");
  /* Deep research is a different act, so it gets a different button rather
     than a checkbox nobody finds: plan the sub-questions, read several
     independent sources, then synthesise. It takes minutes, which is why it
     narrates. */
  const deep = el("button", "btn", "Research");
  deep.title = "Plan, read several sources, and write a longer sourced report";
  /* The promotion gesture. A page is a document; this is the one click that
     turns it into software you own -- the plan's whole pitch in miniature.
     Disabled until there is a page to promote. */
  const mk = el("button", "btn", "Make interactive");
  mk.title = "Copy this page into a project as an app you can change";
  mk.disabled = true;
  bar.appendChild(q); bar.appendChild(go); bar.appendChild(deep); bar.appendChild(mk);
  w.body.appendChild(bar);

  const frame = el("iframe", "app");
  frame.setAttribute("sandbox", "allow-same-origin");
  frame.style.height = "calc(100% - 30px)";
  w.body.appendChild(frame);

  const status = el("div", "statusbar thin");
  w.node.appendChild(status);

  let current = null;

  function show(page) {
    current = page;
    mk.disabled = false;
    frame.src = "/pages/" + page.id + "/";
    setTitle(w, page.title || "Browser");
    status.textContent = "";
    const n = page.source_count != null ? page.source_count : (page.sources || []).length;
    status.appendChild(el("span", n ? "grounded" : "ungrounded",
      n ? `GROUNDED -- ${n} source${n === 1 ? "" : "s"}` : "UNGROUNDED -- no sources"));
  }

  async function search(kind) {
    const query = q.value.trim();
    if (!query) return;
    go.disabled = true; deep.disabled = true;
    status.textContent = kind === "research" ? "Researching..." : "Searching...";

    /* Research narrates. The bar is deliberately NOT a percentage of
       anything -- nobody knows how many sources the question needs -- so it
       creeps toward, but never reaches, done. A fake 100% is worse than an
       honest "still going". */
    let prog = null, seen = 0, off = null;
    if (kind === "research") {
      prog = showProgress({ title: "Deep research", text: query });
      off = ev => {
        seen++;
        prog.set(Math.min(90, seen * 7),
                 ev.phase + (ev.detail ? ": " + ev.detail.slice(0, 60) : ""));
      };
      onDesktopEvent("page-progress", off);
      if (!EV.live) prog.set(5, "working (no live feed from this gateway)");
    }

    try {
      const j = await api("/v1/pages", { method: "POST", body: { query, kind } });
      const page = await api("/v1/pages/" + j.id);
      show(page);
    } catch (e) {
      status.textContent = "";
      status.appendChild(el("span", "ungrounded", e.message));
    }
    if (prog) {
      /* Drop the handler with the dialog; a second research run should not
         drive a closed window. */
      const list = EV.handlers["page-progress"] || [];
      const at = list.indexOf(off);
      if (at >= 0) list.splice(at, 1);
      prog.done();
    }
    go.disabled = false; deep.disabled = false;
  }
  go.addEventListener("click", () => search("search"));
  deep.addEventListener("click", () => search("research"));
  q.addEventListener("keydown", e => { if (e.key === "Enter") search("search"); });
  /* The desktop ask field routes questions here when this window is already
     open -- createWindow returns the live singleton without re-running this
     builder, so the question has to arrive through the window itself. */
  w.__ask = (query, kind) => { q.value = query; search(kind || "search"); };

  mk.addEventListener("click", async () => {
    if (!current) return;
    mk.disabled = true;
    status.textContent = "Making it into an app...";
    try {
      /* Name the app after its SUBJECT. A generated page's title is the
         question that produced it, so promoting one used to mint a
         project called "what is a pomodoro timer" -- a slug, an icon
         caption and an app name, permanently. */
      /* Reserve the name before copying. Promotion writes the page into
         the project's app/index.html, and CreateProject is idempotent --
         so a title that lands on an existing slug does not make a new
         project, it OVERWRITES that one's app. Shortening titles made
         that likelier, not less: "Build me a timer" and "Create a timer"
         used to be two projects and both now derive "Timer". */
      const want = await freeProjectName(
        deriveProjectTitle(current.title || current.query || ""));
      const j = await api(`/v1/pages/${current.id}/promote`, {
        method: "POST",
        body: { title: want.title, name: want.name },
      });
      /* The page stays where it was; the app is the new thing. Open it and
         refresh the desktop so its icon is there too. */
      await loadProjects();
      openApp(j.project);
      status.textContent = "";
      status.appendChild(el("span", "grounded",
        `Now a project: ${j.project} \u2014 ask PasClaw to change it`));
      /* Promoting the same page twice is easy to do by accident, and the
         second one lands beside the first under a numbered name. Not a
         question here -- the copy already exists -- but the status bar
         should say the neighbours are there rather than let them pile up
         unnoticed. */
      if (want.siblings && want.siblings.length)
        status.appendChild(el("span", "muted",
          `  (${want.siblings.length} similar project` +
          `${want.siblings.length === 1 ? "" : "s"} already: ` +
          want.siblings.slice(0, 3).join(", ") +
          (want.siblings.length > 3 ? ", ..." : "") + ")"));
    } catch (e) {
      status.textContent = "";
      status.appendChild(el("span", "ungrounded", e.message));
    }
    mk.disabled = false;
  });

  /* Named on the window so the already-open path above can navigate it. */
  w.__showPageId = id => api("/v1/pages/" + id).then(show).catch(() => {});

  if (pageId) w.__showPageId(pageId);
  else if (initialQuery) {
    /* Asked from the desktop background: the Browser opens already working
       on the question rather than presenting an empty field to retype into. */
    q.value = initialQuery;
    search(initialKind || "search");
  }
  else setTimeout(() => q.focus(), 0);
  return w;
}

/* ==========================================================================
   File Manager -- the workspace directory, as a directory

   The plan's "files are alive": the agent's own working files are on the
   desktop rather than behind a tool call. Read-only on purpose. /v1/fs is
   sandbox-checked and filters secret-bearing files (config.json, .env, TLS
   keys) server-side, so this window shows exactly what the operator surface
   is willing to show and nothing more -- and a browse window is not the
   place to invent a delete button.
   ========================================================================== */

function openFiles(startPath) {
  /* Already open: focus it, and navigate only when the caller named a
     place to go -- the window otherwise keeps the directory the user was
     in. Rebuilding here used to stack a second toolbar and listing. */
  const already = WINS.get("files");
  if (already) {
    restoreWindow(already); focusWindow(already);
    if (startPath && already.__show) already.__show(startPath);
    return already;
  }
  const w = createWindow({ key: "files", title: "File Manager", width: 640,
                           height: 440, icon: "folder", pad: false,
                           restore: { fn: "files", arg: startPath || "" } });
  const bar = el("div");
  bar.style.cssText = "display:flex;gap:4px;padding:3px;align-items:center";
  const up = el("button", "btn", "Up");
  const wsBtn = el("button", "btn", "Workspace");
  const where = el("input", "fld");
  where.type = "text";
  where.style.cssText = "flex:1 1 auto;font-family:monospace";
  bar.appendChild(up); bar.appendChild(wsBtn); bar.appendChild(where);
  w.body.appendChild(bar);

  const list = el("div");
  list.style.cssText = "overflow:auto;height:calc(100% - 30px)";
  w.body.appendChild(list);
  const status = el("div", "statusbar thin", "");
  w.node.appendChild(status);

  let cwd = startPath || "";
  let wsRoot = "";

  /* Parent directory, without assuming a separator the server did not use. */
  function parentOf(pathStr) {
    const sep = pathStr.includes("\\") && !pathStr.includes("/") ? "\\" : "/";
    const cut = pathStr.replace(/[\/\\]+$/, "").lastIndexOf(sep);
    return cut > 0 ? pathStr.slice(0, cut) : pathStr;
  }

  async function show(pathStr) {
    status.textContent = "Reading...";
    try {
      const j = await api("/v1/fs" + (pathStr ? "?path=" + encodeURIComponent(pathStr) : ""));
      cwd = j.path;
      wsRoot = j.workspace_root || "";
      wsBtn.disabled = !wsRoot;
      where.value = cwd;
      list.textContent = "";
      const rows = (j.entries || []).slice().sort((a, b) =>
        (a.dir === b.dir) ? a.name.localeCompare(b.name) : (a.dir ? -1 : 1));
      if (!rows.length) list.appendChild(el("div", "row muted", "(empty)"));
      rows.forEach(e => {
        const r = el("div", "row");
        r.style.cssText = "display:flex;gap:6px;padding:2px 6px;cursor:default";
        const ic = el("span");
        ic.style.cssText = "width:16px;height:16px;flex:0 0 16px";
        ic.innerHTML = icon(e.dir ? "folder" : "page");
        const nm = el("span", null, e.name);
        nm.style.flex = "1 1 auto";
        const sz = el("span", "muted", e.dir ? "" : String(e.size));
        r.appendChild(ic); r.appendChild(nm); r.appendChild(sz);
        r.addEventListener("dblclick", () => {
          if (e.dir) show(cwd.replace(/[\/\\]+$/, "") + "/" + e.name);
          else openFileView(cwd.replace(/[\/\\]+$/, "") + "/" + e.name, e.name);
        });
        list.appendChild(r);
      });
      status.textContent = rows.length + " item" + (rows.length === 1 ? "" : "s");
    } catch (err) {
      list.textContent = "";
      list.appendChild(el("div", "row muted", err.message));
      status.textContent = "";
    }
  }

  up.addEventListener("click", () => show(parentOf(cwd)));
  wsBtn.addEventListener("click", () => { if (wsRoot) show(wsRoot); });
  where.addEventListener("keydown", e => { if (e.key === "Enter") show(where.value.trim()); });
  w.__show = show;
  show(startPath || "");
  return w;
}

/* A file, in a document window. Binary files say so rather than rendering
   as mojibake, and a truncated read says it was truncated -- a viewer that
   quietly shows you the first 64KB of a log is worse than one that admits
   to it.

   Three kinds of file, three windows, matching what the FMX client has
   always done: a document renders, a program's bytes get a hex viewer,
   and everything else is text. The web viewer used to answer all three
   with source text or "(binary file, N bytes)" -- technically honest and
   useless for the two cases where the format IS the content. */
async function openFileView(pathStr, name) {
  const ext = (String(name || "").match(/\.[a-z0-9]+$/i) || [""])[0].toLowerCase();
  const w = createWindow({ title: name || "File", width: 620, height: 440,
                           icon: "page", pad: false });
  const status = el("div", "statusbar thin", "");
  w.node.appendChild(status);

  try {
    const j = await api("/v1/fs/read?path=" + encodeURIComponent(pathStr));

    /* Bytes. The peek route streams a bounded window and reports the full
       size, so this pages through a gigabyte without downloading it --
       which is the case that matters when the gateway is remote. */
    if (j.binary) {
      await hexViewInto(w, status, pathStr, j.size || 0);
      return w;
    }

    /* A document. Rendered, not recited -- but in a frame with an EMPTY
       sandbox: no scripts, no forms, no navigation, and no same-origin,
       so a page found in the workspace cannot reach this desktop's
       gateway or read its token. srcdoc rather than a src pointing at
       the file, because /v1/fs serves workspace files as text on
       purpose and should keep doing so. */
    if (ext === ".html" || ext === ".htm") {
      const bar = el("div");
      bar.style.cssText = "display:flex;gap:4px;padding:3px;align-items:center";
      const asPage = el("button", "btn", "Rendered");
      const asText = el("button", "btn", "Source");
      bar.appendChild(asPage); bar.appendChild(asText);
      bar.appendChild(el("span", "muted", "scripts are disabled in this view"));
      w.body.appendChild(bar);

      const frame = el("iframe", "app");
      frame.setAttribute("sandbox", "");
      frame.style.cssText = "width:100%;height:calc(100% - 28px);border:0;background:#fff";
      frame.srcdoc = j.content || "";
      const src = el("pre");
      src.style.cssText = "margin:0;padding:6px;overflow:auto;height:calc(100% - 28px);" +
                          "white-space:pre-wrap;word-break:break-word;font-size:11px;display:none";
      src.textContent = j.content || "";
      w.body.appendChild(frame); w.body.appendChild(src);
      const pick = rendered => {
        frame.style.display = rendered ? "" : "none";
        src.style.display   = rendered ? "none" : "";
      };
      asPage.addEventListener("click", () => pick(true));
      asText.addEventListener("click", () => pick(false));
      status.textContent = (j.truncated ? "truncated -- " : "") + "HTML document";
      return w;
    }

    const pre = el("pre");
    pre.style.cssText = "margin:0;padding:6px;overflow:auto;height:100%;" +
                        "white-space:pre-wrap;word-break:break-word;font-size:11px";
    pre.textContent = j.content || "";
    w.body.appendChild(pre);
    if (j.truncated) status.textContent = "truncated";
  } catch (e) {
    const pre = el("pre");
    pre.style.cssText = "margin:0;padding:6px";
    pre.textContent = e.message;
    w.body.appendChild(pre);
  }
  return w;
}

/* The hex viewer: one 1 KiB page of raw bytes at a time, over /v1/fs/peek.
   The route was built for exactly this and had no caller -- the web UI
   answered every binary file with its size and nothing else. */
async function hexViewInto(w, status, pathStr, total) {
  const PAGE = 1024;
  let offset = 0;

  const bar = el("div");
  bar.style.cssText = "display:flex;gap:4px;padding:3px;align-items:center";
  const prev = el("button", "btn", "<");
  const next = el("button", "btn", ">");
  const at = el("span", "muted", "");
  at.style.cssText = "font-family:monospace";
  bar.appendChild(prev); bar.appendChild(next); bar.appendChild(at);
  w.body.appendChild(bar);

  const pre = el("pre");
  pre.style.cssText = "margin:0;padding:6px;overflow:auto;height:calc(100% - 28px);" +
                      "font-family:monospace;font-size:11px;white-space:pre";
  w.body.appendChild(pre);

  /* Classic three columns: offset, hex, and the printable rendering --
     the part that makes a header or an embedded string readable at a
     glance, which is the whole reason to open a binary at all. */
  const render = bytes => {
    const lines = [];
    for (let i = 0; i < bytes.length; i += 16) {
      const row = bytes.slice(i, i + 16);
      const hex = [...row].map(b => b.toString(16).padStart(2, "0")).join(" ");
      const txt = [...row].map(b => (b >= 32 && b < 127) ? String.fromCharCode(b) : ".").join("");
      lines.push((offset + i).toString(16).padStart(8, "0") + "  " +
                 hex.padEnd(47, " ") + "  " + txt);
    }
    return lines.join("\n");
  };

  async function load() {
    prev.disabled = offset <= 0;
    try {
      /* Raw bytes, so this goes around api() -- which parses text -- and
         carries the bearer the same way every other call does. */
      const t = token();
      const r = await fetch(`/v1/fs/peek?path=${encodeURIComponent(pathStr)}` +
                            `&offset=${offset}&len=${PAGE}`,
                            t ? { headers: { authorization: "Bearer " + t } } : {});
      if (!r.ok) throw new Error("http " + r.status);
      /* The server reports the true size; trust it over the listing's,
         which may be stale by the time the window opens. */
      const hdr = parseInt(r.headers.get("X-File-Total") || "", 10);
      if (!isNaN(hdr)) total = hdr;
      const bytes = new Uint8Array(await r.arrayBuffer());
      pre.textContent = bytes.length ? render(bytes) : "(end of file)";
      at.textContent = `${offset} - ${offset + bytes.length} of ${total} bytes`;
      next.disabled = offset + bytes.length >= total;
    } catch (e) {
      pre.textContent = e.message;
    }
  }
  prev.addEventListener("click", () => { offset = Math.max(0, offset - PAGE); load(); });
  next.addEventListener("click", () => { offset += PAGE; load(); });
  status.textContent = "binary -- hex view";
  await load();
}

/* ==========================================================================
   Library -- every page and project ever made
   ========================================================================== */

async function openLibrary() {
  /* Reopening refreshes rather than stacks: a second Start > Library used
     to append a second list under the first. Reuse the window and rebuild
     its contents -- a fresh listing is what reopening should mean. */
  const already = WINS.get("library");
  const w = already || createWindow({ key: "library", title: "Library",
                           width: 460, height: 380, icon: "brain", pad: false,
                           restore: { fn: "library" } });
  if (already) { restoreWindow(already); focusWindow(already); }
  w.body.textContent = "";
  const list = el("div", "list in");
  list.style.height = "100%";
  w.body.appendChild(list);
  w.body.style.padding = "3px";

  try {
    const j = await api("/v1/pages");
    const pages = j.pages || [];
    if (!pages.length) {
      list.appendChild(el("div", "row muted", "No pages yet. Ask something in the Browser."));
    }
    pages.forEach(p => {
      const r = el("div", "row");
      const n = p.source_count || 0;
      r.textContent = `${p.title}  --  ${n} source${n === 1 ? "" : "s"}  ${p.created || ""}`;
      r.title = p.query || "";
      r.addEventListener("click", () => {
        list.querySelectorAll(".row.sel").forEach(x => x.classList.remove("sel"));
        r.classList.add("sel");
      });
      r.addEventListener("dblclick", () => openBrowser(p.id));
      list.appendChild(r);
    });
  } catch (e) {
    list.appendChild(el("div", "row", e.message));
  }
  return w;
}

/* ==========================================================================
   Agents -- the standing roster

   The 5% of the plan where something has gone off the rails, and the
   only surface where you can see the whole organisation at once. Every
   row is live: busy comes from the session's turn lock, pending from
   the mailbox queue, and both are re-read on the `agent` event rather
   than polled -- an agent that starts working repaints here without
   anyone touching anything.
   ========================================================================== */

async function openAgents() {
  /* Reopen refreshes rather than stacks -- the same guard the Library
     grew after a second Start > Library appended a second list. */
  const already = WINS.get("agents");
  const w = already || createWindow({ key: "agents", title: "Agents",
                          width: 560, height: 400, icon: "brain", pad: false,
                          restore: { fn: "agents" } });
  if (already) { restoreWindow(already); focusWindow(already); }
  w.body.textContent = "";

  const bar = el("div");
  bar.style.cssText = "display:flex;gap:4px;padding:3px;align-items:center";
  const team = el("button", "btn", "New team...");
  team.addEventListener("click", () => newTeam());
  const add = el("button", "btn", "New agent...");
  const sup = el("button", "btn", "Supervise");
  sup.title = "Check every agent and restart the ones that stopped";
  /* The brake. It stops new turns starting AND ends the ones already
     running -- each at its next safe point, between tool calls rather
     than in the middle of one, so a file write and the board update
     that belongs with it are never left half-finished. */
  const brake = el("button", "btn", "Pause all");
  brake.title = "Stop everything: no new turns start, and whoever is " +
                "working stops at their next safe point";
  brake.addEventListener("click", async () => {
    let now = false;
    try { now = (await api("/v1/agents/pause")).paused; } catch {}
    try {
      const j = await api("/v1/agents/pause",
                          { method: "POST", body: { paused: !now } });
      status.textContent = j.paused
        ? (j.told_to_wind_down || []).length
          ? "paused -- stopping: " + j.told_to_wind_down.join(", ")
          : "paused -- nothing was working"
        : "resumed";
      paint();
    } catch (e) { status.textContent = e.message; }
  });
  bar.appendChild(team); bar.appendChild(add);
  bar.appendChild(brake); bar.appendChild(sup);
  const status = el("span", "muted");
  status.style.marginLeft = "6px";
  bar.appendChild(status);
  w.body.appendChild(bar);

  const list = el("div", "list in");
  list.style.cssText = "height:calc(100% - 30px);margin:0 3px 3px";
  w.body.appendChild(list);

  async function paint() {
    /* The brake's own label is the truthful place to show the state:
       a roster that says "idle" while the system is stopped is the
       same silence as no indicator at all. */
    try {
      const p = await api("/v1/agents/pause");
      brake.textContent = p.paused ? "Resume all" : "Pause all";
      brake.title = p.paused
        ? "Paused" + (p.note ? ": " + p.note : "") +
          " -- no new turns are starting. Click to resume."
        : "Stop everything: no new turns start, and whoever is " +
          "working stops at their next safe point";
    } catch {}
    let rows = [];
    try { rows = (await api("/v1/agents")).agents || []; }
    catch (e) { list.textContent = ""; list.appendChild(el("div", "row", e.message)); return; }
    list.textContent = "";
    if (!rows.length) {
      list.appendChild(el("div", "row muted",
        "No agents yet. A standing agent is a name, a role and a " +
        "conversation that outlives this process."));
      return;
    }
    /* Parents before their reports, so the tree reads as an org chart
       rather than as alphabetical noise. */
    rows.sort((a, b) => (a.parent || "").localeCompare(b.parent || "") ||
                        a.name.localeCompare(b.name));
    rows.forEach(a => {
      const r = el("div", "row");
      r.style.cssText = "display:flex;gap:6px;align-items:center;padding:2px 6px";
      const ic = el("span");
      ic.style.cssText = "width:14px;height:14px;flex:0 0 14px";
      ic.innerHTML = icon("brain");
      r.appendChild(ic);

      const nm = el("span", null, (a.parent ? "  " : "") + (a.title || a.name));
      nm.style.flex = "1 1 auto";
      nm.title = a.role || "";
      r.appendChild(nm);

      /* State in the words the server used -- busy, or whatever the last
         run left behind. A roster that rounded "failed" to "idle" would
         hide the one row you opened it for. */
      const state = a.busy ? "working"
                  : (a.run_state === "failed" ? "FAILED"
                  : (a.run_state || "idle"));
      const st = el("span", a.busy ? "st-active"
                        : (a.run_state === "failed" ? "st-blocked" : "muted"),
                    state);
      r.appendChild(st);
      if (a.pending)
        r.appendChild(el("span", "badge", String(a.pending)));

      const say = el("button", "btn", "Message");
      say.style.cssText = "padding:0 6px;font-size:10px;line-height:14px";
      say.addEventListener("click", async e => {
        e.stopPropagation();
        const text = prompt(`Message to ${a.title || a.name}:`, "");
        if (!text) return;
        try {
          const j = await api(`/v1/agents/${a.name}/send`,
                              { method: "POST", body: { from: "operator", text } });
          /* Say WHICH delivery happened: "queued" and "mid-turn" mean
             different things about when the agent will act, and the
             server already worked out which. */
          status.textContent = j.delivered === "mid-turn"
            ? `${a.name} is working and saw it mid-turn`
            : `${a.name} is idle; it will see that next turn`;
          paint();
        } catch (err) { alert(err.message); }
      });
      r.appendChild(say);

      const run = el("button", "btn", "Wake");
      run.title = "Give this agent a turn now";
      run.style.cssText = "padding:0 6px;font-size:10px;line-height:14px";
      run.disabled = !!a.busy;
      run.addEventListener("click", async e => {
        e.stopPropagation();
        try {
          await api(`/v1/agents/${a.name}/run`, { method: "POST", body: {} });
          status.textContent = `${a.name} is working`;
        } catch (err) { status.textContent = err.message; }
        paint();
      });
      r.appendChild(run);

      /* Retire. The roster could create agents and never remove one,
         so a workspace only ever accumulated them. The confirm names
         what is KEPT, because "delete" reads as though the
         conversation goes too and it does not. */
      const bin = el("button", "btn", "Retire");
      bin.title = "Remove this agent. Its conversation is kept.";
      bin.style.cssText = "padding:0 6px;font-size:10px;line-height:14px";
      bin.addEventListener("click", async e => {
        e.stopPropagation();
        if (a.busy) {
          status.textContent = a.name + " is working -- pause first, or " +
            "wait for it to finish";
          return;
        }
        if (!confirm(`Retire ${a.title || a.name}?\n\n` +
                     `Its manifest and message record go. Its CONVERSATION ` +
                     `is kept and stays readable in the Library.`)) return;
        try {
          await api("/v1/agents/" + a.name, { method: "DELETE" });
          status.textContent = "retired " + a.name;
          paint();
        } catch (err) { status.textContent = err.message; }
      });
      r.appendChild(bin);

      /* Double-click opens the agent's CONVERSATION -- it is an ordinary
         session, so the same window a project chat uses reads it. That
         equivalence is the point of filing agents as sessions. */
      r.addEventListener("dblclick", () => openAgentChat(a));
      r.title = a.run_note || "";
      list.appendChild(r);
    });
  }

  add.addEventListener("click", async () => {
    const name = prompt("What is this agent called? (e.g. Payments tech lead)", "");
    if (!name) return;
    const role = prompt("What is it for?", "") || "";
    const parent = prompt("Who does it report to? (blank = top level)", "") || "";
    try {
      await api("/v1/agents", { method: "POST",
                                body: { name, title: name, role, parent } });
      paint();
    } catch (e) { alert(e.message); }
  });

  sup.addEventListener("click", async () => {
    status.textContent = "Checking...";
    try {
      /* Paused means nothing gets restarted -- the route refuses, and
         it is right to. Still worth answering the question, so ask it
         as a dry pass and report what it WOULD do; a stopped system
         that also refuses to tell you what is wrong is just silence. */
      let paused = false;
      try { paused = (await api("/v1/agents/pause")).paused; } catch {}
      const j = await api("/v1/agents/supervise",
                          { method: "POST", body: { dry: paused } });
      const acted = (j.verdicts || []).filter(v => v.action !== "ok");
      status.textContent = !acted.length
        ? "all agents healthy"
        : paused
          ? "paused -- would restart: " + acted.map(v => v.name).join(", ")
          : `${j.restarted} restarted: ` + acted.map(v => v.name).join(", ");
    } catch (e) { status.textContent = e.message; }
    paint();
  });
