      const w = WINS.get(a.key);
      if (!w) throw new Error("no window " + a.key);
      restoreWindow(w); focusWindow(w);
      return "focused " + a.key;
    },
  },
  close: {
    help: 'close {"key":"<window key>"} -- close one window',
    run: a => {
      const w = WINS.get(a.key);
      if (!w) throw new Error("no window " + a.key);
      closeWindow(w);
      return "closed " + a.key;
    },
  },
  /* One verb for "put that there", because that is how the request
     arrives. A model asked to "move Notes to the bottom right and make
     it half height" should not have to do arithmetic on a stage size it
     was told about in prose -- getting that subtly wrong puts a window
     half off the screen. Named regions and fractions are what the
     sentence actually contains; x/y/w/h stay available for the rare
     request that really is about pixels. */
  place: {
    help: 'place {"key":"<window key>","at":"<left|right|top|bottom|' +
          'top-left|top-right|bottom-left|bottom-right|center>",' +
          '"size":"<full|half|third|quarter>"} -- put a window somewhere. ' +
          "Accepts x/y/w/h instead when exact pixels are wanted.",
    run: a => {
      const w = WINS.get(a.key);
      if (!w) throw new Error("no window " + a.key);
      if (w.maximized) toggleMax(w);
      restoreWindow(w);
      const r = desktopRect();
      const frac = { full: 1, half: 0.5, third: 1 / 3, quarter: 0.25 };
      let width  = a.w != null ? Number(a.w) : null;
      let height = a.h != null ? Number(a.h) : null;
      if (a.size && frac[a.size] != null) {
        /* "half" means half the stage in the direction the region
           splits: a left/right half is half the WIDTH at full height, a
           top/bottom half is half the HEIGHT at full width. A corner is
           half of both. That is what someone means. */
        const at = String(a.at || "");
        const f = frac[a.size];
        const splitsX = /left|right/.test(at), splitsY = /top|bottom/.test(at);
        width  = Math.round(r.width  * ((splitsX || !splitsY) ? f : 1));
        height = Math.round(r.height * ((splitsY || !splitsX) ? f : 1));
      }
      width  = Math.max(200, Math.min(width  || w.node.offsetWidth,  r.width));
      height = Math.max(110, Math.min(height || w.node.offsetHeight, r.height));

      let x = a.x != null ? Number(a.x) : null;
      let y = a.y != null ? Number(a.y) : null;
      if (a.at) {
        const at = String(a.at);
        x = /right/.test(at)  ? r.width - width
          : /left/.test(at)   ? 0
          : Math.round((r.width - width) / 2);
        y = /bottom/.test(at) ? r.height - height
          : /top/.test(at)    ? 0
          : Math.round((r.height - height) / 2);
      }
      /* Never off the stage, whatever was asked for. */
      x = Math.max(0, Math.min(x == null ? w.node.offsetLeft : x, r.width - width));
      y = Math.max(0, Math.min(y == null ? w.node.offsetTop  : y, r.height - height));
      Object.assign(w.node.style, {
        left: x + "px", top: y + "px",
        width: width + "px", height: height + "px",
      });
      focusWindow(w);
      saveDesktop();
      return `placed ${a.key} at ${x},${y} ${width}x${height}`;
    },
  },
  /* Change an app that ALREADY exists. Distinct from build_app, which
     always makes a new project: "make the Brain app look better" is a
     turn in brain's own conversation, not a second brain. */
  edit_app: {
    help: 'edit_app {"project":"<slug>","brief":"<the change>"} -- ' +
          "change an app that already exists, in its own conversation",
    run: a => {
      if (!a.project) throw new Error("edit_app needs a project");
      /* Against every name, not the displayed list: an archived
         project is filed away, not gone, and editing its app is a
         perfectly reasonable thing to ask for. */
      if (!(S.projectNames || []).includes(a.project))
        throw new Error("no project " + a.project);
      openChat(a.project);
      projectChat(a.project).submitText(a.brief || a.title || "", "build");
      return "editing " + a.project;
    },
  },
  /* Answers land in the Browser as pages, so Auto can route a question
     the same way the Ask intent does. */
  open_page: {
    help: 'open_page {"query":"<question>","kind":"search|research"} -- ' +
          "answer a question as a page in the Browser (research digs deeper)",
    run: a => {
      const q = a.query || a.brief || a.title;
      if (!q) throw new Error("open_page needs a query");
      askFromDesktop(q, a.kind === "research" ? "research" : "search");
      return (a.kind === "research" ? "researching " : "answering ") + q;
    },
  },
  theme: {
    help: 'theme {"id":"<style id>"} -- change the desktop theme',
    run: a => { applyStyle(a.id); return "theme " + a.id; },
  },
  refresh: {
    help: "refresh -- re-read the board and repaint (after changing things " +
          "outside the desktop)",
    /* Repaints the BOARD -- icons, tree, project panes. It deliberately
       does not reload any app frame: that would throw away whatever the
       user was typing inside the app, and an agent tidying the desktop
       has no business destroying work. Reloading an app is
       __reloadApp's job, and even that defers to unsaved changes. */
    run: async () => { await loadProjects(); paintTree(); return "refreshed"; },
  },
};

/* Where an action's outcome is reported.

   The shell window sets this while it is open, so a turn you started
   narrates into the conversation you started it from. When the command
   arrives from somewhere else -- the Agent Console, a cron job -- there
   is no conversation to narrate into, and a status line is better than a
   silent screen rearranging itself. */
let SHELL_SAY = null;
function shellSay(text) {
  if (SHELL_SAY) { try { return SHELL_SAY(text); } catch {} }
  showMessage({ title: "Desktop", kind: "info", text: text });
}

/* The desktop's whole state, written into the prompt.

   This is the difference between a shell that answers in one round trip
   and one that spends six tool calls rediscovering what the page already
   had in memory: without it the model reaches for list_dir and fs_read
   to find desktop.json and the projects directory, which is slow, costs
   tokens, and can still get it wrong. The page knows all of this
   already, so it says so, and the turn goes out with no_tools. */
function shellState() {
  const wins = [...WINS.values()].map(w => {
    const b = w.node.getBoundingClientRect();
    return `${w.key || "?"} "${w.title}" ${Math.round(b.width)}x${Math.round(b.height)}` +
           (w.node.classList.contains("min") ? " (minimized)" : "");
  });
  const projects = S.projects.map(p =>
    `${p.name}${p.has_app ? " [app]" : ""}${p.suite ? " [suite]" : ""}` +
    (p.tasks ? ` ${p.open_tasks || 0}/${p.tasks} tasks open` : ""));
  return { wins, projects };
}

function shellPrompt() {
  const st = shellState();
  const wins = st.wins;
  const projects = st.projects.join(", ");
  return [
    "You are the shell of PasClaw Desktop -- the window manager and the",
    "assistant at once. Whatever the user types arrives here, and YOU",
    "decide what it was: a question, a change to an app, a new app, or",
    "the screen needing rearranging. They should never have to say which.",
    "",
    "Route it by calling the `desktop` tool with an actions array, e.g.",
    '{"actions":[{"do":"tile"}]}. Several actions in one call when the',
    'user asks for several things -- "build me these five apps" is one',
    "call with five build_app actions, not five turns.",
    "",
    "Actions:",
    ...Object.values(SHELL_ACTIONS).map(a => "  - " + a.help),
    "",
    "Reading the request:",
    '  - about the SCREEN ("tile these", "close that", "open Notes")',
    "    -> tile / cascade / place / focus / close / open_app",
    '  - changing an app that EXISTS ("make the Brain app look better")',
    "    -> edit_app with that project's slug. Do NOT build_app: that",
    "       would make a second copy instead of changing theirs.",
    '  - a NEW app ("build me a stopwatch") -> build_app',
    '  - a TEAM ("spin up a software team to build X", "put a team on',
    '    this project") -> team_up. A team is standing agents that keep',
    "    working on their own; an app is a thing. Do not confuse them.",
    '  - a question ("what is a pomodoro timer", "compare X and Y")',
    "    -> open_page, kind research when it wants depth or sources",
    "  - anything conversational -> just answer, no tool at all",
    "",
    "Your other tools work here too and compose in one turn: read a file",
    "and then tile, search the workspace and then open what you found.",
    "",
    "EVERYTHING you need about the desktop is below. It is current as of",
    "this message -- do not go looking for it on disk, and do not ask for",
    "it; there is nothing to find that is not already here.",
    "",
    /* The stage, because placement is relative to it -- and the window
       KEYS, because every windowed action names one. */
    "Stage: " + Math.round(desktopRect().width) + "x" +
                Math.round(desktopRect().height) + " (0,0 is its top left)",
    "Theme: " + (S.style || "?") + "   Workspace: " + (S.active || "?"),
    "Open windows (" + wins.length + "):",
    ...(wins.length ? wins.map(x => "  - " + x) : ["  (none)"]),
    "Projects: " + (projects || "(none)"),
  ].join("\n");
}

/* Run the actions a turn asked for, reporting each outcome back into the
   transcript. Reported rather than silent: a window manager that
   rearranges your screen without saying what it did is indistinguishable
   from one that is broken. */
/* Actions whose effect outlives this browser tab: they create a
   project, start a turn, write a page. Every other action only moves
   pixels on the screen it runs on, so running it on all of them is
   right. These must run exactly once, whoever is watching. */
const EFFECTFUL = new Set(["build_app", "edit_app", "open_page", "team_up"]);

async function runShellActions(block, say, opts) {
  const list = Array.isArray(block.actions) ? block.actions : [];
  if (!list.length) return [];
  /* Default true: a turn typed into THIS window is this window's to
     carry out. Only the broadcast path passes false, and only to the
     screens the server did not name. */
  const effects = !opts || opts.effects !== false;
  const done = [];
  for (const a of list) {
    const spec = SHELL_ACTIONS[a.do];
    if (!spec) {
      done.push(`unknown action: ${a.do}`);
      say(`(unknown action: ${a.do})`);
      continue;
    }
    if (!effects && EFFECTFUL.has(a.do)) {
      /* Silent on purpose. Saying "another window is building this" in
         every tab is three notifications for one build; the screen that
         IS doing it narrates. */
      done.push(`${a.do}: skipped (another desktop is running it)`);
      continue;
    }
    try {
      const out = await spec.run(a);
      done.push(`${a.do}: ${out}`);
      say("-> " + out);
    } catch (e) {
      done.push(`${a.do} failed: ${e.message}`);
      say(`(${a.do} failed: ${e.message})`);
    }
  }
  /* The board may have moved under us -- build_app makes a project,
     open_app can start one -- so the icons and the tree are repainted
     once, after the batch rather than per action. */
  try { await loadProjects(); paintTree(); } catch {}
  return done;
}

function openShell() {
  const r = desktopRect();
  const w = createWindow({
    key: "shell", title: "Ask PasClaw", icon: "brain", pad: false,
    width: Math.round(r.width * 0.9), height: Math.round(r.height * 0.85),
    restore: { fn: "shell", arg: "" },
  });
  /* Full stage on open: this is the surface you came to type into, and a
     small window over a busy desktop would repeat the problem it exists
     to solve. It is an ordinary window otherwise -- movable, resizable,
     closable. */
  /* ...but NOT while the saved layout is being replayed. restoreDesktop
     calls this, then applies the geometry it saved and toggles maximize
     if that is what was saved -- so maximizing here first inverts both
     cases: a normal shell comes back maximized, and a maximized one gets
     toggled back to normal. The saved state is the authority when there
     is one. */
  if (!w.__shellBuilt && !restoring) maximizeWindow(w);

  if (w.__shellBuilt) { restoreWindow(w); focusWindow(w); w.__focusShell(); return w; }
  w.__shellBuilt = true;

  const wrap = el("div", "chat");
  const log = el("div", "log in");
  const composer = el("div", "composer shellcomposer");
  const ta = el("textarea", "fld");
  ta.placeholder = "Ask anything, describe an app, or tell the desktop what to do";
  const row = el("div", "shellrow");
  const kind = el("select", "fld");
  Object.entries(ASK_KINDS).forEach(([k, v]) => {
    const o = el("option", null, v.label); o.value = k; kind.appendChild(o);
  });
  kind.value = "auto";
  const where = el("span", "muted");
  const go = el("button", "btn", "Go");
  const turn = makeTurnControl(go, "Go");
  row.appendChild(where); row.appendChild(kind); row.appendChild(go);
  composer.appendChild(ta); composer.appendChild(row);
  const chips = el("div", "shellchips");
  wrap.appendChild(log); wrap.appendChild(chips); wrap.appendChild(composer);
  w.body.appendChild(wrap);
  paintChipsInto(chips);

  const say = (who, text, cls) => {
    const m = el("div", "msg " + (cls || ""));
    m.appendChild(el("div", "who", who));
    const b = el("div", "body", text);
    m.appendChild(b);
    log.appendChild(m); log.scrollTop = log.scrollHeight;
    return b;
  };
  const note = t => say("desktop", t, "");

  const paintWhere = () => {
    const k = ASK_KINDS[kind.value];
    where.textContent = k ? k.where : "";
  };
  kind.addEventListener("change", paintWhere);
  paintWhere();

  /* The four intents keep their meanings -- the shell is where they live
     now, not a second copy of them. The field they read is this window's
     textarea, so askFromDesktop and createAppFrom are given its text. */
  async function run() {
    await ready;
    const text = ta.value.trim();
    if (!text) return;
    const k = kind.value;
    if (k !== "control" && k !== "auto") ta.value = "";
    say("you", text, "u");
    switch (k) {
      case "research": return askWith(text, "research");
      case "plan":     return buildWith(text, true);
      case "build":    return buildWith(text, false);
      case "ask":      return askWith(text, "search");
      /* auto and control are the same journey -- a turn with the state
         and the tools -- and differ only in what the prompt tells the
         model it is for. */
      default:         return control(text);
    }
  }

  function askWith(text, kindArg) {
    note(kindArg === "research"
      ? "Researching -- the report opens in the Browser."
      : "Asking -- the answer opens in the Browser.");
    const b = WINS.get("browser");
    if (b && b.__ask) { restoreWindow(b); focusWindow(b); b.__ask(text, kindArg); }
    else openBrowser(undefined, text, kindArg);
  }

  async function buildWith(text, plan) {
    note(plan ? "Planning a new project..." : "Starting a new project...");
    const made = await createAppFrom(text, plan);
    if (made) note("Project: " + made);
  }

  /* Talking TO the desktop. Its own turn, with the shell prompt and no
     tools -- the model is arranging windows and queueing builds, not
     touching the workspace, and the actions it emits are executed here
     where they can be shown. */
  async function control(text) {
    ta.value = "";
    if (turn.running) return;
    const body = say("pasclaw", "");
    const signal = turn.begin();
    let acc = "", stopped = false;
    /* Markdown + tool cards while the turn streams, throttled to one
       paint per frame -- the same treatment the project chats get. */
    const toolEvents = [];
    let raf = 0;
    const schedulePaint = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        paintAssistant(body, acc, toolEvents);
        log.scrollTop = log.scrollHeight;
      });
    };
    /* Same queued-turn notice the project chats paint -- the shell
       session can be open on several screens too. */
    TURN_WAITS.set(SHELL_SESSION, () => {
      if (!acc) body.textContent =
        "(waiting for another turn on this conversation to finish...)";
    });
    try {
      const t = token();
      const r = await fetch("/v1/chat/completions", {
        method: "POST",
        signal,
        headers: Object.assign(
          { "content-type": "application/json", "accept": "text/event-stream",
            "x-pasclaw-session": SHELL_SESSION },
          MY_CLIENT ? { "x-pasclaw-client": MY_CLIENT } : {},
          t ? { authorization: "Bearer " + t } : {}),
        /* STREAMED, like the project chats.

           This was a plain fetch that showed "..." until the whole turn
           came back -- on the surface most likely to run multi-step
           work, which is backwards: a shell turn can read a file, search
           the workspace and rearrange the screen, and the user saw none
           of it until it was over. The same SSE path the project chat
           uses puts each tool call on screen as it happens.

           Tools ON, state in the prompt. The two solve different halves:
           the prompt means the model never has to go REDISCOVER the
           windows and projects the page already knows, and the tools
           mean it can still act -- including composing a read or a
           search with a desktop change in the same turn. Arranging the
           screen goes through the `desktop` tool, which publishes onto
           the event feed this page is already listening to. */
        body: JSON.stringify({
          stream: true,
          /* Just this turn. The gateway holds the conversation -- see
             the note on the project chats. The shell prompt is rebuilt
             every turn on purpose: it carries the CURRENT windows and
             projects, and a stale copy of the screen is worse than
             none. */
          messages: [{ role: "user", content: text }],
          session_context: true,
          session_title: "Desktop shell",
          system: shellPrompt(),
        }),
      });
      if (!r.ok) {
        /* A turn that never started still has to END. The re-send
           hazard the pre-session-native code defended against is gone
           by construction -- the browser holds no history to re-send,
           and a request the gateway refused was never filed -- so the
           failure is painted and the controller released, nothing
           more. */
        body.textContent = "(http " + r.status + ")";
        turn.end();
        return;
      }
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
          if (line.startsWith(":")) {
            /* The tool side-channel: full args and results for this
               turn's cards. */
            const c = line.slice(1).trim();
            if (c.startsWith("pasclaw-tool ")) {
              try {
                toolEvents.push(JSON.parse(c.slice("pasclaw-tool ".length)));
                schedulePaint();
              } catch {}
            }
            continue;
          }
          if (!line.startsWith("data:")) continue;
          const data = line.slice(5).trim();
          if (data === "[DONE]") break;
          try {
            const j = JSON.parse(data);
            const d = (j.choices && j.choices[0] && j.choices[0].delta &&
                       j.choices[0].delta.content) || "";
            if (d) { acc += d; schedulePaint(); }
          } catch {}
        }
      }
    } catch (e) {
      if (isAbort(e)) {
        stopped = true;
        paintAssistant(body, (acc ? acc + "\n\n" : "") + "(stopped)", toolEvents);
      } else {
        paintAssistant(body, (acc ? acc + "\n\n" : "") + "(" + e.message + ")",
                       toolEvents);
      }
    }
    turn.end();
    /* Final paint, synchronously -- rAF does not fire in a hidden tab. */
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    /* A stopped turn is still filed, by the gateway, before it closed
       the stream -- the model DID whatever it did before the stop.
       The client just stops here: no action replay. */
    if (stopped) return;

    /* Actions normally arrive by TOOL, which the gateway dispatches and
       the event feed delivers -- runShellActions has already run by the
       time this reply lands. A block in the text is still honoured, for
       a model that describes the change instead of calling the tool. */
    const ui = extractUIBlocks(acc);
    paintAssistant(body, ui.blocks.length ? (ui.text.trim() || "On it.") : acc,
                   toolEvents);
    log.scrollTop = log.scrollHeight;
    for (const blk of ui.blocks)
      if (blk.ui === "desktop") await runShellActions(blk, t => note(t));
  }

  async function loadShell() {
    let j;
    try { j = await api("/v1/sessions/" + SHELL_SESSION + "?if_absent=empty"); }
    catch { return; }
    const msgs = (j && j.messages) || [];
    /* Pair each stored tool result to its call, so a reopened shell
       shows the same cards it showed live -- the transcript carries
       the calls on the assistant turns and the results as tool turns,
       joined by tool_call_id. */
    const results = new Map();
    msgs.forEach(m => {
      if (m.role === "tool" && m.tool_call_id)
        results.set(m.tool_call_id, { content: m.content || "", name: m.name || "" });
    });
    let shown = 0;
    msgs.forEach(m => {
      if (m.role === "user") {
        if (!(m.content || "").trim()) return;
        say("you", m.content, "u");
        shown++;
        return;
      }
      if (m.role !== "assistant") return;
      if (m.tool_calls && m.tool_calls.length) {
        const cards = recordToolCards(m, results);
        if (cards) { log.appendChild(cards); shown++; }
      }
      if ((m.content || "").trim()) {
        paintAssistant(say("pasclaw", ""), m.content, null);
        shown++;
      }
    });
    log.scrollTop = log.scrollHeight;
    if (shown) note("— earlier conversation, reopened —");
  }

  /* Go becomes Stop while a turn runs, same as the project chats.

     But Enter with TEXT in the box, while a turn runs, is neither Go
     nor Stop -- it is the user amending work in flight ("also close the
     log when you are done"), and mapping it to Stop killed the very
     turn it was trying to improve. The gateway has carried steering all
     along (/v1/steer injects into the running loop, verified live);
     the desktop just never offered a way to use it. Now: Enter with
     text steers; Enter on an empty box, or the Stop button, stops. */
  const steerOrStop = async () => {
    const text = ta.value.trim();
    if (turn.running && text) {
      ta.value = "";
      say("you", "\u21b3 " + text, "u");
      try {
        await api("/v1/steer", { method: "POST",
          headers: { "x-pasclaw-session": SHELL_SESSION },
          body: { text } });
      } catch (e) { note("(steer failed: " + e.message + ")"); }
      return;
    }
    if (!turn.stop()) run();
  };
  go.addEventListener("click", () => { if (!turn.stop()) run(); });
  ta.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); steerOrStop(); }
  });
  /* The replay has to WIN, not merely start. The transcript now comes
     from the server, so typing early can no longer corrupt it -- but it
     can still show a reply above the question it answered, because the
     replay would land after the new turn was already on screen. The
     composer is disabled until the replay lands, and run() awaits it
     too: the disable is what the user sees, the await is what makes it
     true for a programmatic caller. */
  ta.disabled = true;
  go.disabled = true;
  const ready = loadShell()
    .catch(() => {})
    .then(() => { ta.disabled = false; go.disabled = false; });
  /* While the shell is open, agent-driven desktop actions narrate into
     THIS conversation rather than a popup -- including ones started from
     another session, which is the honest place to see them. */
  SHELL_SAY = t => { note(t); };
  w.onClose = () => { if (SHELL_SAY) SHELL_SAY = null; };
  w.__focusShell = () => ta.focus();
  setTimeout(() => ta.focus(), 0);
  return w;
}

/* ==========================================================================
   The Log window -- what the gateway is doing, live

   The FMX client has had one since the beginning; the web desktop only
   had the Agent Console's LOGS tab, which is a different surface you
   have to know about. /v1/logs is an SSE feed of "[tag] message" lines,
   so this is a subscriber with a pause button and a filter.
   ========================================================================== */
function openLog() {
  const w = createWindow({ key: "log", title: "Log", icon: "gear",
                           width: 760, height: 440, pad: false,
                           restore: { fn: "log", arg: "" } });
  if (w.__logBuilt) { restoreWindow(w); focusWindow(w); return w; }
  w.__logBuilt = true;

  const bar = el("div");
  bar.style.cssText = "display:flex;gap:4px;padding:3px;align-items:center";
  const filter = el("input", "fld");
  filter.placeholder = "filter...";
  filter.style.flex = "1 1 auto";
  const pause = el("button", "btn", "Pause");
  const clear = el("button", "btn", "Clear");
  bar.appendChild(filter); bar.appendChild(pause); bar.appendChild(clear);
  w.body.appendChild(bar);

  const out = el("div", "in");
  out.style.cssText = "height:calc(100% - 30px);margin:3px;overflow:auto;" +
                      "font-family:ui-monospace,monospace;font-size:11px;" +
                      "white-space:pre-wrap;padding:3px";
  w.body.appendChild(out);

  let paused = false;
  const repaint = () => {
    const f = filter.value.trim().toLowerCase();
    const shown = f ? ACTIVITY.filter(l => l.toLowerCase().includes(f)) : ACTIVITY;
    out.textContent = shown.join("\n");
    if (!paused) out.scrollTop = out.scrollHeight;
  };
  filter.addEventListener("input", repaint);
  pause.addEventListener("click", () => {
    paused = !paused;
    pause.textContent = paused ? "Resume" : "Pause";
    if (!paused) repaint();
  });
  /* Clears the shared buffer, not just this view -- there is one log,
     and a Clear that only blanked the window would refill on the next
     line. */
  clear.addEventListener("click", () => { ACTIVITY.length = 0; repaint(); });

  /* Opening shows what already happened: the buffer has been filling
     since boot whether or not anyone was watching. */
  repaint();
  activitySink = () => { if (!paused) repaint(); };

  /* The gateway's own log is the third source. Its lines are lifecycle
     events -- listening, provider switched, tool registered -- which is
     worth having beside the traffic even though it is not the traffic. */
  const t = token();
  const url = "/v1/logs" + (t ? "?token=" + encodeURIComponent(t) : "");
  let src = null;
  try { src = new EventSource(url); } catch {}
  if (src) {
    src.addEventListener("message", e => {
      let line = e.data;
      try { const j = JSON.parse(e.data); if (typeof j === "string") line = j; } catch {}
      activity("gateway", line);
    });
    src.addEventListener("error", () => {
      activity("gateway", "(log feed dropped -- it reconnects on its own)");
    });
  } else {
    activity("gateway", "this browser has no EventSource, so the gateway log cannot stream");
  }
  /* The stream and the sink are the window's: closing it must end both,
     or a session accumulates a feed and a repaint callback per window
     ever opened. */
  w.onClose = () => {
    try { if (src) src.close(); } catch {}
    activitySink = null;
  };
  return w;
}

/* The dock is always there; "Projects" on the menu just un-hides it. */
function openTree() {
  $("#dock").classList.remove("hidden");
  $("#stage").classList.remove("wide");
  /* On a narrow screen the dock slides over the stage rather than
     taking a third of it; ".on" is what brings it in. Harmless on a
     wide one, where the media query never applies. */
  $("#dock").classList.add("on");
  paintTree();
}
function hideDock() {
  $("#dock").classList.add("hidden");
  $("#dock").classList.remove("on");
  $("#stage").classList.add("wide");
}

/* Tapping the stage puts the drawer away. Only when it IS a drawer --
   on a wide screen the dock is furniture and dismissing it on every
   click in a window would be maddening. */
document.addEventListener("click", e => {
  if (!isNarrow()) return;
  const dock = $("#dock");
  if (!dock.classList.contains("on")) return;
  if (dock.contains(e.target)) return;
  if (e.target.closest && e.target.closest("#taskbar")) return;
  dock.classList.remove("on");
});

function initDock() {
  $("#dockhide").addEventListener("click", hideDock);
  $("#newproj").addEventListener("click", newProject);
  $("#refresh").addEventListener("click", async () => {
    S.tree = {};
    await loadProjects();
  });
  /* Drag the dock's right edge to resize it. The stage's left offset follows,
     so windows never end up underneath. */
  $("#dockgrip").addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    const sx = e.clientX, w0 = $("#dock").offsetWidth;
    document.body.classList.add("dragging");
    const move = ev => {
      const nw = Math.max(150, Math.min(460, w0 + ev.clientX - sx));
      $("#dock").style.width = nw + "px";
      $("#stage").style.left = nw + "px";
    };
    const up = () => {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      document.body.classList.remove("dragging");
      paintIcons();
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
    e.preventDefault();
  });
}

/* The dock in PROJECT mode: opening a project turns the left bar into that
   project, chat foremost -- because "modify the app to do X" IS the way
   work happens here, and it was two clicks and a floating window away.
   A header row leads back to the board; the app and a new task are one
   button each. */
function paintProjectPane(name) {
  const host = document.getElementById("treebody");
  if (!host) return;
  /* Detach, never clear: textContent = "" would destroy the cached chat
     pane's DOM (the transcript) while the closure kept streaming into it. */
  while (host.firstChild) host.removeChild(host.firstChild);
  host.style.display = "flex";
  host.style.flexDirection = "column";
  const p = S.projects.find(x => x.name === name);

  const head = el("div");
  head.style.cssText = "flex:0 0 auto;display:flex;gap:4px;align-items:center;padding:2px";
  const back = el("button", "btn", "◂ Projects");
  back.title = "Back to the project board";
  back.addEventListener("click", () => { S.dockProject = null; paintTree(); });
  head.appendChild(back);
  const title = el("span", null, p ? (p.title || p.name) : name);
  title.style.cssText = "font-weight:bold;flex:1 1 auto;overflow:hidden;" +
                        "text-overflow:ellipsis;white-space:nowrap";
  head.appendChild(title);
  host.appendChild(head);

  const acts = el("div");
  acts.style.cssText = "flex:0 0 auto;display:flex;gap:4px;padding:0 2px 4px";
  const open = el("button", "btn", "▶ Open App");
  if (p && p.has_app) open.addEventListener("click", () => openApp(name));
  else { open.disabled = true; open.title = "No app yet -- ask for one below."; }
  acts.appendChild(open);
  const addTask = el("button", "btn", "+ Task");
  addTask.title = "Add a task to this project's board";
  addTask.addEventListener("click", async () => {
    await newTask(name);
    paintTree();
  });
  acts.appendChild(addTask);

  /* Archive: the answer to a finished project, and the reason Delete
     stopped being the only one.

     Deleting is right for a half-built idea nobody wants. It is wrong
     for work that got DONE -- which is the case that actually fills the
     dock, and where the only options were "keep it in the list forever"
     or "destroy the app, the board and the conversation". Archiving is
     a flag: everything stays exactly where it is, the project leaves
     the default list, and "show archived" brings it back. No
     confirmation, because nothing is lost and the undo is the same
     button. */
  const arch = el("button", "btn", p && p.archived ? "Unarchive" : "Archive");
  arch.title = p && p.archived
    ? "Put this project back in the list"
    : "File this away: it stays on disk, and leaves the projects list";
  arch.addEventListener("click", async () => {
    arch.disabled = true;
    try {
      await api("/v1/projects/" + name + "/archive",
                { method: "POST", body: { archived: !(p && p.archived) } });
      /* Archiving from inside the project's own pane: step back out to
         the board, since the pane is now showing something the list no
         longer offers a way back to. Unarchiving stays put -- you are
         looking at it because you want it back. */
      if (!(p && p.archived)) { S.dockProject = null; S.selected = null; }
      await loadProjects();
      paintTree();
    } catch (e) { alert(e.message); arch.disabled = false; }
  });
  acts.appendChild(arch);

  /* Delete. Every experiment used to be permanent: a desktop accumulated
     every half-built idea with no way to clear one out, so the icon grid
     and the tree filled with things nobody wanted to look at again. The
     store has always been able to remove a project; only the UI was
     missing.

     Guarded by a typed confirmation rather than an OK button, because
     this removes the app, its conversation and its whole task board, and
     an accidental click on a crowded pane is exactly how that happens. */
  const del = el("button", "btn", "Delete");
  del.title = "Remove this project, its app and its tasks";
  del.style.marginLeft = "auto";
  del.addEventListener("click", async () => {
    const label = (p && (p.title || p.name)) || name;
    if (!confirm(`Delete "${label}"?\n\n` +
                 `Its app, its conversation and its ${p && p.tasks || 0} task(s) ` +
                 `go with it. This cannot be undone.`)) return;
    del.disabled = true;
    try {
      await api("/v1/projects/" + name, { method: "DELETE" });
      /* Close anything still showing it -- an app window pointed at a
         deleted project is a frame that will 404 on its next reload. */
      const aw = WINS.get("app:" + name);
      if (aw) closeWindow(aw);
      PROJECT_CHATS.delete(name);
      S.dockProject = null;
      S.selected = null;
      await loadProjects();
      paintTree();
    } catch (e) { alert(e.message); del.disabled = false; }
  });
  acts.appendChild(del);
  host.appendChild(acts);

  /* The open tasks, compactly -- the board's summary, not its replacement.
     The full tree (jobs included) is one click back. */
  const st = S.tree[name] || (S.tree[name] = { open: true, tasks: null });
  if (!st.tasks) loadTasks(name).then(() => {
    if (S.dockProject === name) paintTree();
  });
  const open_ = (st.tasks || []).filter(t => t.status !== "done");
  if (open_.length) {
    const tl = el("div");
    tl.style.cssText = "flex:0 0 auto;max-height:30%;overflow:auto;" +
                       "padding:0 2px 4px";
    open_.forEach(t => {
      const tr = el("div", "node");
      tr.appendChild(el("span", "st-" + t.status, t.id + "  " + t.title));
      tr.title = t.notes || "";
      tl.appendChild(tr);
    });
    host.appendChild(tl);
  }

  /* The chat, filling the rest -- unless the app window has it.

     One conversation, one place: when the app is open its window is the
     home (the point of the left bar is having the app beside the words
     that change it), and the dock says where it went rather than showing
     a second, emptier copy of the same thing. */
  const pane = el("div");
  pane.style.cssText = "flex:1 1 auto;min-height:0;padding:2px";
  host.appendChild(pane);
  const aw = WINS.get("app:" + name);
  if (aw && aw.__chatShown && aw.__chatShown()) {
    const note = el("div", "muted");
    note.style.cssText = "padding:6px;font-size:11px";
    note.appendChild(el("div", null, "The conversation is in the app window."));
    const go = el("button", "btn", "Show it");
    go.style.marginTop = "6px";
    go.addEventListener("click", () => { restoreWindow(aw); focusWindow(aw); });
    note.appendChild(go);
    pane.appendChild(note);
    return;
  }
  showChatIn(name, pane).focus();
}

function paintTree() {
  const host = document.getElementById("treebody");
  if (!host) return;
  if (S.dockProject) return paintProjectPane(S.dockProject);
  host.style.display = "";
  host.style.flexDirection = "";
  while (host.firstChild) host.removeChild(host.firstChild);
  const tree = el("div", "tree");

  /* The way back to filed-away work. Only shown when there IS some --
     an "archive" that is always empty is just a word taking up a row.

     A function, and called from BOTH exits, because the empty-list
     branch below returns early: archive every project and the dock
     said "No projects yet" with no way back, so the only route to
     un-archive anything was the HTTP API. A door you can lock yourself
     out of is not a door. (Codex P1 on #593.) */
  function appendArchiveToggle() {
    if (!S.archivedCount && !S.showArchived) return;
    const foot = el("div", "node muted");
    foot.style.marginTop = "4px";
    foot.appendChild(el("span", "twist", S.showArchived ? "▼" : "▶"));
    foot.appendChild(el("span", null, S.showArchived
      ? "hide archived"
      : "show archived (" + S.archivedCount + ")"));
    foot.addEventListener("click", async () => {
      S.showArchived = !S.showArchived;
      await loadProjects();
    });
    tree.appendChild(foot);
  }

  if (!S.projects.length) {
    /* "No projects yet" is a lie when there are several, filed away.
       Say which empty this is, since the two want opposite next
       moves: one wants you to make something, the other wants you to
       look in the archive. */
    if (S.archivedCount) {
      tree.appendChild(el("div", "node muted", "Nothing active."));
      tree.appendChild(el("div", "node muted",
        "Everything here is archived."));
    } else {
      tree.appendChild(el("div", "node muted", "No projects yet."));
      tree.appendChild(el("div", "node muted", "Ask PasClaw to build one."));
    }
    appendArchiveToggle();
    host.appendChild(tree);
    return;
  }

  S.projects.forEach(p => {
    const st = S.tree[p.name] || (S.tree[p.name] = { open: false, tasks: null });

    const row = el("div", "node" + (S.selected === p.name ? " sel" : ""));
    const tw = el("span", "twist", st.open ? "▼" : "▶");
    row.appendChild(tw);
    const g = el("span"); g.style.cssText = "width:14px;height:14px;flex:0 0 14px";
    g.innerHTML = icon(p.has_app ? "app" : "folder");
    row.appendChild(g);
    const nameCell = el("span", null, p.title || p.name);
    row.appendChild(nameCell);
    /* Say what state the board is in, in the row itself.

       The open-task badge only ever appeared when there WAS open work,
       so a finished board and an empty one and a busy one all looked
       identical the moment the count hit zero -- which is what made a
       done project sit in the list looking like live work. A finished
       board gets a tick; an archived one says so and greys out. */
    if (p.open_tasks) {
      row.appendChild(el("span", "badge", String(p.open_tasks)));
    } else if (p.blocked_tasks) {
      /* Nothing open and not finished means everything left is BLOCKED
         -- work waiting on somebody. Marking it needs saying, because
         the alternative is a row with no badge at all, and a project
         whose every task is stuck would look quieter than one that is
         merely idle. That is the same disappearing act this whole
         change is against. */
      const b = el("span", "badge", "⊘ " + p.blocked_tasks);
      b.title = p.blocked_tasks + " blocked task(s) -- waiting on something";
      row.appendChild(b);
    } else if (p.finished) {
      const done = el("span", "badge", "✓");
      done.title = p.tasks + " task(s), all done";
      done.style.opacity = ".65";
      row.appendChild(done);
    }
    if (p.archived) {
      row.style.opacity = ".55";
      const a = el("span", "muted", "archived");
      a.style.fontSize = "10px";
      row.appendChild(a);
    }
    /* The twist expands in place (tasks, jobs -- the board view); the row
       itself OPENS the project, turning the dock into its chat + actions.
       That split is the whole gesture: a task is "modify the app to do X",
       so opening a project should land you where you can say so. */
    tw.addEventListener("click", async e => {
      e.stopPropagation();
      S.selected = p.name;
      st.open = !st.open;
      if (st.open && !st.tasks) await loadTasks(p.name);
      paintTree();
    });
    row.addEventListener("click", async () => {
      S.selected = p.name;
      S.dockProject = p.name;
      if (!st.tasks) await loadTasks(p.name);
      paintTree();
    });
    tree.appendChild(row);

    if (!st.open) return;

    /* Finished tasks fold away.

       A board never forgets, which is right for the record and wrong
       for a dock: after a team has worked a project for a day the list
       is mostly history, and the two things you still have to do are
       somewhere in the middle of it. Done tasks collapse behind one
       row that says how many there are; clicking it puts them back.
       Nothing is hidden that you cannot see in one click, and nothing
       is deleted. */
    const all  = st.tasks || [];
    const done = all.filter(t => t.status === "done");
    const live = all.filter(t => t.status !== "done");
    const shown = st.showDone ? all : live;

    if (done.length && !st.showDone) {
      const fold = el("div", "node muted");
      fold.style.paddingLeft = "18px";
      fold.appendChild(el("span", "twist", "▶"));
      fold.appendChild(el("span", null, done.length + " done"));
      fold.title = "Show the finished tasks";
      fold.addEventListener("click", e => {
        e.stopPropagation();
        st.showDone = true;
        paintTree();
      });
      tree.appendChild(fold);
    }

    shown.forEach(t => {
      const tr = el("div", "node");
      tr.style.paddingLeft = "18px";
      const tt = el("span", "twist", t.jobs ? (t.__open ? "▼" : "▶") : "");
      tr.appendChild(tt);
      const lbl = el("span", "st-" + t.status,
        t.id + "  " + t.title + (t.assignee ? "  @" + t.assignee : ""));
      lbl.style.flex = "1 1 auto";
      tr.appendChild(lbl);
      tr.title = t.notes || "";

      /* Run the task. The route has always existed and the tree has
         always shown the jobs it produces -- there was simply no gesture
         to start one, so "run this task" meant leaving the desktop for
         curl. A task the agent is already working on is not offered the
         button; a finished one is, because re-running a done task is a
         normal thing to want. */
      if (t.status !== "active") {
        const run = el("button", "btn", "Run");
        run.title = "Hand this task to PasClaw and watch the job log";
        run.style.cssText = "padding:0 6px;font-size:10px;line-height:14px";
        run.addEventListener("click", async e => {
          e.stopPropagation();          /* not a row toggle */
          run.disabled = true;
          try {
            const j = await api(`/v1/projects/${p.name}/tasks/${t.id}/run`,
                                { method: "POST", body: {} });
            /* Open the log straight away: a job with nowhere to watch it
               is the same silence the Run button was added to end. The
               row's own state arrives on the event feed. */
            if (j && j.job) openJobLog(p.name, t.id, j.job);
          } catch (err) {
            /* 503 with no agent attached is the common one, and it is a
               setup state with a known cause -- say it rather than
               leaving a button that did nothing. */
            alert(err.message);
            run.disabled = false;
          }
        });
        tr.appendChild(run);
      }

      tr.addEventListener("click", async () => {
        if (!t.jobs) return;
        t.__open = !t.__open;
        if (t.__open && !t.__jobs) {
          const j = await api(`/v1/projects/${p.name}/tasks/${t.id}/jobs`);
          t.__jobs = j.jobs || [];
        }
        paintTree();
      });
      tree.appendChild(tr);

      if (!t.__open) return;
      (t.__jobs || []).forEach(job => {
        const jr = el("div", "node");
        jr.style.paddingLeft = "36px";
        jr.appendChild(el("span", "twist", ""));
        jr.appendChild(el("span", "st-" + (job.status === "failed" ? "blocked" :
          job.status === "running" ? "active" : "done"),
          job.id + "  " + job.status + (job.summary ? " -- " + job.summary : "")));
        jr.addEventListener("dblclick", () => openJobLog(p.name, t.id, job.id));
        tree.appendChild(jr);
      });
    });

    if (done.length && st.showDone) {
      const fold = el("div", "node muted");
      fold.style.paddingLeft = "18px";
      fold.appendChild(el("span", "twist", "▼"));
      fold.appendChild(el("span", null, "hide " + done.length + " done"));
      fold.addEventListener("click", e => {
        e.stopPropagation();
        st.showDone = false;
        paintTree();
      });
      tree.appendChild(fold);
    }

    const add = el("div", "node muted");
    add.style.paddingLeft = "18px";
    add.appendChild(el("span", "twist", "+"));
    add.appendChild(el("span", null, "New task..."));
    add.addEventListener("click", () => newTask(p.name));
    tree.appendChild(add);
  });

  appendArchiveToggle();

  host.appendChild(tree);
}

async function loadTasks(project) {
  const j = await api(`/v1/projects/${project}/tasks`);
  const st = S.tree[project] || (S.tree[project] = {});
  /* Carry the row's UI state across the reload. A task row remembers
     whether the user expanded it and the job list they expanded it to
     see, and those live on the task object -- so replacing the array
     wholesale collapsed every open row. That is worst exactly when it
     matters: running a task emits events, the board refreshes on them,
     and the job list you opened to watch snapped shut. Jobs are dropped
     rather than kept so the reopened row re-reads them; what is
     preserved is the user's gesture, not stale data. */
  const wasOpen = new Set((st.tasks || []).filter(t => t.__open).map(t => t.id));
  st.tasks = j.tasks || [];
  await Promise.all(st.tasks.filter(t => wasOpen.has(t.id)).map(async t => {
    t.__open = true;
    try {
      t.__jobs = (await api(`/v1/projects/${project}/tasks/${t.id}/jobs`)).jobs || [];
    } catch { t.__jobs = []; }
  }));
}

async function newProject() {
  const title = prompt("What should this project be called?", "");
  if (!title) return;
  try {
    const j = await api("/v1/projects", { method: "POST", body: { title } });
    await loadProjects();
    /* Land in the project pane, cursor in the chat: the next thing anyone
       does with a new project is describe the app they want. }*/
    S.selected = j.name;
    S.dockProject = j.name;
    paintTree();
  } catch (e) { alert(e.message); }
}

async function newTask(project) {
  const title = prompt("Task title:", "");
  if (!title) return;
  await api(`/v1/projects/${project}/tasks`, { method: "POST", body: { title } });
  await loadTasks(project);
  await loadProjects();
}

/* The agent keeps a working checklist through its todo_write tool, and the
   desktop watches those calls stream by in the chat -- so the checklist
   shows up on the project's task board instead of living only inside the
   model's head. Reconciled by title, never deleted: todo_write REPLACES
   the model's list each call, but a task that fell off the model's radar
   is still work someone asked for. Unchecked items are created as todo,
   checked ones are marked done.

   Serialized per project: one turn can rewrite the checklist several
   times, and two overlapping reconciles would both see "missing" and both
   create -- the very duplicates matching by title exists to prevent. */
const CHECKLIST_SYNC = new Map();

function mirrorChecklist(project, argsStr) {
  const items = [];
  try {
    (JSON.parse(argsStr).checklist || "").split("\n").forEach(ln => {
      const m = ln.match(/^\s*[-*]\s*\[([ xX])\]\s*(.+?)\s*$/);
      if (m) items.push({ done: m[1] !== " ", title: m[2] });
    });
  } catch { return; }
  if (!items.length) return;
  const prev = CHECKLIST_SYNC.get(project) || Promise.resolve();
  const next = prev.then(async () => {
    try {
      const j = await api(`/v1/projects/${project}/tasks`);
      const have = new Map();
      (j.tasks || []).forEach(t => { if (!have.has(t.title)) have.set(t.title, t); });
      /* Reconcile the items CONCURRENTLY.

         Each item touches a different task, so the writes do not depend
         on each other -- but awaiting them one at a time made a ten-item
         checklist ten sequential round trips, which is what stretched
         the resulting event burst well past any coalescing window and
         cost a full project reload every couple of items.

         Duplicate titles within ONE checklist are folded out first. The
         sequential version deduped them by accident -- the first create
         landed in `have`, so the second pass found it and skipped -- and
         concurrent creates would lose that and file the task twice. The
         server has no title uniqueness to fall back on. */
      const seen = new Set();
      const wanted = items.filter(
        it => !seen.has(it.title) && seen.add(it.title));

      /* allSettled, not all: Promise.all rejects the moment ONE write
         fails, which would release this project's queue while the other
         writes were still in flight -- and the next reconcile would then
         read a board that is still being written, re-create what it
         could not see, or let a stale status land on top of a newer one.
         Every launched request has to settle before the queue moves on;
         individual failures are reported by the catch below, which is
         where they were always handled. */
      const settled = await Promise.allSettled(wanted.map(async it => {
        const t = have.get(it.title);
        if (!t) {
          const made = await api(`/v1/projects/${project}/tasks`,
            { method: "POST", body: { title: it.title } });
          have.set(it.title, { id: made.id, status: "todo" });
          if (it.done)
            await api(`/v1/projects/${project}/tasks/${made.id}`,
              { method: "PATCH", body: { status: "done" } });
        } else if (it.done && t.status !== "done") {
          await api(`/v1/projects/${project}/tasks/${t.id}`,
            { method: "PATCH", body: { status: "done" } });
          t.status = "done";
        } else if (!it.done && t.status === "done") {
          /* The model walked it back: a later checklist unchecked the
             item because more work turned up. A board still claiming
             done would be lying, which is worse than reopening. */
          await api(`/v1/projects/${project}/tasks/${t.id}`,
            { method: "PATCH", body: { status: "todo" } });
          t.status = "todo";
        }
      }));
      /* allSettled means the catch below no longer sees these, so say so
         here instead of losing them. Still best effort -- a board that
         missed one item is not a reason to stop the conversation. */
      const failed = settled.filter(r => r.status === "rejected");
      if (failed.length)
        console.warn(`checklist mirror: ${failed.length} of ${wanted.length} ` +
                     `write(s) failed`, failed[0].reason);
      await loadProjects();
      if (S.tree[project]) { await loadTasks(project); paintTree(); }
    } catch {} /* best effort: the chat must not stall on the board */
  });
  CHECKLIST_SYNC.set(project, next);
}

/* ==========================================================================
   Chat -- per project, with artifact cards
   ========================================================================== */

/* ==========================================================================
   Turns you can stop

   A turn had no brake. Send disabled itself and the window sat on "..."
   until the answer came back -- and with the provider unreachable that
   is the relay's full wait, ten minutes of a dead window with nothing
   to press. It matters more now than it did: research digs until it is
   satisfied and a build runs to the iteration cap, so a turn started by
   mistake used to cost the surface it was started from.

   One controller per conversation. Starting a turn arms it, the button
   becomes Stop, and stopping aborts the fetch -- which rejects the read
   in progress, so whatever text had already arrived stays in the
   transcript and the turn is marked stopped rather than vanishing. */
function makeTurnControl(button, sendLabel) {
  let ctl = null;
  return {
    get signal() { return ctl ? ctl.signal : undefined; },
    get running() { return ctl !== null; },
    begin() {
      ctl = new AbortController();
      button.textContent = "Stop";
      button.title = "Stop this turn";
      return ctl.signal;
    },
    end() {
      ctl = null;
      button.textContent = sendLabel;
      button.title = "";
    },
    /* Returns true when it actually stopped something, so the caller can
       tell "stopped a turn" from "pressed Send with an empty box". */
    stop() {
      if (!ctl) return false;
      try { ctl.abort(); } catch {}
      ctl = null;
      button.textContent = sendLabel;
      return true;
    },
  };
}

/* An aborted fetch is not a failure to report -- it is what the user
   asked for. Everything else still is. */
function isAbort(e) {
  return e && (e.name === "AbortError" || /abort/i.test(String(e.message || "")));
}

/* ONE conversation per project, for the life of the page.

   Not one per window: a project used to be able to have its chat open in
   a floating window, the dock pane and the app window at once, three
   buildChatUI closures with three private transcripts on screen, and
   only the one you typed into showed what you had said. This map is the
   single instance; showChatIn re-parents its root DOM node to
   whichever surface is currently its home, and appendChild detaches it
   from the previous one, so two live copies cannot exist.

   "For the life of the page" is exactly one workspace long. The key is a
   project SLUG, and slugs repeat across workspaces by construction --
   the suite seeds notes, calendar and mail into every one -- so a cache
   that outlived a switch handed workspace 2 the conversation from
   workspace 1. dropProjectChats is what makes the life span true. */
const PROJECT_CHATS = new Map();

/* Forget every cached conversation.

   The server was never confused: /v1/sessions/desktop-<slug> resolves
   inside the ACTIVE workspace and would have returned the right
   transcript. The client simply never asked again, because it had one
   in hand under the same key. Dropping the instances makes the next
   open rebuild and re-read, which is the behaviour the sessions are
   already written for. */
function dropProjectChats() {
  for (const c of PROJECT_CHATS.values()) {
    /* Detach whatever surface is currently hosting it, so a pane that
       is repainted later cannot resurrect a dead conversation's node. */
    try { if (c.root && c.root.parentNode) c.root.parentNode.removeChild(c.root); }
    catch {}
  }
  PROJECT_CHATS.clear();
}

/* ===== chat rendering: markdown + tool cards =========================

   Ported from the web UI (webui.html), restyled for the desktop. Two
   ideas travel together:

   1. Assistant text renders as markdown. The renderer is safe by
      construction: everything is HTML-escaped FIRST and formatting is
      added back afterwards, links are http(s)-only and images
      http(s)/data:image-only, so a reply cannot smuggle script or a
      javascript: URL into the page.

   2. The tool summary lines the gateway weaves into the stream
      (⏺ call / ⎿ result) become collapsible cards, filled with the
      FULL arguments and result from the `pasclaw-tool` side-channel
      the stream also carries. The reply reads clean; the work is one
      click away. */

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}

function prettyJSON(s) {
  try { return JSON.stringify(JSON.parse(s), null, 2); } catch { return s; }
}

function mdCodeBlock(code, lang) {
  return '<div class="code-wrap"><div class="code-head">'
       + '<span>' + escapeHtml(lang || "code") + "</span>"
       + '<button class="btn copy-btn" type="button">copy</button></div>'
       + "<pre><code>" + escapeHtml(code) + "</code></pre></div>";
}

/* One listener for every copy button ever rendered, because chat bodies
   repaint while streaming and per-render wiring would leak or lapse. */
document.addEventListener("click", e => {
  const btn = e.target.closest && e.target.closest(".copy-btn");
  if (!btn) return;
  const wrap = btn.closest(".code-wrap");
  const code = wrap && wrap.querySelector("code");
  if (!code) return;
  const flash = () => {
    const prev = btn.textContent;
    btn.textContent = "copied";
    setTimeout(() => { btn.textContent = prev; }, 1200);
  };
  const text = code.textContent;
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(flash).catch(() => {});
  else {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); flash(); } catch {}
    document.body.removeChild(ta);
  }
});

function renderMarkdown(src) {
  const esc = escapeHtml;
  const inline = s => {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, (_, c) => '<code class="ic">' + c + "</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
    /* Images BEFORE links (![alt](url) contains [alt](url)). Only http(s)
       and data:image URLs, so no javascript:/other-scheme smuggling. */
    s = s.replace(/!\[([^\]]*)\]\((https?:\/\/[^)\s]+|data:image\/[a-z0-9.+-]+;base64,[a-z0-9+/=]+)\)/gi,
                  (_, alt, u) => '<img class="md-img" src="' + esc(u) + '" alt="' + esc(alt) + '" loading="lazy">');
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
                  (_, t, u) => '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + t + "</a>");
    return s;
  };
  const lines = String(src).split("\n");
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const ln = lines[i];
    const fence = ln.match(/^```(.*)$/);
    if (fence) {
      const lang = fence[1].trim();
      const code = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) { code.push(lines[i]); i++; }
      i++; /* closing fence, or run off the end of an unterminated block */
      out.push(mdCodeBlock(code.join("\n"), lang));
      continue;
    }
    const h = ln.match(/^(#{1,6})\s+(.*)$/);
    if (h) { out.push("<h" + h[1].length + ">" + inline(h[2]) + "</h" + h[1].length + ">"); i++; continue; }
    if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(ln)) { out.push("<hr>"); i++; continue; }
    if (/^>\s?/.test(ln)) {
      const q = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { q.push(lines[i].replace(/^>\s?/, "")); i++; }
      out.push("<blockquote>" + inline(q.join(" ")) + "</blockquote>");
      continue;
    }
    if (/^\s*[-*+]\s+/.test(ln)) {
      const items = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
        items.push("<li>" + inline(lines[i].replace(/^\s*[-*+]\s+/, "")) + "</li>"); i++;
      }
      out.push("<ul>" + items.join("") + "</ul>");
      continue;
    }
    if (/^\s*\d+\.\s+/.test(ln)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push("<li>" + inline(lines[i].replace(/^\s*\d+\.\s+/, "")) + "</li>"); i++;
      }
      out.push("<ol>" + items.join("") + "</ol>");
      continue;
    }
    if (/^\s*$/.test(ln)) { i++; continue; }
    const para = [];
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^```/.test(lines[i]) &&
           !/^#{1,6}\s/.test(lines[i]) && !/^\s*[-*+]\s+/.test(lines[i]) &&
           !/^\s*\d+\.\s+/.test(lines[i]) && !/^>\s?/.test(lines[i])) {
      para.push(lines[i]); i++;
    }
    out.push("<p>" + inline(para.join("\n")).replace(/\n/g, "<br>") + "</p>");
  }
  return out.join("\n");
}

const TV_CALL = "⏺", TV_RESULT = "⎿", TV_ERR = "✗";

function toolCard(call, results, detail) {
  let bodyHtml, isErr;
  if (detail && (detail.args !== undefined || detail.result !== undefined || detail.err !== undefined)) {
    /* Rich body from the side-channel or the record: full args + full
       result/error. */
    isErr = detail.err !== undefined && detail.err !== "";
    let h = "";
    if (detail.args) h += '<div class="tc-h">args</div><pre>' + escapeHtml(prettyJSON(detail.args)) + "</pre>";
    if (isErr) h += '<div class="tc-h">error</div><pre>' + escapeHtml(detail.err) + "</pre>";
    else if (detail.result !== undefined) h += '<div class="tc-h">result</div><pre>' + escapeHtml(detail.result || "(no output)") + "</pre>";
    bodyHtml = h || "<pre>(no detail)</pre>";
  } else {
    /* Fallback: the streamed ⎿ summary is all we have. */
    const body = (results || []).join("\n").trim();
    isErr = body.indexOf(TV_ERR) >= 0;
    bodyHtml = "<pre>" + (body ? escapeHtml(body) : "(no result)") + "</pre>";
  }
  return '<details class="tcard' + (isErr ? " err" : "") + '">'
       + '<summary><span class="tc-call">' + escapeHtml(call) + "</span></summary>"
       + '<div class="tc-body">' + bodyHtml + "</div>"
       + "</details>";
}

/* Assistant text -> HTML: markdown for the prose, cards for the ⏺/⎿
   runs. A parallel batch announces EVERY call before ANY result and the
   gateway blank-lines between them, so collect the run of calls, then
   the run of results, and pair BY INDEX -- "result follows its call"
   mis-assigns parallel batches. `tools` (from pairToolDetails or the
   record) enriches the Nth card with full args/result. */
function renderAssistantHTML(src, tools) {
  const lines = String(src).split("\n");
  const out = [];
  let buf = [], cardIdx = 0;
  const strip = ln => ln.replace(/^\s+/, "");
  const isCall = ln => strip(ln).startsWith(TV_CALL);
  const isResult = ln => strip(ln).startsWith(TV_RESULT);
  const flush = () => { if (buf.length) { out.push(renderMarkdown(buf.join("\n"))); buf = []; } };
  let i = 0;
  while (i < lines.length) {
    if (isCall(lines[i])) {
      flush();
      const calls = [], results = [];
      while (i < lines.length && (isCall(lines[i]) || strip(lines[i]) === "")) {
        if (isCall(lines[i])) calls.push(strip(lines[i]).slice(TV_CALL.length).trim());
        i++;
      }
      while (i < lines.length && isResult(lines[i])) {
        results.push(strip(lines[i]).slice(TV_RESULT.length).trim());
        i++;
      }
      for (let k = 0; k < calls.length; k++) {
        out.push(toolCard(calls[k], results[k] !== undefined ? [results[k]] : [],
                          tools && tools[cardIdx]));
        cardIdx++;
      }
    } else { buf.push(lines[i]); i++; }
  }
  flush();
  return out.join("\n");
}

/* Walk the side-channel call/result events into per-card
   {name,args,result,err} records aligned to call order. Results attach
   to the EARLIEST still-open call (FIFO), preferring a name match, so
   two parallel fs_reads keep their own results. */
function pairToolDetails(events) {
  const pairs = [];
  for (const e of events || []) {
    if (!e || !e.t) continue;
    if (e.t === "call") { pairs.push({ name: e.name || "", args: e.args || "" }); continue; }
    const open = p => p.result === undefined && p.err === undefined;
    let tgt = null;
    for (let i = 0; i < pairs.length; i++)
      if (open(pairs[i]) && pairs[i].name === e.name) { tgt = pairs[i]; break; }
    if (!tgt) for (let i = 0; i < pairs.length; i++)
      if (open(pairs[i])) { tgt = pairs[i]; break; }
    if (tgt) { if (e.err) tgt.err = e.err; else tgt.result = e.result || ""; }
  }
  return pairs;
}

/* Paint an assistant body as markdown + cards, keeping whichever cards
   the reader had open. Streaming repaints the same body many times;
   without the save/restore every repaint would slam their card shut. */
function paintAssistant(bodyEl, text, toolEvents) {
  const open = new Set();
  bodyEl.querySelectorAll("details.tcard").forEach((d, i) => { if (d.open) open.add(i); });
  bodyEl.classList.add("md");
  bodyEl.innerHTML = renderAssistantHTML(text, pairToolDetails(toolEvents));
  bodyEl.querySelectorAll("details.tcard").forEach((d, i) => { if (open.has(i)) d.open = true; });
}

/* The same cards, rebuilt from the RECORD for a reopened conversation.

   The stored transcript has the whole story -- assistant turns carry
   their tool_calls (name + args), tool turns carry the results, paired
   by tool_call_id -- so a chat reopened tomorrow shows the same
   receipts it showed while it ran, with no separate blob to keep in
   step. Returns one node per assistant-with-tools turn, cards
   collapsed. `results` maps tool_call_id -> {content, name}. */
function recordToolCards(m, results) {
  const host = el("div");
  (m.tool_calls || []).forEach(tc => {
    const r = results.get(tc.id);
    const args = tc.args || "";
    let key = "";
    try {
      const a = JSON.parse(args);
      key = a.path || a.command || a.query || a.action || a.title || "";
    } catch {}
    const call = tc.name + "(" + (key ? JSON.stringify(key) : "") + ")";
    const detail = { name: tc.name, args };
    if (r) {
      if (/^ERROR:/i.test(r.content || "")) detail.err = r.content;
      else detail.result = r.content || "";
    }
    host.insertAdjacentHTML("beforeend", toolCard(call, [], detail));
  });
  return host.childElementCount ? host : null;
}

function projectChat(project) {
  let c = PROJECT_CHATS.get(project);
  if (!c) { c = buildChatUI(project); PROJECT_CHATS.set(project, c); }
  return c;
}

function showChatIn(project, hostEl) {
  const c = projectChat(project);
  if (c.root.parentNode !== hostEl) hostEl.appendChild(c.root);
  return c;
}

/* Where a project's conversation belongs, and how to get there.

   An app's chat surface IS the left bar of its app window -- ask for the
   chat and you get the app with the conversation beside it, because what
   you are about to say is nearly always about what you are looking at. A
   project with no app yet has no such window, so its conversation lives
   in the dock's project pane until the first app exists. */
function openChat(project) {
  const p = S.projects.find(x => x.name === project);
  if (p && p.has_app && p.app_ready) return openApp(project, { chat: true });
  S.selected = project;
  S.dockProject = project;
  $("#dock").classList.remove("hidden");
  $("#stage").classList.remove("wide");
  paintTree();
  return null;
}

/* The chat itself. Built once per project (see projectChat) and moved
   between surfaces rather than rebuilt, so the visible transcript, the
   streaming state and the composer's draft follow the conversation
   wherever it is shown -- and closing the window that happened to be
   hosting it does not end it. */
function buildChatUI(project) {
  const wrap = el("div", "chat");
  const log = el("div", "log in");
  const composer = el("div", "composer");
  const ta = el("textarea", "fld");
  ta.placeholder = "Describe the app you want. PasClaw builds it here.";
  const send = el("button", "btn", "Send");
  const turn = makeTurnControl(send, "Send");
  composer.appendChild(ta); composer.appendChild(send);
  wrap.appendChild(log); wrap.appendChild(composer);

  function addMsg(who, text, cls) {
    const m = el("div", "msg " + (cls || ""));
    m.appendChild(el("div", "who", who));
    const b = el("div", "body", text);
    m.appendChild(b);
    log.appendChild(m);
    log.scrollTop = log.scrollHeight;
    return b;
  }

  /* ---- the conversation lives on the server ---- */

  /* One session file per project, so a reload -- or a different browser
     against the same gateway -- reopens the conversation rather than
     starting a stranger's. The id is derived, not stored: a project slug
     is already a safe session id, and deriving it means there is no
     mapping to keep in step. */
  const sessionId = "desktop-" + project;

  /* There is no saveHistory, and no local transcript to save.

     PasClaw files a session for everything it does -- the CLI and the
     TUI run their loop against one and it is on disk when the turn
     ends. The desktop used to be the exception: it kept the whole
     conversation in a JS array, sent that array as the request context,
     and PUT it back afterwards. Now the browser sends what the person
     just typed, with session_context, and the gateway loads the stored
     conversation, answers with it, and files the result. The window is
     a VIEW of a conversation the server owns -- which is what every
     other PasClaw surface already was.

     And the view reads the RECORD, not the live transcript. The live
     file is the model's working context -- post-compaction, bounded --
     while the record (<id>.log.jsonl) is the whole conversation,
     including what compaction dropped. The reader gets the record,
     paged; the model's context is the gateway's business and nothing
     here fetches it. */

  /* How much of the record to paint at once, and how much more each
     time the reader asks. Measured before picking a number: painting a
     1500-turn conversation in one go took 10.4 s and 9007 DOM nodes,
     and 600 turns took 3.2 s. 120 messages lands under 400 nodes and
     paints in the tens of milliseconds, which is the only budget that
     makes opening a chat feel like opening a window. */
  const PAGE = 120;
  let oldestShown = 0, recordTotal = 0, loadingOlder = false;

  /* Render a page of the record. Returns the nodes in order so the
     backwards pager can insert them before what it already shows.

     A batch rather than one message at a time, because tool work in
     the record spans messages: the assistant turn carries the CALLS
     (name + args), and the results arrive as separate tool turns
     paired by tool_call_id. Rendered per-message there is nothing to
     pair against; rendered as a batch, a reopened conversation shows
     the same collapsible cards it showed while it ran. A call whose
     result landed on the other side of a page boundary shows the call
     with no result -- rare, and honest about what this page holds. */
  function renderRecordBatch(msgs) {
    const nodes = [];
    const results = new Map();
    msgs.forEach(m => {
      if (m.role === "tool" && m.tool_call_id)
        results.set(m.tool_call_id, { content: m.content || "", name: m.name || "" });
    });
    msgs.forEach(m => {
      if (m.role === "user") {
        if ((m.content || "").trim())
          nodes.push(addMsg("you", m.content, "u").parentNode);
        return;
      }
      if (m.role !== "assistant") return;   /* tool turns fed the cards */
      if (m.tool_calls && m.tool_calls.length) {
        const cards = recordToolCards(m, results);
        if (cards) { log.appendChild(cards); nodes.push(cards); }
      }
      if ((m.content || "").trim()) {
        const b = addMsg("pasclaw", "");
        paintAssistant(b, m.content, null);
        nodes.push(b.parentNode);
      }
    });
    return nodes;
  }

  /* Older messages, prepended, with the reading position kept.

     Prepending changes scrollHeight under the reader, so the pixel
     they were looking at moves. Restoring by delta rather than by a
     saved scrollTop is what stops the view from jumping to a
     different part of the conversation on every page. */
  async function loadOlder() {
    if (loadingOlder || oldestShown <= 0) return;
    loadingOlder = true;
    const want = Math.max(0, oldestShown - PAGE);
    try {
      const j = await api(`/v1/sessions/${sessionId}?full=1&offset=${want}` +
                          `&limit=${oldestShown - want}`);
      const msgs = (j && j.messages) || [];
      const before = log.scrollHeight, top = log.scrollTop;
      const first = log.firstChild;
      renderRecordBatch(msgs).forEach(node => log.insertBefore(node, first));
      oldestShown = j.offset || 0;
      log.scrollTop = top + (log.scrollHeight - before);
      paintEarlier();
    } catch {}
    loadingOlder = false;
  }

  /* The affordance, and the honest count next to it. */
  let earlierBar = null;
  function paintEarlier() {
    if (earlierBar) { earlierBar.remove(); earlierBar = null; }
    if (oldestShown <= 0) return;
    earlierBar = el("div", "msg");
    const b = el("button", "btn", `Load ${Math.min(PAGE, oldestShown)} earlier ` +
                                  `(${oldestShown} before this)`);
    b.addEventListener("click", () => loadOlder());
    earlierBar.appendChild(b);
    log.insertBefore(earlierBar, log.firstChild);
  }

  /* Reaching the top asks for more, so the common gesture needs no
     button. The button stays for the reader who does not scroll. */
  log.addEventListener("scroll", () => {
    if (log.scrollTop < 40) loadOlder();
  });

  async function loadHistory() {
    /* One request, three graceful shapes: the newest window of the
       record when a log exists; the live transcript when the session
       predates the log (no total -> no earlier bar); and an empty 200
       for a project never chatted to, so a first run does not paint
       the console red. */
    let rec = null;
    try {
      rec = await api(`/v1/sessions/${sessionId}?full=1&limit=${PAGE}` +
                      `&if_absent=empty`);
    } catch { return; }            /* a real failure -- start blank */
    const msgs = (rec && rec.messages) || [];
    if (!msgs.length) return;
    recordTotal = (rec && rec.total) || msgs.length;
    oldestShown = (rec && typeof rec.offset === "number") ? rec.offset : 0;
    renderRecordBatch(msgs);
    paintEarlier();
    addMsg("desktop", "— earlier conversation, reopened —", "");
    log.scrollTop = log.scrollHeight;

  }

  /* Every card in this conversation, oldest first. A card is only "old"
     once a later turn made another one, which is why this list exists
     rather than a flag on each card. */
  const cards = [];

  /* An artifact card: the turn produced or updated something runnable.
     Pinned to the message that made it, so scrolling back through a
     conversation is scrolling back through versions -- and an old card
     opens the version THAT turn produced, not whatever the app is now.

     The body is captured when the card is made, because there is nowhere
     else to get it from later: the app directory holds one file and each
     turn overwrites it. */
  function addArtifact(kind, name, opener, body) {
    const card = el("div", "artifact");
    const g = el("div", "ico");
    g.innerHTML = icon(kind === "page" ? "page" : "app");
    card.appendChild(g);
    const meta = el("div", "meta");
    meta.appendChild(el("div", "nm", name));
    const kd = el("div", "kd", kind === "page" ? "page -- document" : "app -- " + kind);
    meta.appendChild(kd);
    card.appendChild(meta);
    const run = el("button", "btn", "\u25b6 Run");
    const rec = { card, kd, run, body: body || "", opener };
    /* Everything before this one is now a previous version. */
    cards.forEach(c => markOld(c));
    cards.push(rec);
    run.addEventListener("click", () => {
      if (rec.old) openVersion(rec); else rec.opener();
    });
    card.appendChild(run);
    log.appendChild(card);
    log.scrollTop = log.scrollHeight;
  }

  function markOld(rec) {
    if (rec.old) return;
    rec.old = true;
    rec.kd.textContent += "  \u2014 earlier version";
    /* A card with nothing captured cannot show a version, so it stops
       claiming it can rather than opening the current app and pretending
       that is what this turn made. */
    if (!rec.body) { rec.run.disabled = true; rec.run.title = "not captured"; }
    else rec.run.textContent = "\u25b6 View";
  }

  /* Open a captured version, read-only, in its own window. Nothing on disk
     is touched until Restore is pressed -- looking at an old draft should
     not be a decision. */
  function openVersion(rec) {
    const w = createWindow({
      title: "Earlier version", width: 620, height: 460, icon: "page", pad: false,
    });
    const bar = el("div");
    bar.style.cssText = "display:flex;gap:4px;padding:3px;align-items:center";
    bar.appendChild(el("div", "muted", "This is what that turn produced."));
    const spacer = el("div"); spacer.style.flex = "1 1 auto"; bar.appendChild(spacer);
    const restore = el("button", "btn", "Restore this version");
    bar.appendChild(restore);
    w.body.appendChild(bar);

    /* srcdoc + the same sandbox the live app gets: an old version is model
       output too, and being old does not make it trusted. */
    const frame = el("iframe", "app");
    frame.setAttribute("sandbox", "allow-scripts allow-forms");
    frame.style.height = "calc(100% - 30px)";
    frame.srcdoc = rec.body;
    w.body.appendChild(frame);

    restore.addEventListener("click", async () => {
      if (!confirm("Put this version back as the current app?\n\n" +
                   "The version on disk now will be replaced.")) return;
      restore.disabled = true;
      try {
        await api(`/v1/apps/${project}/entry`, { method: "PUT", body: rec.body });
        closeWindow(w);
        rec.opener();
      } catch (e) {
        addMsg("desktop", "Could not restore: " + e.message);
        restore.disabled = false;
      }
    });
    return w;
  }

  /* True between a plan turn landing and its approval.

     The approve card invites "ask for changes", and a change typed into
     the composer goes through plain submit() -- which would have sent it
     as a BUILD turn, re-arming every mutating tool before anyone pressed
     Approve, while the stale approval card sat there offering to do what
     had already happened. A conversation with a plan awaiting approval
     stays in plan mode until the approval handler says otherwise. */
  let planPending = false;

  async function submit(mode) {
    await ready;
    if (turn.running) return;      /* one turn at a time */
    /* Explicit mode wins (the approve handler passes "build"); otherwise
       a pending plan keeps the conversation read-only. */
    if (!mode && planPending) mode = "plan";
    const text = ta.value.trim();
    if (!text) return;
    ta.value = "";
    addMsg("you", text, "u");

    const body = addMsg("pasclaw", "");
    /* Send becomes Stop for the duration -- not disabled, because a turn
       you cannot interrupt is the thing being fixed here. */
    const signal = turn.begin();
