name: Windows installers

# Hybrid packaging: you build the Delphi (self-contained) binaries locally and
# attach them to a GitHub Release; this hosted job runs Inno Setup against them
# and uploads the two installers back to the same release. No Delphi (and no
# license) is needed in CI.
#
# Flow:
#   1. Build Release/Win64 + Release/Win32 of src\pasclaw\PasClaw.dproj locally.
#   2. Create a Release (tag e.g. v0.2.0) and attach the two exes named exactly:
#         PasClaw-x64.exe   (the Win64 build)
#         PasClaw-x86.exe   (the Win32 build)
#   3. Publishing the release triggers this workflow, which packages and
#      attaches PasClaw-<ver>-x64-setup.exe and PasClaw-<ver>-x86-setup.exe.
#      (Re-run manually via "Run workflow" and pass the tag if needed.)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package (must have PasClaw-x64.exe / PasClaw-x86.exe attached)"
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag + version
        id: v
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'release') { '${{ github.event.release.tag_name }}' } else { '${{ github.event.inputs.tag }}' }
          if (-not $tag) { throw "no tag" }
          $ver = $tag -replace '^v',''
          "tag=$tag"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$ver"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "tag=$tag version=$ver"

      - name: Download the Delphi-built binaries from the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          foreach ($a in @('PasClaw-x64.exe','PasClaw-x86.exe')) {
            gh release download '${{ steps.v.outputs.tag }}' -p $a -D bin
            if (Test-Path "bin/$a") { Write-Host "got $a" }
            else { Write-Host "::warning::$a is not attached to the release -- skipping that arch" }
          }
          if (-not (Test-Path bin\PasClaw-x64.exe) -and -not (Test-Path bin\PasClaw-x86.exe)) {
            throw "neither PasClaw-x64.exe nor PasClaw-x86.exe was attached to the release"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installers
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $ver  = '${{ steps.v.outputs.version }}'
          if (Test-Path bin\PasClaw-x64.exe) {
            & $iscc /DArch=x64 /DMyAppVersion=$ver "/DSourceExe=$PWD\bin\PasClaw-x64.exe" installer\pasclaw.iss
            if ($LASTEXITCODE -ne 0) { throw "iscc x64 failed" }
          }
          if (Test-Path bin\PasClaw-x86.exe) {
            & $iscc /DArch=x86 /DMyAppVersion=$ver "/DSourceExe=$PWD\bin\PasClaw-x86.exe" installer\pasclaw.iss
            if ($LASTEXITCODE -ne 0) { throw "iscc x86 failed" }
          }
          Get-ChildItem installer\Output

      - name: Upload installers to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem installer\Output\*.exe | ForEach-Object { $_.FullName }
          if ($files) { gh release upload '${{ steps.v.outputs.tag }}' @files --clobber }
          else { throw "no installers were produced" }
